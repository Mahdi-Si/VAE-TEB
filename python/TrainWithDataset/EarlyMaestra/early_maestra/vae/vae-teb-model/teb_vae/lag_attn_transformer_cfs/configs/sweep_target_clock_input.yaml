# Forecast-clock diagnostic arm: each target channel scored at the continuation of its own DELAYED
# input stream (s_c = -d_c), so a channel delayed by d_c steps has its first labels before the
# actual anchor. It is a continuation task over a restricted information set, not a forecast of
# unavailable observations, and it needs an aligned target (the shift it copies), so it carries the
# single-reference alignment with it.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_transformer_cfs.trainer --config teb_vae/lag_attn_transformer_cfs/configs/sweep_target_clock_input.yaml
base: default.yaml

model_config:
  VAE_model:
    causal_align_reference: target_max
    causal_target_forecast_clock: input

advanced_config:
  tracking:
    mlflow:
      # IDENTITY: the arm in the name, on both keys, so a run's own records say which arm trained
      # even if the config it was launched from cannot be recovered.
      run_name: lag_attn_trf_cfs_clock_input
      tags:
        variant: lag_attn_trf_cfs_clock_input

# Decoder-depth arm: three dilated refine blocks instead of four.
#
# THE QUESTION THIS ARM ASKS MOVES WITH THE HORIZON, and the header says so rather than leaving a
# reader to recompute it. At kernel 3 the dilations are 2^i, so depth d spans 1 + 2(2^d - 1)
# horizon tokens -- 15 at depth 3 and 31 at depth 4 -- and the family's recorded criterion is
# RF >= H + 1. At the shipped H = 10 that is 11: depth 4 clears it by twenty tokens and depth 3 clears it
# by four, so this arm halves the refine stack's reach while keeping it above the block it must cover.
# (At H = 15 depth 3 missed by one; at H = 30 depth 4 met the criterion exactly.)
#
# The argument is still moot in both directions on reachability alone, because
# `horizon_attention_blocks: 2` mixes every horizon token unmasked after the refine stack, so no
# horizon token is out of reach at either depth. What the arm measures is whether the LOCAL dilated
# path's extra reach matters when both depths already cover the block.
#
# So the real case for depth 3 is parameter economy -- 328,960 fewer parameters -- and the case
# against it is that a difference between this cell and the sibling would then have two candidate
# explanations. This arm is what separates them: if it reads the same, the depth was never carrying
# the comparison.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_cfs.trainer --config teb_vae/lag_attn_cfs/configs/sweep_horizon_depth_3.yaml
base: default.yaml

model_config:
  VAE_model:
    horizon_depth: 3

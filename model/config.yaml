general_config:
  tag: seqvae_teb_experiment_latent_16_B1e-3_from_checkpoint__
  cuda_devices: [0, 1, 2, 3, 4, 5, 6]
  lr: 0.0001
  lr_milestone: [400, 800]
  weight_decay: 0.0001
  checkpoint_frequency: 1
  plot_frequency: 1
  epochs: 10000
  accumulate_grad_batches: 1
  batch_size:
    train: 1700
    test: 1700
  
  # SOTA Training Optimizations
  optimization:
    compile_model: true              # Enable torch.compile
    compile_mode: "max-autotune"     # Most aggressive optimization
    fused_optimizer: true            # Enable fused AdamW
    channels_last: false             # Memory format optimization (not beneficial for 1D data)

model_config:
  VAE_model:
    freeze_seqvae: False
    zero_source: False
    context_len: 75            # Latent forecaster context length (decimated steps)
    horizon_len: 30            # Forecast horizon (decimated steps -> 2 minutes at 4 Hz)

    # Beta Scheduling Configuration
    beta_schedule: constant     # Options: 'constant', 'linear', 'cyclic'
    beta_start: 0.0            # Starting beta value for annealing schedules
    beta_end: 1.0              # Final beta value for TEB
    beta_anneal_epochs: 50     # Number of epochs for linear annealing
    beta_cycle_len: 1000       # Cycle length for cyclic annealing
    beta_const_val: 0.001        # Constant beta value when schedule='constant'
    kld_beta: 0.001              # Fallback beta value (legacy parameter)

    # Forecasting auxiliary objectives
    predictive_weight: 0.5              # Weight on raw forecast NLL auxiliary loss
    latent_consistency_weight: 0.1      # Weight on latent-space consistency loss
    predictive_horizon: null            # Override horizon for auxiliary loss (defaults to horizon_len)
    predictive_context_len: null        # Override context length (defaults to context_len)
    predictive_max_anchors: 0           # Max anchors (0 = use all) for auxiliary losses
    log_forecast_metrics: true          # Log aggregated forecast metrics during validation
    monitor_metric: "val/predictive_loss"  # Metric to monitor for checkpoints / early stopping
    monitor_mode: "min"                 # Direction for monitored metric

  base_model_checkpoint: /data/deid/isilon/MS_model/seq_vae_teb_results/pre_training/2025-08-28--[13-19]--seqvae_teb_experiment_latent_16_B1e-4/model_checkpoints/base-model-best-epoch=997.ckpt
  legacy_seqvae_checkpoint: null  # Optional legacy SeqVaeTeb checkpoint (no latent forecaster)

folders_config:
  out_dir_base: /data/deid/isilon/MS_model/seq_vae_teb_results/pre_training

dataset_config:
    vae_train_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/pre_training_dataset/train_dataset_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/pre_training_dataset/train_dataset_no_cs.hdf5
    vae_test_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/pre_training_dataset/test_dataset_no_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/pre_training_dataset/test_dataset_cs.hdf5
    stat_path: /data/deid/isilon/MS_model/Q4_stats/stats.hdf5
    dataloader_config:
      num_workers: 0
      normalize_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph']
      # These are for CombinedHDF5Dataset
      dataset_kwargs:
        load_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph', 'epoch', 'guid']
        allowed_guids: null
        cs_label: null
        bg_label: null
        epoch_min: null
        epoch_max: null
        label: null
        cache_size: 2000
        trim_minutes: 2.0  # how much to trim from start and end of the signal

seqvae_testing:
  test_checkpoint_path: /data/deid/isilon/MS_model/seq_vae_teb_results/pre_training/2025-08-28--[13-19]--seqvae_teb_experiment_latent_16_B1e-4/model_checkpoints/base-model-best-epoch=997.ckpt
  
  # Test Analysis Configuration
  analysis_config:
    num_analysis_samples: 50             # Number of samples for detailed analysis
    num_shift_samples: 10                # Number of samples for TE shift analysis
    max_left_shift_seconds: 60           # Maximum left shift for TE analysis
    shift_step_seconds: 2                # Step size for TE shift analysis
    te_ablation_samples: 200             # Samples for UP ablation analysis
    gain_sweep_samples: 100              # Samples for gain sweep analysis
    gain_sweep_values: [0.0, 0.5, 1.0, 1.5, 2.0]  # Gain values to test
  
# Optional: Advanced Training Configuration
advanced_config:
  # PyTorch Lightning Trainer Settings
  trainer:
    precision: "16-mixed"               # Mixed precision training for speed
    gradient_clip_val: 0.5             # Gradient clipping for stability
    gradient_clip_algorithm: "norm"    # Gradient clipping algorithm
    sync_batchnorm: true               # Sync batch norm for multi-GPU
    deterministic: false               # Allow non-deterministic for speed
    benchmark: true                    # Enable cuDNN benchmarking
  
  # Memory Optimization
  memory:
    enable_memory_monitoring: false    # Enable memory monitoring callback
    memory_threshold_gb: 20.0          # Memory threshold for cache clearing
    memory_log_frequency: 200          # Frequency of memory logging
  
  # Callbacks Configuration
  callbacks:
    early_stopping:
      enabled: false                   # Enable early stopping
      monitor: "val/predictive_loss"  # Metric to monitor
      patience: 20                     # Epochs to wait for improvement
      min_delta: 0.0001               # Minimum change to qualify as improvement
    
    model_checkpoint:
      monitor: "val/predictive_loss"  # Metric to monitor for best model
      save_top_k: 3                   # Number of best models to keep
      mode: "min"                     # Minimize the monitored metric
    
    loss_plotting:
      max_history_size: 1000          # Maximum epochs to keep in plotting history

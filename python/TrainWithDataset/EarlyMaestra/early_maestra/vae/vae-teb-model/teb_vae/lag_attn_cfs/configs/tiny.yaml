# Local smoke variant: one epoch, one device, the committed 4-sample CAUSAL shard.
#
# Everything not named here is inherited from default.yaml -- including the settings that are
# correctness requirements rather than preferences (causal_norm, compile: false, the spike breaker's
# ema_floor, num_sanity_val_steps: 0, causal_reach_budget_s: null), which is the point: a variant
# that re-stated them could drift from them.
#
# The geometry stays real, and here that is load-bearing twice over. `sequence_length`, the channel
# counts, `causal_warmup_budget_steps`, `warmup_period`, `horizon`, `anchor_stride` and
# `trim_minutes` all match the shipped config, because the decoder's width IS the resolved budget's
# surviving-channel count and the decoded anchor count IS the resolved floor, stride and horizon --
# so a smoke run at a shrunken budget or a shorter window would exercise a decoder and an anchor set
# the production run does not have. Only the model's widths shrink so a CPU forward is fast.
#
# likelihood: mse is a deliberate delta, not a simplification: it is the configuration that starves
# the decoder log-variance heads, so the smoke path and the DDP-strategy fallback it implies get
# exercised where they are cheap to observe.
#
#   python -m teb_vae.lag_attn_cfs.trainer --config teb_vae/lag_attn_cfs/configs/tiny.yaml
base: default.yaml

general_config:
  tag: lag_attn_cfs_tiny
  cuda_devices: [0]
  epochs: 1
  # Pinned to 1: the base config plots every 5th epoch for multi-day runs, but a tiny
  # smoke has 1-3 epochs and its train-smoke tests count one figure set per epoch.
  plot_frequency: 1
  batch_size: {train: 2, test: 2}
  folders_config: {out_dir_base: output/teb_vae_cfs_tiny}

model_config:
  VAE_model:
    d_model: 32          # = num_heads * d_head
    d_z: 8               # divisible by num_heads, required by the head-structured posterior
    d_head: 8
    max_lag: 8
    lstm_layers: 1
    dropout: 0.0
    likelihood: mse

dataset_config:
  # Repo-root-relative: entry points run from the repo root. The fixtures are the family's -- every
  # model in the family reads the same shards through the same loader -- and the CAUSAL pair is what
  # this package reads: the two-sided `tiny_shard.hdf5` beside it carries no `transform` attribute
  # and no warm-up vectors, and the pre-flight refuses it by name.
  vae_train_datasets: [teb_vae/lag_attn/tests/fixtures/tiny_shard_causal.hdf5]
  vae_test_datasets: [teb_vae/lag_attn/tests/fixtures/tiny_shard_causal.hdf5]
  stat_path: teb_vae/lag_attn/tests/fixtures/tiny_stats_causal.hdf5
  dataloader_config:
    num_workers: 0       # no worker spawn for 4 samples

advanced_config:
  tracking:
    mlflow:
      enabled: false     # a smoke run is not a result

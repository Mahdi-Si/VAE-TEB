# Horizon arm: forecast two minutes, restoring the comparison model's horizon AND its block.
#
# This arm is worth more here than in any other causal cell, and the reason is the target. The block
# is H * R = 30 * 16 = 480 raw samples -- exactly the comparison model's -- because R is a property
# of the raw grid rather than of a channel budget. So this is the one arm anywhere in the family
# under which a nat is comparable across the two-sided/one-sided input boundary: same target, same
# block, same horizon, differing only in whether the inputs contain the answer.
#
# The cost is anchors, and it is the tradeoff the shipped horizon exists to take. Anchors live in
# [F, T - H), so doubling H shortens T_valid from 285 to 270 and the anchor count from 152 to 137.
# That is mild at this floor and would be fatal at a stricter one: at the budget that keeps all 102
# input channels (W' = 278) there are 8 anchors at H = 15 and exactly ZERO at H = 30. Shortening the
# horizon buys back anchors, which is why the horizon is one of the two levers on the warm-up cost
# rather than an independent preference.
#
# `anchor_stride` moves with it, because the two are one decision: at S < H the windows overlap again
# and at S > H there are target steps no phase ever covers.
#
# `horizon_depth` stays at 4, where the refine stack's receptive field of 31 tokens is one more than
# the 30 horizon tokens -- the family's own recorded criterion, which binds at this horizon and does
# not at the shipped one.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_crws.trainer --config teb_vae/lag_attn_crws/configs/sweep_horizon_30.yaml
base: default.yaml

model_config:
  VAE_model:
    horizon: 30
    anchor_stride: 30

general_config:
  tag: hybrid_tcvae_experiment  # Descriptive experiment name
  cuda_devices: [0]  # List of GPU device IDs to use
  train_classifier: False  # Whether to train classifier component
  lr: 0.0001  # Learning rate (reduced for stability)
  lr_milestone: [100, 200]  # Epochs at which to decay learning rate
  weight_decay: 0.0001  # L2 regularization weight (now handled by AdamW)
  checkpoint_frequency: 1
  plot_frequency: 5  # Plot every 5 epochs to reduce I/O
  epochs: 100  # Increased for better convergence
  accumulate_grad_batches: 4  # Gradient accumulation for effective larger batch size
  batch_size:
    train: 4  # Increased from 2 for better training stability
    test: 8   # Can be larger for testing since no gradients

model_config:
  VAE_model:
    # Model Architecture Parameters
    Y_module_only: False        # Whether to use only target encoder (deprecated)
    raw_input_size: 4800        # Raw FHR signal length (20 min at 4Hz)
    input_size: 300             # Sequence length for coefficients (decimated by 16)
    channel_num: 2              # Number of input channels (deprecated)
    input_dim: 76               # Total input dimensions (deprecated)
    RNN_hidden_dim: 128         # LSTM hidden dimension (deprecated)
    latent_size: 16             # Latent space dimensionality
    num_RNN_layers: 5           # Number of LSTM layers (deprecated)
    freeze_seqvae: False        # Whether to freeze VAE during classifier training
    zero_source: True           # Whether to zero source during certain experiments
    
    # Beta Scheduling Configuration
    # Controls the strength of regularization terms across training
    beta_schedule: constant     # Options: 'constant', 'linear', 'cyclic'
    beta_start: 0.0            # Starting beta value for annealing schedules
    beta_end: 6.0              # Final beta value (β-TCVAE recommendation)
    beta_anneal_epochs: 50     # Number of epochs for linear annealing
    beta_cycle_len: 1000       # Cycle length for cyclic annealing
    beta_const_val: 2.0        # Constant beta value when schedule='constant'
    kld_beta: 1.0              # Fallback beta value (legacy parameter)
    
    # Three-Mode Training Configuration
    # IMPORTANT: Only one of the following should be true at a time:
    # 
    # Option 1: Standard TEB (Transfer Entropy Bottleneck)
    # use_tcvae: false, use_hybrid_tcvae: false
    # - Original TEB formulation with conditional prior p(z|y)
    # - Single KL divergence: KL(q(z|x,y) || p(z|y))
    # - Direct transfer entropy measurement
    # - Computational cost: O(BTD)
    #
    # Option 2: Full β-TCVAE (Complete Disentanglement - Approach 1)
    # use_tcvae: true, use_hybrid_tcvae: false
    # - Complete ELBO decomposition with standard normal prior p(z) = N(0,I)
    # - Three terms: α·MI + β·TC + γ·DW-KL
    # - Maximum disentanglement capability
    # - Computational cost: O(B²T²D)
    #
    # Option 3: Hybrid β-TCVAE (TEB + Disentanglement - Approach 2)
    # use_tcvae: false, use_hybrid_tcvae: true  
    # - Preserves TEB framework + adds Total Correlation penalty
    # - Two terms: β·KL(q(z|x,y)||p(z|y)) + γ·TC(z)
    # - Balanced transfer entropy measurement + disentanglement
    # - Computational cost: O(BTD) + O(B²T²D)
    
    use_tcvae: true            # Enable Full β-TCVAE (Approach 1)
    use_hybrid_tcvae: false    # Enable Hybrid β-TCVAE (Approach 2: TEB + TC)
    
    # Hyperparameter Weights
    alpha: 1.0                 # Index-Code MI weight (Full β-TCVAE only)
    gamma: 1.0                 # DW-KL weight (Full β-TCVAE) or TC weight (Hybrid)
    dataset_size: 10000        # Dataset size estimate (auto-updated from actual data)

  seqvae_checkpoint: null
  base_model_checkpoint: null
  classification_checkpoint: null

inv_scattering_model:
  do_inv_st: False
  inv_st_checkpoint: null
  train_inv_st: False

folders_config:
  out_dir_base: output

dataset_config:
    vae_train_datasets:
      - C:\Users\mahdi\Desktop\McGill\data\acidosis_no_cs.hdf5
    vae_test_datasets:
      - C:\Users\mahdi\Desktop\McGill\data\acidosis_no_cs.hdf5
    stat_path: C:\Users\mahdi\Desktop\McGill\data\stats.hdf5
    dataloader_config:
      num_workers: 0
      normalize_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph']
      # These are for CombinedHDF5Dataset
      dataset_kwargs:
        load_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph', 'epoch', 'guid']
        allowed_guids: null
        cs_label: null
        bg_label: null
        epoch_min: null
        epoch_max: null
        label: null
        cache_size: 2000
        trim_minutes: 2.0  # how much to trim from start and end of the signal

seqvae_testing:
  test_data_dir: null                    # Directory for test data (optional)
  test_data_selected_dir: null           # Directory for selected test data (optional)
  HIE_test_data_dir: null                # Directory for HIE test data (optional)
  test_checkpoint_path: null             # Path to checkpoint for testing
  
  # Test Analysis Configuration
  analysis_config:
    num_analysis_samples: 50             # Number of samples for detailed analysis
    num_shift_samples: 10                # Number of samples for TE shift analysis
    max_left_shift_seconds: 60           # Maximum left shift for TE analysis
    shift_step_seconds: 2                # Step size for TE shift analysis
    te_ablation_samples: 200             # Samples for UP ablation analysis
    gain_sweep_samples: 100              # Samples for gain sweep analysis
    gain_sweep_values: [0.0, 0.5, 1.0, 1.5, 2.0]  # Gain values to test
  
# Optional: Advanced Training Configuration
advanced_config:
  # PyTorch Lightning Trainer Settings
  trainer:
    precision: "16-mixed"               # Mixed precision training for speed
    gradient_clip_val: 0.5             # Gradient clipping for stability
    gradient_clip_algorithm: "norm"    # Gradient clipping algorithm
    sync_batchnorm: true               # Sync batch norm for multi-GPU
    deterministic: false               # Allow non-deterministic for speed
    benchmark: true                    # Enable cuDNN benchmarking
  
  # Memory Optimization
  memory:
    enable_memory_monitoring: false    # Enable memory monitoring callback
    memory_threshold_gb: 10.0          # Memory threshold for cache clearing
    memory_log_frequency: 200          # Frequency of memory logging
  
  # Callbacks Configuration
  callbacks:
    early_stopping:
      enabled: false                   # Enable early stopping
      monitor: "val/total_loss"        # Metric to monitor
      patience: 20                     # Epochs to wait for improvement
      min_delta: 0.0001               # Minimum change to qualify as improvement
    
    model_checkpoint:
      monitor: "val/total_loss"        # Metric to monitor for best model
      save_top_k: 3                   # Number of best models to keep
      mode: "min"                     # Minimize the monitored metric
    
    loss_plotting:
      max_history_size: 1000          # Maximum epochs to keep in plotting history
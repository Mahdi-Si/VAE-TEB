# config_synth_v2.yaml -- standalone synthetic_v2 raw -> scattering -> block-TE config.
#
# Companion design/math reference: SYNTHETIC_V2_RAW_TE_PIPELINE_EXPLAINED.md (§16
# defines the benchmarks.G1_raw schema). Build contract: SYNTHETIC_V2_SPEC_AND_SPRINTS.md.
#
# v2 differs from synthetic/config_synth.yaml: there is ONE source and ONE target
# (single coupled pathway), so there is NO m_grid / M dilution axis anywhere. The
# `model`, `loss`, `optim`, `dataset`, `ddp` blocks are inherited from v1 so the
# UNCHANGED VAE-TEB model (c_y=87, c_u=101) trains on the v2 cache; v2 changes only
# the data path (raw rendering + the real scattering transform + normalisation).
#
# Unit conventions (Sprint 0, S0-T01):
#   * scattering.phase_min_freq values are NORMALISED xi thresholds (NOT true Hz);
#     see EXPLAINED §11.1. Physical Hz = xi * fs.
#   * raw.f_pulse IS a true Hz frequency (the pulse-shape carrier ~0.02 Hz).

experiment:
  tag: G1_raw_v2_notch         # Post-validation rebuild: FHRV notch around the carrier
                               # (raw.fhrv_notch_enabled) so the independent FHRV LF band no
                               # longer pollutes the coupled decel pulse-shape channel. The
                               # prior G1_raw_v1 cache and results/G1_raw_{baseline,recovered}
                               # are preserved for before/after comparison.
  benchmark: G1_raw            # selects the active block under `benchmarks:`
  seed: 0

runtime:
  device: auto                 # auto -> cuda if available, else cpu
  cuda_device: 0               # GPU index for single-GPU runs
  gpus: [0]                    # GPU slot list for task-parallel multi-GPU work

paths:
  data_dir: ./data             # .npz split caches -> synthetic_v2/data/G1_raw/<tag>/
  results_dir: ./results       # checkpoints / figures / reports -> synthetic_v2/results/<run_tag>/

# --- deterministic seeds (S0-T01): DGP, inverter Monte-Carlo, and shuffle -------
# A cache is reproducible from these; the inverter MC seed is held fixed across
# bisection so the coupling solve does not chase noise.
seeds:
  base_seed: 0                 # umbrella seed
  dgp: 0                       # latent-pair + raw-rendering RNG
  inverter_mc: 0               # B_y_for_mean_te_block_state_space Monte-Carlo seed
  shuffle: 0                   # single shared row-aligned pool permutation

# --- the v2 benchmark (§16). Single pathway: NO m_grid. ------------------------
benchmarks:
  G1_raw:
    data:                      # coupled latent pair on the DECIMATED grid (§6)
      sequence_length: 300     # decimated, after trim
      horizon: 30
      K_history: 80
      oscillators: [[0.80, 0.10]]   # (r, omega) -> contraction rhythm ~0.004 Hz ; SINGLE pathway
      target_ar: 0.40
      sigma2_y: 1.0
      sigma2_eta: 0.01

    raw:                       # v2-only raw rendering (§5-§7). f_pulse is TRUE Hz.
      fs: 4.0
      n_raw: 5280              # 22 min ; transform input length
      render_mode: am_carrier  # {am_carrier (default), pulse_train}
      f_pulse: 0.06            # Hz : contraction/deceleration pulse-shape carrier.
                               # S4-T01 lock: raised 0.02 -> 0.06 per the Sprint-3 de-risk
                               # (results/G1_raw_recovered/): at 0.02 the injected TE is not
                               # extractable from scattering; at 0.06 all D>=8 cells clear the
                               # (ordinal) frac_Phi gate. NOTE 0.06 lands INSIDE the FHRV LF
                               # band (0.03-0.15) -- the fhrv_notch_enabled flag below excises
                               # a one-Q-step neighbourhood so the LF dressing cannot pollute
                               # the coupled channel. am_offset_ratio / omega left unchanged.
      fhrv_notch_enabled: true # Excise [f_pulse*2^(-1/Q), f_pulse*2^(+1/Q)] from the FHRV
                               # dressing bands (each band re-normalised to full power) so the
                               # independent LF variability stays out of the coupled decel
                               # pulse-shape scattering channel (EXPLAINED §7.3, §19). Set
                               # false to reproduce the pre-notch (G1_raw_v1) generation.
      am_offset_ratio: 4.0     # a0 = ratio * a1 * max|c| (positivity margin); same for b0
      pulse_train:             # S7-T04 : knobs for render_mode == pulse_train (waveform-realistic)
        rate_hz: 0.06          # event rate = fundamental (defaults to f_pulse if omitted)
        duty: 0.5              # raised-cosine bump width as a fraction of the period
      mu_fhr_bpm: [110, 160]   # physiological baseline draw range (neutral 140)
      mu_up: [5, 25]           # mmHg (IUPC); use [10, 20] for toco units
      baseline_wander_std: { fhr: 3.0, up: 2.0 }   # independent VLF wander (0 TE)
      decel_depth_bpm: [10, 40]        # b0..b0+b1*max|d| below baseline
      contraction_mmHg: [40, 70]       # a0..a0+a1*max|c| above tone
      fhrv_band_power: { LF: 11.25, MF: 6.25, HF: 2.5 }   # bpm^2 ; VLF reserved for decel/wander
      accel: { amp_bpm: [10, 25], rate_per_min: 0.3 }
      noise_std: { fhr: 0.5, up: 0.5 }

    scattering:                # v2-only transform + normalisation (§11-§12)
      J: 11
      Q: 4
      T: 16
      max_order: 1
      batch_size: 32           # S0-T01: GPU-batch size for the transform (bounds peak memory)
      phase_min_freq: { fhr: 0.006, up: 0.002 }   # production NORMALISED-xi thresholds (see §11.1)
      norm_stats_source: synthetic_pool   # S0-T01 pinned; {synthetic_pool, real_fold} (real_fold added later)
      real_fold_stats_path: null          # required only if norm_stats_source == real_fold

    mix:                       # cell grid (§9.3) -- NO m_grid (single pathway)
      target_te_grid: [0.0, 0.5, 1.0, 2.0, 3.0]   # nats, incl. 0.0 null anchor
      lag_grid: [8, 12, 20]                        # decimated steps ; fixed per-cell lag.
                               # S4-T01 lock: dropped D=4 (16 s) -- at that lag the source->target
                               # delay is comparable to the scattering low-pass width, so the
                               # coupling is under-preserved (Sprint-3 frac_Phi ~0.4-0.7). All
                               # locked lags D>=8 pass the frac_Phi gate.
      lag_mode: fixed                              # {fixed, band}; band deferred
      n_per_cell_train: 800    # S4-T01 lock: lighter first full build (was 2000/400/600);
      n_per_cell_val: 200      # ~19.5k samples over the 5x3 grid. Scale up by re-running the
      n_per_cell_test: 300     # build stage with larger counts (deterministic from seeds).
      inverter:                # B_y_for_mean_te_block_state_space knobs (widened hi for M=1)
        n_samples: 12000
        lo: 1.0e-4
        hi: 60.0
        tol: 0.005
        max_iter: 40

    eval:
      realizability:
        fatal: false           # S0-T01: pre-flight frac_Phi gate is non-fatal by default
        # frac_Phi = TE_scat / TE_inj is an ORDINAL, coupled-sub-process realizability
        # estimate, biased HIGH by the R0 probe's single-channel target conditioning
        # (it can exceed 1 -- see EXPLAINED §10, §14.3). The gate is therefore TWO-SIDED:
        # a cell passes iff frac_threshold <= frac_Phi <= frac_upper. frac_Phi > frac_upper
        # flags probe bias (reported as frac_over_one / n_frac_over_one), not "created
        # information"; cross-check te_raw and the null cells.
        frac_threshold: 0.7     # lower bound (frac_lo): coupling must survive at least this
        frac_upper: 1.3         # upper bound: above this, treat frac_Phi as probe-bias-flagged
        ridge: 1.0e-2           # ridge penalty for the R0 probe regressions
        n_anchors: 3           # S3-T03: anchor positions averaged in the R0 probe
        n_seeds: 2             # S3-T03: train/test row shuffles averaged in the R0 probe
        pilot:                 # S3-T05: the pilot pre-flight grid (subset of the full mix grid)
          target_te_grid: [0.0, 1.0, 2.0, 3.0]   # incl. 0.0 null
          lag_grid: [4, 8]
          n_per_cell: 384      # n_test ~= 115 > H*M = 30 -> stable held-out covariance
        recovery:              # S3-T06: render-knob sweep when frac_Phi is low
          f_pulse_grid: [0.02, 0.04, 0.06]          # Hz carrier candidates
          am_offset_ratio_grid: [1.5, 2.5, 4.0]     # deeper modulation at smaller ratio
          omega_grid: [0.06, 0.10]                  # narrower omega lowers f_env_peak
          n_per_cell: 384
          target_te: 3.0       # strong cell used to score each render setting
          D: 8
          lag1_autocorr_floor: 0.9   # keep the lag identifiable after narrowing omega
      null_controls: [shuffle, reverse]
      lag_mass_threshold: 0.8
      lag_tolerance_steps: 1    # +-1-step tolerance for the 4 s phi-averaging lag blur

# --- model constructor kwargs (inherited verbatim from synthetic/config_synth.yaml;
#     the UNCHANGED SeqVaeLagAttnV1 consumes the v2 features at c_y=87 / c_u=101) ---
model:
  sequence_length: 300
  d_model: 128
  d_z: 24
  horizon: 30
  warmup_period: 30
  c_y: 87                      # 43 + 44
  c_u: 101                     # 43 + 58; must equal 58 if use_up_st=false
  use_up_st: true
  max_lag: 90
  num_heads: 4
  d_head: 32
  lstm_layers: 2
  dropout: 0.1
  decoder_hidden: 128
  logvar_clamp: [-5.0, 3.0]
  mu_scale: 5.0
  delta_mu_scale: 3.0
  latent_stats_momentum: 0.01
  use_entmax: false
  attention_grad_checkpoint: false
  head_structured_latent: true
  lag_bias_init: normal
  horizon_depth: 3
  horizon_kernel: 3
  horizon_film: true
  encoder_extra_dilations: [8, 16]

# --- loss weights (inherited from v1) ----------------------------------------
loss:
  kld_beta: 0.001
  lambda_full: 1.0
  lambda_base: 0.5
  likelihood: mse              # 'gaussian_nll' for nat-scale K_bar calibration
  sigma_obs: 1.0               # or 'learned' to reuse the model's logvar heads
  free_bits: 0.0
  detach_baseline_in_full: false   # A3 baseline/residual gradient separation (forward unchanged)

# --- DataLoader knobs (inherited from v1) ------------------------------------
dataset:
  num_workers: 4               # 0 on the single-GPU laptop
  pin_memory: true
  persistent_workers: true
  mmap: auto                   # memory-map the uncompressed .npz splits

# --- multi-GPU DDP training (inherited from v1) ------------------------------
ddp:
  devices: 8                   # CLI --devices overrides; 1 on Windows dev
  strategy: ddp_find_unused_parameters_true
  precision: 32-true
  sync_batchnorm: true
  lr_scaling: true
  warmup_epochs: 5
  num_sanity_val_steps: 0
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  early_stopping:
    enabled: false
    monitor: val/total_loss
    mode: min
    patience: 15
    min_delta: 0.0

# --- optimiser / training loop (inherited from v1) ---------------------------
optim:
  lr: 0.001
  weight_decay: 0.0
  epochs: 100
  batch_size: 128              # RTX 4080 laptop: use 32
  grad_clip_norm: 0.5
  lr_milestones: [10, 50]
  lr_gamma: 0.1

# --- training-curve plotting (inherited from v1) -----------------------------
plotting:
  enabled: true
  plot_every: 10
  html: true                   # refresh an interactive Plotly loss curve (training_curves.html)
                               # every `plot_every` epochs and at fit end (rank-0, non-fatal)

# --- Sprint 5 training driver knobs (S5-T02) ---------------------------------
# `run_pipeline_v2.py --stage train` uses `optim` (full run); `--pilot` overlays the
# short-run knobs below (a few epochs, a handful of batches, a small batch) so the
# training path can be smoke-tested on the real cache without a long GPU occupation.
# The full ~100-epoch headline run is `--stage train` (no --pilot).
train:
  pilot_epochs: 3
  pilot_limit_train_batches: 4
  pilot_limit_val_batches: 2
  pilot_batch_size: 16         # smaller than optim.batch_size to keep the pilot light
  devices: 1                   # local single-GPU default; --devices N (or a list) for DDP

# --- Sprint 5 optional beta-selection stage (S5-T03; default OFF) -------------
# `--stage beta_select` runs only when `enabled: true` or `--force` is passed; short
# runs over `beta_grid` pick the least-collapsed KL (highest kld_nats). Otherwise the
# fixed `loss.kld_beta` is used and this stage is a reporting no-op.
beta_select:
  enabled: false
  beta_grid: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3]
  epochs: 5

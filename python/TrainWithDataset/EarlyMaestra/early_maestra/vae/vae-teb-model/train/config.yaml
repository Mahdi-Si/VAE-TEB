
general_config:
  tag: core_model_with_l8

  seed: 42  # Global RNG seed; seeds Python/NumPy/torch and DataLoader workers
  cuda_devices: [0, 1, 2, 3, 4, 5, 6]  # List of GPU device IDs to use
  lr: 0.001  # Learning rate (can reduce to 0.00005 for Stage 2 freeze mode)
  lr_milestone: [500]  # Epochs at which to decay learning rate
  checkpoint_frequency: 1
  plot_frequency: 1  # Callback log frequency in epochs
  epochs: 5000
  accumulate_grad_batches: 1
  batch_size:
    train: 210
    test: 210
  
  folders_config:
    out_dir_base: /data/deid/isilon/MS_model/seq_vae_teb_results/new_structure

model_config:
  VAE_model:
    enable_forecaster: true         # ← CHANGE TO true FOR STAGE 2
    freeze_core_model: false         # ← CHANGE TO true FOR STAGE 2 FREEZE MODE
    scattering_forecast_weight: 1  # ← CHANGE TO 1.0 FOR STAGE 2
    horizon_len: 30  # 30 decimated steps = ~2 minutes at 4Hz with decimation 16

    beta_schedule: constant      # Options: 'constant', 'linear', 'cyclic'
    beta_start: 0.0             # Starting beta for annealing schedules
    beta_end: 1.0               # Final beta for annealing schedules
    beta_anneal_epochs: 50      # Number of epochs for linear annealing
    beta_cycle_len: 1000        # Cycle length for cyclic annealing
    beta_const_val: 0.005       # Constant beta value (ACTIVE when schedule='constant')
    kld_beta: 0.005             # Fallback beta value

    forecaster_hidden_dim: 128        # Hidden size for forecaster LSTM
    forecaster_layers: 2              # Number of LSTM layers in forecaster
    forecaster_dropout: 0.1           # Dropout in forecaster
    forecaster_min_logvar: -7.0       # Minimum log-variance clamp
    forecaster_max_logvar: 4.0        # Maximum log-variance clamp

    predictive_horizon: 30            # Forecast horizon (same as horizon_len)
    predictive_max_anchors: 0         # 0 = use all valid timesteps as anchors
    log_forecast_metrics: true       # ← CHANGE TO true FOR STAGE 2
    scattering_discount_gamma: 1.0    # Discount factor for multi-step forecasting

  base_model_checkpoint: null
  legacy_seqvae_checkpoint: /data/deid/isilon/MS_model/seq_vae_teb_results/pre_training/2025-11-02--[14-52]--No_LSTM_B-200_lr-e-3_predictive/model_checkpoints/base-model-best-epoch=34.ckpt

dataset_config:
    vae_train_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/pre_training_dataset/train_dataset_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/pre_training_dataset/train_dataset_no_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/k_fold_cross_validation_dataset/fold_1/test/healthy_bg_no_cs.hdf5
    vae_test_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/pre_training_dataset/test_dataset_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/pre_training_dataset/test_dataset_no_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/k_fold_cross_validation_dataset/fold_1/train/hie_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/k_fold_cross_validation_dataset/fold_1/test/hie_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/k_fold_cross_validation_dataset/fold_1/val/hie_cs.hdf5
    stat_path: /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/stats.hdf5

    dataloader_config:
      num_workers: 0
      normalize_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph']
      dataset_kwargs:
        load_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph', 'epoch', 'guid']
        allowed_guids: null
        cs_label: null
        bg_label: null
        epoch_min: null
        epoch_max: null
        label: null
        cache_size: 20000
        trim_minutes: 2.0

# Advanced Training Configuration
advanced_config:
  trainer:
    # bf16-mixed avoids the fp16 GradScaler loss-scale-collapse failure mode on
    # Ada/Ampere (no dynamic loss scaling); identical behaviour otherwise.
    precision: "bf16-mixed"
    gradient_clip_val: 0.5
    gradient_clip_algorithm: "norm"
    sync_batchnorm: true               # Effective only with >1 device (guarded in build_trainer)
    deterministic: false
    benchmark: true
    compile: true                      # torch.compile the wrapped model (opt-out via false)
    log_every_n_steps: 1
    num_sanity_val_steps: 0
    use_distributed_sampler: true      # false when the DataModule owns the sampler
    profiler: simple                   # 'simple' | 'advanced' | null (off)

  logging:
    # Console + file run logs (metrics go to MLflow, not here).
    # Each run writes train_results/full.log (human) and run.jsonl (JSON Lines).
    # Under DDP every rank writes its own file -- rank 0 keeps the plain name,
    # others get a .rank{N} suffix -- because N ranks sharing one file corrupts it
    # (each rank would enforce its own rotation on it). The console is rank 0 only.
    console_level: INFO
    file_level: INFO
    json_log: true                     # write the JSON Lines mirror of the run log
    # diagnose renders every local variable in a traceback; a training_step frame
    # holds the input batch, so it is forced off for the on-disk sinks and this key
    # only affects the (non-persisted) console. Leave false unless debugging locally.
    console_diagnose: false
    rotation: "100 MB"
    retention: "14 days"

  spike_breaker:
    # Loss-spike circuit breaker. Disabled by default -> the training step is unchanged.
    # When enabled, a batch whose watched loss exceeds multiplier * max(EMA, ema_floor)
    # takes a zero-gradient step instead of a real update (train stage only).
    enabled: false
    multiplier: 5.0                    # spike threshold as a multiple of the loss EMA
    ema_decay: 0.02                    # EMA momentum; updated only on accepted batches
    ema_floor: 0.0                     # floor on the comparison base (guards a collapsed EMA)
    warmup_batches: 100                # never skip during the first this-many batches
    max_consecutive_skips: 25          # force-accept after this many skips (anti-deadlock)
    comparison_metric: total_loss      # 'total_loss' (returned loss) | 'main_loss' (metrics)

  tracking:
    mlflow:
      enabled: false
      tracking_uri: "http://localhost:5000"
      experiment_name: seqvae-teb
      run_name: null
      artifact_location: null
      log_model: true                  # log + register the final eager model (when enabled)
      log_checkpoints: false           # Lightning checkpoint-weight artifacts; off to avoid double-store
      log_config_artifact: true
      tags:
        project: teb_vae
        stage: dev

  callbacks:
    early_stopping:
      enabled: false
      monitor: "val/total_loss"
      patience: 30
      min_delta: 0.0001
      mode: "min"

    model_checkpoint:
      monitor: "val/total_loss"
      save_top_k: 3
      mode: "min"

    loss_plotting:
      max_history_size: 1000

    reconstruction_plotting:
      enabled: false
      plot_frequency: 10
      num_examples: 3

    comprehensive_plotting:
      enabled: true
      plot_frequency: 10


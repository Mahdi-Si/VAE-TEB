# 3-class healthy / acidosis / HIE: softmax head, sqrt-inverse class weights (HIE is rare),
# no aux head (the main head is 3-class). labels.head: ordinal takes train.loss.name coral | cumulative_link.
# Binary policies threshold the collapsed adverse score; eval.ovr_thresholds: auto adds per-class OvR ones.
base: default.yaml

classifier:
  run: {name: trf_cfs_three_class_seq}
  labels: {task: three_class, head: multiclass, aux_3class_weight: 0.0}
  train:
    loss: {name: weighted_ce, weighting: sqrt_inverse}

# Smoke configuration: the whole pipeline, on tiny ARTIFICIAL data, in a separate output tree.
#
# NOTHING HERE IS CLINICAL. Every shard this file names is generated by the fixture code under
# tests/fixtures/ with invented GUIDs, invented times and invented coefficients. A smoke run that
# finishes proves that the stages connect, the artifacts round-trip and the report renders. It is
# not evidence about latents, outcomes or separation, and no number it produces may be quoted.
#
# It is isolated from a production run in three ways, all of them deliberate: its own shard paths,
# its own `fold` name, and its own `run_root` subtree -- so a smoke run can never overwrite a
# production run's artifacts or be mistaken for one in a directory listing.

latent_pilot:
  # Not a fold of the real dataset. The name is what a run directory is filed under, so it is the
  # thing that stops artificial results from ever sitting beside real ones.
  fold: smoke_fixture
  seed: 42

  # Fixed rather than null: a smoke run is a wiring check and should behave identically on a machine
  # with a GPU and one without.
  device: cpu

  paths:
    # Written by the fixture generator, not committed. Missing files are refused by name, which is
    # the message telling you to generate them first:
    #   python -m teb_vae.lag_attn_transformer_cfs.latent_pilot.tests.fixtures.generate
    checkpoint: teb_vae/lag_attn_transformer_cfs/latent_pilot/tests/fixtures/generated/tiny_checkpoint.ckpt
    statistics: teb_vae/lag_attn_transformer_cfs/latent_pilot/tests/fixtures/generated/tiny_stats.hdf5
    # Two subgroups per split, so both binary classes are present wherever discrimination is
    # estimated -- a split carrying one class cannot produce an AUROC at all. The basenames are
    # canonical subgroup names because that is how a shard's subgroup is recovered.
    train_shards:
      - teb_vae/lag_attn_transformer_cfs/latent_pilot/tests/fixtures/generated/train/healthy_bg_no_cs.hdf5
      - teb_vae/lag_attn_transformer_cfs/latent_pilot/tests/fixtures/generated/train/acidosis_no_cs.hdf5
    val_shards:
      - teb_vae/lag_attn_transformer_cfs/latent_pilot/tests/fixtures/generated/val/healthy_bg_no_cs.hdf5
      - teb_vae/lag_attn_transformer_cfs/latent_pilot/tests/fixtures/generated/val/acidosis_no_cs.hdf5
    test_shards:
      - teb_vae/lag_attn_transformer_cfs/latent_pilot/tests/fixtures/generated/test/healthy_bg_no_cs.hdf5
      - teb_vae/lag_attn_transformer_cfs/latent_pilot/tests/fixtures/generated/test/acidosis_no_cs.hdf5
    # A subtree of its own, so a smoke run and a production run never share a directory.
    run_root: teb_vae/lag_attn_transformer_cfs/latent_pilot/runs/smoke

  provenance:
    # Known by construction here: the fixture GUIDs are disjoint across splits and none of them was
    # used to fit anything. Stated rather than left null, because "unknown" is the answer this field
    # gives for real data and a smoke run should not practise that path silently.
    statistics_population: fixture-generated; no clinical recording contributed

  # The windows are the REAL ones. The fixture generator covers three hours before an invented
  # delivery time, so the smoke run exercises the actual boundary arithmetic, the six bins and the
  # paired early/late windows rather than a shrunken version of them that would test nothing.

  eligibility:
    # Relaxed from 2: a tiny fixture carries few segments per recording, and the production rule
    # would exclude every one of them, leaving the pipeline to report an empty cohort as a success.
    min_late_segments: 1

  # Tiny budgets. The point is that every stage runs, not that anything converges.
  optim:
    recordings_per_class: 2
    max_epochs: 1
    patience: 1
  baseline:
    max_steps: 5
    patience: 1
  gates:
    # The fixture holds a handful of recordings per split; the draw takes what is there. Stated so
    # the smoke run exercises the round-robin rather than the "everything fits" path.
    subset_recordings: 4
  bootstrap:
    resamples: 100
  mc:
    draws: 1

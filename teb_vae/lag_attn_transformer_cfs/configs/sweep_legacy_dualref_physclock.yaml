# The configuration this cell shipped before 2026-09-05, preserved verbatim as a comparator: the
# LEGACY fractional-phase representation (ratio_power_v0, 66 / 15 phase channels), the dual input
# reference (target onto target_max = 402.16 s, source onto 288.2672 s), the approximate PHYSICAL
# forecast clock (labels advanced per channel by round(0.875 (tau_c - tau_min) / 4 s), up to 85
# steps) and its stride-5 tiling.
#
# THE HORIZON IS NOT PINNED HERE and follows default.yaml (H = 30 again since the 2026-09-23
# final revision), and so does every other final-revision leaf -- `max_lag`, `lag_kv_source`,
# `source_dropout`, the half-life, the AR(1) residual and the per-channel scored horizon: the arm
# exists to compare the representation, the input references and the forecast clock against the
# default, and that comparison is only readable with everything else held equal on both sides.
# Under the physical clock the anchor ceiling is T_valid - max_c s_c (worked example: 270 - 85 =
# 185), the dense span is that ceiling less F (51 anchors), and stride 5 tiles it into
# ceil(51 / 5) = 11 tiles at phase 0 (10 otherwise). The `gradient_clip_val` and `additive_margin`
# the default scaled for its own block are inherited with it, although this arm's legacy block is
# wider (H x 98 surviving channels). What this arm is therefore NOT is a bitwise replay of the
# pre-promotion run; the run records of that configuration remain the record of it.
#
# It reads the LEGACY shards (REPOINT_ME_causal), which is why its dataset paths are its own. The
# review's findings against this arm are recorded in teb_vae/CFS_SCATTERING_PHASE_FORECAST_CRITIQUE.md;
# it is kept so the promoted default can be compared against what it replaced, not as a candidate.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_transformer_cfs.trainer --config teb_vae/lag_attn_transformer_cfs/configs/sweep_legacy_dualref_physclock.yaml
base: default.yaml

model_config:
  VAE_model:
    c_y: 102
    c_u: 51
    causal_phase_operator: ratio_power_v0
    causal_align_reference: target_max
    causal_align_reference_source: 288.2672
    causal_target_forecast_clock: physical
    anchor_stride: 5

dataset_config:
  vae_train_datasets:
    - /data1/fetal-heart-tracing/HDF5_Datasets/REPOINT_ME_causal/pre_training_dataset/train_dataset_cs.hdf5
    - /data1/fetal-heart-tracing/HDF5_Datasets/REPOINT_ME_causal/pre_training_dataset/train_dataset_no_cs.hdf5
  vae_test_datasets:
    - /data1/fetal-heart-tracing/HDF5_Datasets/REPOINT_ME_causal/pre_training_dataset/test_dataset_cs.hdf5
    - /data1/fetal-heart-tracing/HDF5_Datasets/REPOINT_ME_causal/pre_training_dataset/test_dataset_no_cs.hdf5
  stat_path: /data1/fetal-heart-tracing/HDF5_Datasets/REPOINT_ME_causal/stats.hdf5

advanced_config:
  tracking:
    mlflow:
      # IDENTITY: the arm in the name, on both keys, so a run's own records say which arm trained
      # even if the config it was launched from cannot be recovered.
      run_name: lag_attn_trf_cfs_dualref288_physclock
      tags:
        variant: lag_attn_trf_cfs_dualref288_physclock

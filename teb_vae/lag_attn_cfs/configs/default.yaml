# PROMOTED 2026-09-05: this file now carries the corrected representation and the exact-clock
# task the CFS review recommended -- integer phase operator (44 fhr_ph / 10 up_ph, so c_y = 80 and
# c_u = 46), NO input-channel alignment (every channel read at its own availability time), the
# STORED forecast clock (labels are the next 10 stored coefficients; H moved 30 -> 10 on 2026-09-05,
# see the `horizon` key), and the stride 5 that puts ~31 tiles per sample on that clock's
# 156-anchor span. The legacy dual-reference,
# physical-clock, fractional-phase configuration this file used to ship is preserved verbatim as
# `sweep_legacy_dualref_physclock.yaml`. Prose below that describes the reference clocks and the
# physical clock describes those mechanisms as they are still available through the sweep arms; the
# shipped leaves are the ones set at each key. Shards for this config are built with
# `create_new_pipeline.py` under `phase_operator=integer_harmonic_v1`; see REPOINT_ME_causal_int.
#
# Causal-feature-domain lag-attention VAE-TEB: the production training configuration.
#
# The model forecasts the next 40 SECONDS of the stored ONE-SIDED FHR feature future -- the 76
# target channels surviving `causal_warmup_budget_steps` under the integer operator, over 10
# decimated steps, so 760 coefficients per anchor -- from a single shared latent. A target-only prior and a
# source-conditioned posterior share one decoder, invoked twice with nothing else, so the per-step
# KL between them is the source-conditioned coupling readout. Several settings below are correctness
# requirements rather than preferences; those are marked.
#
# WHAT IS DIFFERENT ABOUT THIS CELL, in one paragraph, because every number below follows from it.
# The stored coefficients are produced by a strictly one-sided gammatone bank, so a coefficient at
# step t is a function of {x(s) : s <= t} and of nothing else -- which is what makes a forecast of
# step t + 1 + tau a genuine forecast rather than a partial reconstruction of the target's own
# future. Causality is bought with a WARM-UP: a one-sided filter's output depends on assumed
# pre-recording history until its own leading delay has passed, and because the transform runs per
# 22-minute segment that cost is paid once per segment. On the slowest surviving scattering channel
# it consumes 278 of the 300 steps the model sees. Two things follow that have no analogue in the
# two-sided cells: the forecast cannot begin at the model's own 30-step warm-up, and a channel
# budget is a feasibility requirement rather than a tuning knob.
#
# Written out in full rather than inheriting the two-sided feature sibling's, and then pinned
# leaf-for-leaf against it outside a declared allow-list (tests/test_config_load.py). Inheritance
# would be the smaller file and the worse record: a `base:` chain hides which settings this run
# shares with the model it is compared against, and the whole value of the comparison is that
# everything outside the input representation is identical. Drift in `seed`, `lr`, `free_bits`, the
# coverage floor or the spike breaker would be attributed to the transform.
#
# Prerequisites:
#   * HDF5 datasets built by the CAUSAL variant of the pipeline, which writes `transform: 'causal'`,
#     per-block `causal_warmup_steps` and `causal_delay_s`, and 36/66/36/15 channels. A two-sided
#     shard is refused by name before any run directory exists.
#   * The stats file at `stat_path` regenerated from those same shards by
#     `hdf5_dataset/calculate_dataset_stats.py` at a matching `trim_minutes`. It accumulates its
#     constants EXCLUDING the warm-up region, which is what makes zero the channel mean over the
#     region the model actually reads -- and therefore what makes the source-null control a floor
#     rather than a leak.
#
# NATS FROM THIS CONFIGURATION ARE COMPARABLE ONLY TO THE CONV-TRANSFORMER CAUSAL CELL. The
# reconstruction is summed over H * C_keep = 10 * 76 = 760 coefficients against `lag_attn_fs`'s
# 30 * 78 = 2340: since 2026-09-05 both cfs cells forecast H = 10 while the two-sided cells still
# forecast 30, so on the TARGET edge neither the block nor the horizon axis is shared, and a loss
# level is readable against `teb_vae/lag_attn_transformer_cfs` alone -- which ships the identical
# `horizon`, `anchor_stride`, `horizon_weight_halflife_steps` and `additive_margin`, pinned
# leaf-for-leaf by its tests/test_config_load.py. `sweep_horizon_15.yaml` is the arm that shortens
# the horizon further, and it is the only place the anchor-count cost of the horizon is measured.
#
# Run from the repo root:
#   python -m teb_vae.lag_attn_cfs.trainer --config teb_vae/lag_attn_cfs/configs/default.yaml

general_config:
  tag: lag_attn_cfs_baseline

  seed: 42
  cuda_devices: [0, 1, 2, 3, 4, 5, 6]
  # Adam's per-parameter normalisation makes the step size invariant to the loss-scale change from
  # summing over 760 coefficients instead of 2340, so the sibling's stability-tuned value transfers
  # unchanged; the clip threshold below does NOT and is re-derived.
  lr: 0.0003
  # Singular; the experiment driver reads this exact key. Decay is x0.1 per milestone.
  #
  # Inherited from the comparison model, and for its reason: z is the only route to the decoder, so
  # the source pathway starts at exactly zero KL and can only earn coupling once beta is on -- which
  # is epoch 50. These milestones give 400 epochs at full LR with beta at its endpoint.
  lr_milestone: [400, 800]
  # Epoch cadence of the loss-curve HTML and the diagnostic figure, both rendered by rank 0
  # inside the fit; at 1 a multi-day run pays two PDF renders plus an HTML rewrite every epoch.
  plot_frequency: 5
  epochs: 5000
  accumulate_grad_batches: 1
  # Held at the comparison model's 128 deliberately: the anchor tiling already cuts the five
  # anchor-axis tensors by ~5x at the shipped stride (A_max 32 against the dense 156), and
  # spending that saving on a larger
  # batch would confound the comparison with a different gradient-noise scale.
  batch_size:
    train: 128
    test: 128

  folders_config:
    # IDENTITY, not a preference: a shared output tree makes the two models' runs
    # indistinguishable by the only field anything indexes on.
    out_dir_base: /data/deid/isilon/MS_model/new_vae_teb_cross_attention/lag_attn_cfs

model_config:
  VAE_model:
    # --- KL / beta schedule ----------------------------------------------------
    # NLL summed over the forecast block and KL summed over d_z are both nats per anchor, so
    # beta = 1 would make reconstruction-plus-KL the exact ELBO of the source-conditioned branch.
    # The warm-up starts at exactly 0: z is the ONLY route to the decoder, and a nonzero beta
    # before the decoder can use the latent at all is the standard route to posterior collapse.
    #
    # 1.0 / 0.1, carried across from the two-sided feature sibling UNMEASURED at this scale, and the
    # comment must not hide what that means. That pair was selected by a four-arm sweep over a block
    # of 2340 coefficients at ~240 decoded anchors per step; this block is 760 coefficients at
    # ~31 decoded anchors per step, so the reconstruction side of the ratio the sweep was stated
    # in is 0.32x on the block axis and the per-step anchor count is roughly an eighth. The
    # sweep came out MONOTONE in beta with its lower edge winning every column, which is why the
    # lower edge is what transfers rather than a scale-matched rescaling -- the one prediction that
    # sweep refuted was exactly the scale-matching argument.
    #
    # Resolved by the headline run's `kld_active_frac` and `logvar_prior_floor_frac`, and a four-arm
    # sweep mirroring the sibling's is the follow-up if either says the latent collapsed or the
    # prior pinned. Until then a divergence from the sibling's curves is attributable to the target
    # domain OR to this pair, and RESULTS.md says so.
    beta_schedule:
      kind: linear_warmup
      start: 0.0
      end: 1.0
      warmup_epochs: 50
    # nats per latent dim per step; 0.0 disables the floor. Deliberately zero: a positive floor
    # is a laundering subsidy the raw sibling measured (KL filled whether or not it is source-driven),
    # and with the zero-KL start plus the beta warm-up, collapse is guarded structurally.
    free_bits: 0.0
    # Weight of the prior scale anchor sum_d 0.5*(exp(lv_p) - 1 - lv_p), the term that keeps the
    # conditional prior's log-variance off its clamp floor: nothing else in the objective penalises
    # a NARROW prior, and the first production run of this family pinned 99.2% of prior coordinates
    # on the -5 floor within one epoch. Constant, not a schedule -- the collapse completes between
    # epoch 0 and epoch 1, so any warm-up would arrive after the damage.
    #
    # Moves with beta rather than independently: what is held fixed across this file and every sweep
    # arm is the RATIO beta_prior/beta = 0.1, so the anchor keeps the same standing against the KL it
    # is measured beside.
    beta_prior: 0.1

    # --- Reconstruction likelihood --------------------------------------------
    # 'gaussian_nll' consumes the decoder's learned log-variance heads, keeping every parameter
    # in DDP's expectation set (find_unused_parameters=False). 'mse' starves them; it exists for
    # debugging, not for headline runs.
    likelihood: gaussian_nll

    # Reconstruction weighting: base and full at unit weight, per the objective's definition.
    lambda_full: 1.0
    lambda_base: 1.0

    # --- Auxiliary shape terms (OFF, and lambda_boundary is REFUSED at any other value) --------
    # The three shape penalties in the shared objective -- multiscale L1, derivative Huber and
    # boundary continuity -- are RAW-WAVEFORM concepts, and this block's last axis is 98 surviving
    # target channels: an unordered index with no metric, so a difference between adjacent entries
    # is a difference between two unrelated coefficients. That is the two-sided sibling's reason and
    # it is unchanged here.
    #
    # `lambda_boundary` carries a SECOND reason that is specific to this cell, and it is a refusal
    # rather than a preference: the boundary term is a slicing identity over ADJACENT anchors,
    # joining anchor t's first forecast sample to anchor t-1's last. This family always decodes a
    # tiled anchor set whose entries are S apart, so at any non-zero weight the term would join two
    # windows a whole horizon apart and score the gap between them as an error. The shared objective
    # raises on that combination and the driver's pre-flight refuses it before a run directory
    # exists.
    lambda_ms: 0.0
    lambda_deriv: 0.0
    lambda_boundary: 0.0

    # --- Backbone widths -------------------------------------------------------
    d_model: 128
    # The latent must carry the whole FHR predictive state, and it is the decoder's ONLY input --
    # there is no state bypass here -- so it is the model's narrowest point. 64 = 4 groups of 16,
    # divisible by num_heads as the head-structured posterior requires. Held at the comparison
    # model's value, which is what keeps the two comparable.
    d_z: 64
    # H = 10 decimated steps = 40 s forecast, moved from 30 on 2026-09-05 together with the
    # conv-Transformer causal cell, so the ENCODER edge still differs in the encoder alone. The
    # two-sided cells still forecast 30, so the target edge no longer shares a horizon axis either
    # (tests/test_config_load.py exempts `horizon` on that edge and says why).
    #
    # It is paid for in anchors, and the tradeoff is geometric rather than clinical. Anchors live in
    # [F, T - H), so shortening H from 30 to 10 lengthens T_valid from 270 to 290 and the dense
    # anchor count from 136 to 156. The floor is unaffected by the horizon -- it comes from the
    # channel warm-up, which does not know what H is -- but the interaction is worth stating: at
    # the budget that would keep all target channels (W' = 278) there are only 12 anchors at H = 10
    # and exactly ZERO at H = 30, so keeping every channel remains geometrically impossible here.
    # The horizon remains one of the two levers on the warm-up cost. `sweep_horizon_15.yaml` is the
    # arm that shortens it further and is where the anchor-count cost is measured rather than
    # argued about.
    #
    # FIVE KEYS FOLLOW IT and are re-derived below rather than left behind: `anchor_stride` (the
    # tiling of the new 156-anchor span), `horizon_weight_halflife_steps` (stated as H/2),
    # `horizon_depth` (its receptive-field criterion is RF >= H + 1), `gradient_clip_val` and
    # `additive_margin` (both scale with the summed block). The startup log prints the resolved
    # geometry so a run whose config moved one and not the others says so in its first lines.
    horizon: 10

    # A GEOMETRY INPUT, and not the decoder width. TrimmedRawGeometry validates the raw index
    # identities against it and the diagnostic page draws its first row on the raw grid, so the key
    # stays; what each horizon token emits is the surviving TARGET CHANNEL count, taken from the
    # resolved warm-up budget rather than from any config key.
    raw_per_step: 16
    # The ANCHOR FLOOR, and it is one decision with `causal_warmup_budget_steps` and
    # `causal_align_reference` below rather than three settings. It is the maximum of TWO
    # requirements, which bind on different halves of the model:
    #
    #   SCORED TARGET. A forecast at anchor t, horizon step tau, reads target time t + 1 + tau, and
    #   channel c is honest there only from W'_c onwards; requiring every kept channel to be valid
    #   across every anchor's whole window collapses to F >= B - 1, with B the slowest SURVIVOR's
    #   wait. B = 134 here, so this half asks for 133.
    #
    #   SHIFTED INPUTS. Under the alignment a channel gathered with a shift of d_c steps is honest
    #   only from W'_c + d_c, so the floor must additionally clear max_c(W'_c + d_c) on BOTH input
    #   streams. The zero-marginal-warm-up lemma makes that exactly 134, on both.
    #
    # 134 = max(133, 134) is what ships, and the reference costs the one anchor between them. The
    # constructor refuses a lower one by name, saying which of the two requirements it violated;
    # without that refusal the objective would score the assumed pre-recording history of the
    # slowest kept channel as signal, with every shape correct and every warm-fraction readout
    # still reporting 1.0.
    #
    # 134 steps is 536 s, i.e. 8.93 minutes. It is a CAUSAL-VALIDITY boundary, not a clinical
    # policy: nothing physiological distinguishes it from step 150, and the model's own 30-step
    # warm-up has long passed at either. `sweep_floor_150.yaml` ships the ten-minute policy arm, at
    # a cost of one tile and 16 covered target steps for the identical 98 channels.
    warmup_period: 134
    sequence_length: 300
    c_y: 80                # 36 (fhr_st) + 44 (fhr_ph) under integer_harmonic_v1; legacy 36 + 66 = 102
    c_u: 46                # 36 (up_st) + 10 (up_ph) under integer_harmonic_v1; legacy 36 + 15 = 51
    use_up_st: true
    lstm_layers: 2
    dropout: 0.1
    # Dropout for the SOURCE pathway alone -- its adapter/front end, its encoder, and the attended
    # source summary inside the posterior fusion. null = exactly the previous model, which is NOT
    # one number: the adapter and encoder always ran at `dropout` above and keep doing so, while the
    # dropout on the attended source summary is a site this key INTRODUCED and null leaves off.
    source_dropout: null
    # Hidden width of the shared horizon decoder core. 256, doubled with the latent above: the
    # decoder is the only thing standing between one latent vector and the whole forecast block.
    decoder_hidden: 256
    # Watched through logvar_full_floor_frac and logvar_full_ceil_frac, which are per-COEFFICIENT
    # here because block_width is C_keep and not the raw grid's R.
    logvar_clamp: [-5.0, 3.0]
    # Latent stabilisers: saturation magnitudes of the tanh-bounded latent heads.
    mu_scale: 5.0
    delta_mu_scale: 3.0
    delta_logvar_scale: 2.0

    # --- Anchor coverage floor -------------------------------------------------
    # Minimum valid fraction of an anchor's forecast window for the anchor to enter the loss at all:
    # a half-masked anchor's summed NLL covers half a window and its base-minus-full gap reads
    # spuriously small. Revisit against the logged anchor_coverage_frac distribution.
    coverage_floor: 0.9

    # --- How the base branch gets its latent ------------------------------------
    # 'sample' decodes z^p = mu^p + sigma^p * eps (the shared eps); 'mean' decodes at mu^p.
    #
    # 'mean' is shipped because D_0 is the only term in the objective whose gradient DIRECTLY
    # prefers a narrow prior: it decodes a *sample*, sampling noise can only degrade a forecast, so
    # its gradient on the prior log-variance points down without limit and nothing opposes it from
    # below. Under 'mean' the prior's scale is left to the two terms that want it WIDE: KL(q||p),
    # which pulls the prior out to cover the posterior, and the scale anchor.
    #
    # The cost, accepted deliberately: base and full are no longer bitwise identical at init, since
    # the full branch still carries the posterior's noise; and the TRAINING-path pred_gap is no
    # longer a common-random-numbers contrast, so it is biased down by an amount that has nothing to
    # do with the source. Do not compare a training-path pred_gap across this key.
    base_decode: mean

    # --- How the posterior's log-variance is built -------------------------------
    # 'residual' adds a bounded delta to the PRIOR's pre-bound raw log-variance; 'independent' gives
    # the posterior its own head. 'independent' is the second of the two paths that collapse the
    # prior's scale and the one that survives base_decode: mean -- under 'residual' the full
    # branch's pressure to sharpen sigma_q lands on the PRIOR's own tensor.
    #
    # The cost: q == p at init is no longer structural. It is recovered exactly under
    # head_init_calibration (shipped true), which pins the prior's raw log-variance to the same
    # constant the independent head is seeded at, so the KL is still exactly 0 at step 0 -- which is
    # what the whole coupling readout rests on.
    posterior_logvar_mode: independent

    # --- Causal history states (REQUIRED for the KL to mean anything) -----------
    # Swaps every encoder GroupNorm for CausalGroupNorm. Without it the encoder statistics pool
    # across time, the "prior" conditions on the future, and the source-conditioned KL is not a
    # coupling readout at all. Note this is about the NETWORK's history states and is independent of
    # the one-sidedness of the stored coefficients: the transform can be causal and the encoder not.
    causal_norm: true

    # --- Causal input reach budget: REQUIRED null on this dataset ---------------
    # The two-sided guard, and it is not merely unnecessary here but undefined. `causal_reach_budget_s`
    # prunes channels by the FORWARD reach L95 of a filter -- an energy quantile of a two-sided
    # kernel -- and it is measured on the production kymatio Morlet bank, which did not produce
    # these coefficients. Fed a causal config it would read the same reaches it reads on a two-sided
    # run and resolve delays that describe another dataset; and a delay is a SHIFT, so every gated
    # channel would additionally be read late on top of its warm-up.
    #
    # Set alongside `causal_warmup_budget_steps` the warm-up resolver refuses both by name, so this
    # null is load-bearing rather than decorative. It is present rather than absent so the parity
    # comparison against the two-sided sibling stays leaf-for-leaf.
    causal_reach_budget_s: null

    # --- Causal WARM-UP budget: the guard this dataset actually needs -----------
    # Threshold on W'_c, the leading delay enclosing 95% of a one-sided kernel's energy, rebased
    # into the trimmed window the loader serves. A channel survives when W'_c <= this value. The
    # threshold names no constructor argument: the driver resolves it against the CONFIGURED SHARDS
    # into the four concrete channel tuples the network takes, and those tuples are what land in
    # every checkpoint's model_kwargs -- so a run's channel set is recoverable from its checkpoint
    # alone, with no shard present.
    #
    # Read from the shards rather than declared in YAML for a reason that is easy to miss: a dataset
    # rebuilt at another `causal_warmup_quantile` changes both the warm-up vectors AND the stored
    # channel count (0.90 keeps 37 scattering channels, 0.95 keeps 36, 0.99 keeps 35), so a config
    # literal would silently describe a boundary the data no longer has. Every configured shard is
    # validated, not only the first.
    #
    # 134 keeps 98 of 102 target channels. It is where `fhr_ph` tops out, so ALL 66 phase channels
    # survive it, and the `fhr_st` staircase has a channel at exactly 134 with the next at 162 --
    # the boundary lands on the ~0.008 Hz frequency edge both phase selections already use, rather
    # than on an arbitrary cut. The four dropped channels wait 162, 194, 233 and 278 steps.
    #
    # The SOURCE is never gated BY THIS BUDGET: its slowest channels carry the contraction envelope,
    # and dropping them to make every reachable lag warm would cost almost the whole `up_ph` block
    # against a lag search that exists to find the 20-120 s contraction-to-deceleration delay. All
    # 51 survive it, the availability mechanism announces per step when each arrives, and the
    # residual is MEASURED -- `source_lag_warmth_frac_st` and `_ph`.
    #
    # The ALIGNMENT below is a different rule and does drop four of them, for a different reason:
    # a channel slower than the reference could only reach it by being read from a LATER stored
    # step, which reads raw signal after the anchor. That is a correctness requirement, not a
    # policy about how much of a segment to spend waiting, and it takes `up_st` 32-35 while leaving
    # all fifteen `up_ph` standing.
    causal_warmup_budget_steps: 134

    # --- Causal CHANNEL ALIGNMENT: one clock per input stream -------------------
    # Every one-sided filter carries its own group delay, spanning 13.3 s to 791.0 s across a
    # stored block, and the encoder reads a stream's channels as ONE VECTOR PER STEP -- which
    # asserts that its entries describe one instant when they span thirteen minutes. This key
    # re-indexes each channel by d_c = round(kappa * (tau_ref - tau_c) / 4 s) so that they do,
    # with kappa = 1 - 1/(2*gamma) = 0.875 the energy-centroid factor: `causal_delay_s` stores
    # the envelope MEAN tau_g, while a channel's content actually sits at kappa * tau_g. Only
    # the DIFFERENCE is scaled, so the reference channel still takes shift 0 and the drop rule
    # does not move; d_c spans 0-85 rather than 0-97 and the worst residual is 1.9865 s.
    #
    # `target_max` resolves tau_ref from the SHARDS -- the slowest kept target channel, 402.1604 s,
    # the filter at 0.008240 Hz that is simultaneously the maximum of `fhr_ph`, the maximum of
    # `up_ph`, the channel `causal_warmup_budget_steps` already stands on, and the lower band edge
    # both phase selections use. Never a YAML literal: a rebuilt bank moves every delay, and a
    # number written here would keep resolving shifts against a transform the shards no longer
    # have. An explicit float in seconds is admitted for the every-lag-warm arm at 150.79 s, and it
    # is snapped to the channel it names because the stored vector is float32.
    #
    # WHAT IT COSTS. The anchor floor moves 133 -> 134 (one anchor, 137 -> 136) because a channel
    # is honest at W'_c + d_c rather than at W'_c; the source loses the four channels above the
    # reference, 51 -> 47; and the freshest uterine activity any channel reports moves from 13.3 s
    # to 402.2 s before the anchor as the shards report it -- kappa * 402.1604 = 351.9 s of
    # realised delay, which is the number a physical reading takes. That last one is the real
    # price -- a common clock is bought with recency -- and it is why the pre-registered
    # reading is that alignment should NOT improve the forecast gap and SHOULD improve
    # lag-profile concentration if there is a real lag.
    #
    # WHAT IT COSTS IN WARM-UP: nothing. With W_c ~ rho * tau_c, W_c + delta*d_c =
    # kappa*tau_ref + (rho-kappa)*tau_c <= rho*tau_ref, so max_c(W'_c + d_c) = 134 = max_c W'_c
    # exactly, on BOTH streams.
    # `null` is the unaligned arm and is bitwise the model that shipped before this key existed.
    causal_align_reference: null

    # --- The SOURCE stream's own clock ------------------------------------------
    # The key above puts BOTH streams on 402.1604 s, which means the freshest uterine activity any
    # channel reports sits 402.2 s before the anchor. That is not a recency complaint: it decides
    # WHERE A PHYSIOLOGICAL DELAY IS READABLE AT ALL. The lag reporting a delay of tau seconds at
    # horizon step h is ell = (tau - offset)/4 - 1 - h on the CANONICAL STORED TIMELINE (the
    # dataset builder's UP shift is part of the stored signal; no term ever undoes it), so at
    # offset 0 a 20-60 s contraction-to-deceleration delay lands at lags -25.0 to 14.0 across
    # h in [0, 29] -- below lag 0, i.e. CENSORED at the near edge of the window, for every
    # horizon step past h = 4 at the 20 s end. A
    # model cannot report a lag the window does not contain, and no amount of training moves it.
    #
    # This key aligns the source onto a faster clock of its own while the target keeps 402.1604 s,
    # so the difference between them is one KNOWN constant on the lag axis (the offset below)
    # instead of the unaligned arm's channel-pair-indexed smear of over a thousand seconds. A
    # per-stream MAXIMUM was rejected in the alignment work for restoring a bias nothing states;
    # this is the opposite object -- a reference chosen by measurement whose offset travels
    # explicitly through the startup log, the causality disclosure and the physical-lag identity.
    #
    # PINNED BY MEASUREMENT, not chosen. `python teb_vae/lag_attn_cfs/warmup_budget.py` prices every
    # candidate drawn from the stored source delays against three quantities. At 288.2672 s:
    #   * the 20-60 s band sits at lags -0.1 to 38.9 of [0, 90] (realised offset
    #     kappa*(tau_u - tau_y) = -99.66 s, canonical timeline): clear of the far edge at every
    #     horizon step and clear of the near edge at all but the last, where the 20 s end sits
    #     0.1 lag (0.3 s) below lag 0 at h = 29. Earlier printouts quoted 8.5-47.5 (unscaled
    #     offset AND a -20 s dataset-shift term) and 4.9-43.9 (scaled, still with the shift
    #     term); both are superseded. Against the single reference's -25.0 to 14.0. Whether
    #     this marginal graze warrants re-pricing the pin is a CFS-12 experiment question, not
    #     a comment edit;
    #   * `up_ph` keeps 9 of 15 channels, above the 8 required. The four casualties are the slowest
    #     harmonic siblings (three at 402.160 s, three at 340.292 s), and the criterion exists
    #     because a faster clock buys the lag axis by discarding exactly the contraction-envelope
    #     block the axis exists to locate;
    #   * the freshest surviving source channel moves 402.2 s -> 288.3 s before the anchor as the
    #     shards report it, 351.9 s -> 252.2 s realised at the energy centroid.
    # It is the unique candidate satisfying both criteria: 340.2920 and above are censored, and
    # 244.5197 and below keep 6 or fewer `up_ph`. The source stream goes 47/51 -> 39/51 channels.
    #
    # Snapped against the stored SOURCE delays, so a literal that names no source channel is refused
    # by name rather than silently dropping that channel and its harmonic siblings. `null` restores
    # the single-clock scheme and resolves byte for byte what it did before this key existed; it is
    # a named sweep arm. Requires `causal_align_reference` above to be set -- the scheme is a pair
    # of clocks, and against an unaligned target the offset does not exist.
    causal_align_reference_source: null

    # --- Which clock the forecast target is SCORED on ---------------------------
    # The two keys above align the INPUTS; this one re-indexes the QUESTION. The scored element at
    # anchor t, horizon step tau, kept channel c reads stored step t + 1 + tau + s_c:
    #
    #   'physical'  s_c = round(kappa * (tau_c - tau_min) / 4s) >= 0: every channel advanced so
    #               that horizon step tau describes signal content at ONE physical future instant.
    #               Every element is a strict forecast for every channel -- on the stored clock the
    #               slowest kept channel draws 2.6% of its value from the horizon window and its
    #               "forecast" is near-copyable, so the latent was never forced to encode
    #               genuinely predictive information at the slow scales. This is the default.
    #   'input'     s_c = -d_c: the continuation of the encoder's own aligned stream. Scored
    #               content sits up to ~350 s in the past and the source clock is ~100 s FRESHER
    #               than it, so pred_gap loses its directed reading there; kept as an arm, not a
    #               default. Requires causal_align_reference above.
    #   'stored'    s_c = 0 (also the absent key): every run before this key existed.
    #
    # WHAT 'physical' COSTS AND MOVES. The largest advance is 85 steps (the slowest kept channel,
    # round(0.875*(402.1604-13.3405)/4)), so the anchor ceiling drops from T_valid = 270 to 185:
    # dense anchors 136 -> 51, and `anchor_stride` below moves to 5 to keep ~10 training tiles
    # per sample. The floor does NOT move -- the scored-target half relaxes to
    # max_c(W'_c - s_c) - 1 while the shifted-inputs half still binds at 134. Validity is pooled
    # conservatively over the shift span (see CausalFeatureForecastTarget.scored_weight), and the
    # novelty-tertile split keeps its stored-clock ranking (readout only; its interpretation note
    # lives with the buffer).
    #
    # WHAT 'physical' MEANS FOR THE LAG AXIS. The 20-60 s proximate UP->FHR band is STRUCTURALLY
    # censored under a strictly-future target: the offset the lag identity subtracts becomes
    # tau_u_ref - tau_min, and clearing lag 0 at the far horizon step would need tau_u_ref < 34 s
    # -- below every stored source delay. That is arithmetic, not tooling: the proximate driver of
    # a predicted instant is unrecorded at the anchor, for every reference. What past UP carries
    # about future FHR is the contraction cycle's phase, so the axis is re-registered to the
    # RECURRENCE window: at the retained source clock 288.2672 and max_lag 90 the every-step
    # readable content-delay window is [360.6, 604.6] s at the realised offset
    # kappa*(288.2672 - 13.3047) = 240.6 s on the canonical stored timeline (earlier printouts
    # quoted [374.9, 618.9] s from the unscaled offset and [340.6, 584.6] s with a -20 s
    # dataset-shift term; both superseded) -- the previous one-to-two contractions
    # of the 2-5 min IUP cycle. Re-price with warmup_budget.py (it prints this window per
    # candidate under a physical-clock config); a faster source clock cannot help, because
    # reaching even 240 s at every step keeps at most one `up_ph` channel.
    #
    # `sweep_target_clock_stored.yaml` restores today's target and tiling exactly;
    # `sweep_target_clock_input.yaml` is the aligned-continuation arm. planted.yaml PINS 'stored':
    # its planted delay is stamped in stored steps and lag_recovery_check refuses any other clock.
    causal_target_forecast_clock: stored

    # Which phase-harmonic operator built the CONFIGURED SHARDS' two phase blocks, checked against
    # their own `causal_leg_alignment` root attribute and refused by name on a disagreement.
    #
    # This is a SEPARATE mechanism from the reference above and is deliberately not derived from
    # it. Under `none` the two legs of a phase pair are multiplied at one stored index although
    # they report the signal at two different instants -- a skew reaching 291.6 s -- so the stored
    # `causal_delay_s` the alignment resolves its shifts from is a MISPREDICTION there, missed by a
    # median of 60.5 steps on `fhr_ph`. Shifting by a number the data does not have is worse than
    # not shifting at all, which is what this key exists to prevent.
    #
    # Point the dataset paths below at the shards built with `--leg-alignment envelope`, or set
    # this to null to state that the run does not care (which is what a two-variant comparison is).
    causal_leg_alignment: envelope

    # Which phase-harmonic OPERATOR VERSION built the configured shards' phase blocks, checked
    # against their `causal_phase_operator` root attribute (absent = ratio_power_v0) and refused
    # by name on a disagreement.
    #   ratio_power_v0      : every shard on disk. The accelerated leg is raised to the floating-
    #                         point ratio xi_j/xi_i, so the k = 6 family (p = 2^(3/2), 22 of 66
    #                         fhr_ph and 5 of 15 up_ph channels) is DISCONTINUOUS across the
    #                         principal-angle branch (jump 2|y||sin(pi p)| ~ 1.03|y|). Retained so
    #                         this configuration keeps describing the shards, stats and checkpoints
    #                         it was trained on; it is NOT the corrected representation.
    #   integer_harmonic_v1 : integer harmonics k in {2, 4} only, applied as stored integers;
    #                         44 fhr_ph / 10 up_ph, so c_y = 80 and c_u = 46 and the widths above
    #                         must be re-declared. Needs its own shards and statistics; see the
    #                         baseline arm `configs/baseline_int_stored.yaml`.
    # `null` states that the run does not care (a two-version comparison).
    causal_phase_operator: integer_harmonic_v1

    # --- Anchor tiling ---------------------------------------------------------
    # S, the spacing between decoded anchors, in [1, H]. Over epochs every anchor in
    # [F, anchor_ceiling) is used, because the per-segment phase rotates with the epoch.
    #
    # 5 = H / 2, down from 13, and the shorter horizon is why. The stored clock's ceiling is
    # T_valid = 290, so the anchor span [134, 290) holds 156 dense anchors; S = 5 tiles it into
    # A_max = 32 tiles at phase 0 and 31 at every other phase (mean 156/5 = 31.2), against the
    # 10-11 tiles the previous H = 30 / S = 13 geometry decoded. Consecutive windows overlap by
    # exactly half a horizon, so every scored coefficient is seen from two anchors per step;
    # every loss denominator is an anchor count, and the KL support is a set either way, so
    # overlap changes correlation between tiles rather than any denominator. The per-step training
    # tensors barely move: (B, 32, 10, 76) is 320 anchor-steps per sample against the previous
    # (B, 11, 30, 76) at 330, and validation, which decodes all 156 anchors densely every epoch,
    # is what bounds memory either way (156 x 10 = 1560 against the previous 136 x 30 = 4080).
    # tests/test_config_load.py and tests/test_sweep_configs.py pin the pairing (horizon, stride)
    # here rather than leaving it to be noticed; the constructor refuses S outside [1, H].
    #
    # Validation and test decode every valid anchor -- stride 1, phase 0 -- rather than one tile
    # grid: a single phase is deterministic but PHASE-BIASED, sampling the same few anchors at
    # a fixed offset from the segment start forever. There is no gradient there, so neither the
    # redundancy argument nor the memory argument applies. `sweep_anchor_stride_1.yaml` is the arm
    # that trains densely too.
    anchor_stride: 5

    # F_u, the earliest source step lag attention may read: the lag mask generalises from
    # 1[t - l >= 0] to 1[t - l >= F_u]. Ships at 0, where it is BITWISE the two-sided sibling's mask,
    # and exists so the source compromise above is measurable rather than argued about. No arm moves
    # it; `source_lag_warmth_frac_ph` falling below the fraction of lags that are warm at all is the
    # measurement that would justify a non-zero value.
    lag_floor: 0

    # --- Per-block reconstruction weights ---------------------------------------
    # The relative weight of the two stored target blocks in BOTH reconstruction terms. The
    # objective was uniform over channels until now, and uniform was never neutral: at the shipped
    # budget 66 of the 98 survivors are phase-harmonic against 32 scattering, so two-thirds of the
    # loss went to `fhr_ph` by nothing more deliberate than there being twice as many of them.
    #
    # 1.0 / 0.1 shifts that: the resolved weights are 2.5389 on each scattering channel and 0.25389
    # on each phase-harmonic one, so scattering carries 82.9% of the block against 32.7% before.
    #
    # RENORMALISED, which is why those numbers are not 1.0 and 0.1. The vector is scaled by
    # C_keep / sum(w), so the weighted block sums to the same magnitude the uniform one did. Without
    # that, this pair would shrink the reconstruction 2.5x against a KL that did not move -- a 2.5x
    # rise in the effective beta wearing a channel weight's name, and `gradient_clip_val` and
    # `additive_margin` would both be out of date again. Only the DISTRIBUTION across channels
    # moves. What the pair states is therefore a RATIO: 10.0 / 1.0 configures the same objective.
    #
    # WHY SCATTERING IS FAVOURED, and it is a hypothesis this run tests rather than a settled fact.
    # DIAGNOSIS.md section 8 measured that the channels the model gives up on -- suppressed at the
    # input adapter, forecast as conditional variance rather than as level -- are largely the fast
    # phase-harmonic ones, whose persistence R^2 is already negative by horizon step 4. Under a
    # uniform objective most of the block was being spent on channels the optimiser had decided were
    # unforecastable, and the two-minute horizon made that worse. Read `pred_gap_st` against
    # `pred_gap_ph` to judge it: they recompose to `pred_gap` over the same denominator.
    #
    # THE COST, stated because it is not recoverable from the columns. A weighted reconstruction is
    # not a log-density, so beta = 1 is no longer the exact ELBO of the source-conditioned branch.
    # The renormalisation keeps the SCALE honest, not the UNIT. Both weights at 1.0 restore the
    # uniform objective bitwise.
    #
    # THE EVALUATION PIPELINE IS DELIBERATELY NOT WEIGHTED, and this is the one asymmetry to hold in
    # mind when reading a run. `eval/` scores its blocks through the same reduction with no weight
    # vector, so every `nll_*` and `pred_gap` it reports is a true log-density in nats and
    # `pred_gap_mc_likelihood_pct` remains a probability statement. Training optimises the weighted
    # objective; the evaluation measures the unweighted one. That is the right split -- the weights
    # are a training device for where capacity goes, not a claim about what a good forecast is --
    # but it means a `pred_gap` from `metrics_history.csv` and a `pred_gap` from `summary.json` are
    # no longer the same quantity, and neither document's value should be copied into the other's
    # table.
    #
    # Equal on the ENCODER edge, necessarily: this is a property of the objective, not of an
    # encoder, so both cfs cells ship the same pair or the two architectures are compared under two
    # different losses.
    target_weight_st: 1.0
    target_weight_ph: 0.1

    # --- Horizon weighting of the reconstruction --------------------------------
    # Half-life, in horizon steps, of a decaying weight w_tau ~ 0.5^(tau/halflife) applied to BOTH
    # reconstruction terms on the horizon axis. 5.0 is half of this cell's H = 10; the rule is
    # H / 2, so the far step always carries a quarter of the near step's weight before
    # renormalisation whatever the horizon is.
    #
    # WHY. The objective was uniform over horizon steps, and uniform was never neutral here either.
    # A stored coefficient at anchor t, horizon step tau, is a causal integral over a window that has
    # left the observed past entirely by the far steps: the fraction already fixed by observed
    # history falls from 0.5 at tau = 0 towards zero by the last step on the surviving set. So the far steps
    # are the majority of the block AND are the part a fast channel cannot forecast at all, and the
    # cheapest way to lower a uniform sum over them is to widen the conditional variance everywhere
    # and stop predicting the level anywhere -- which is exactly the suppressed-fast-channel
    # signature the two-minute horizon made worse. Weighting the near steps up removes that payment
    # without removing the far steps from the objective.
    #
    # RENORMALISED, like the channel pair above and for the same reason: the vector is scaled by
    # H / sum(w), so the weighted block sums to the same magnitude the uniform one did. Without it
    # the reconstruction would shrink 1.73x against a KL that did not move -- a 1.73x rise in the
    # effective beta wearing a horizon weight's name, and `gradient_clip_val` and `additive_margin`
    # would both be out of date. Only the DISTRIBUTION across horizon steps moves. At 5.0 and
    # H = 10 the resolved weights run from 1.7260 at tau = 0 to 0.4957 at tau = 9, a 3.5x spread
    # (at the previous 15.0 / H = 30 they ran 1.8063 to 0.4729: the H / 2 rule keeps the profile).
    #
    # THE COST, stated because it is not recoverable from the columns. A weighted reconstruction is
    # not a log-density, so beta = 1 is no longer the exact ELBO of the source-conditioned branch and
    # `pred_gap_mc_likelihood_pct` is no longer a probability statement about the TRAINING objective.
    # This compounds with the channel weights above rather than replacing them: they cut the block's
    # other axis. Read `pred_gap_tau_first` against `pred_gap_tau_last`, which recompose to
    # `pred_gap` over the same denominator and are computed under the same two weights.
    #
    # THE EVALUATION PIPELINE IS DELIBERATELY NOT WEIGHTED on this axis either, exactly as it is not
    # on the channel axis: every `nll_*` and `pred_gap` in `summary.json` is a true log-density in
    # nats. Training optimises the weighted objective; the evaluation measures the unweighted one.
    #
    # Equal on the ENCODER edge, necessarily: this is a property of the objective, not of an encoder,
    # so both cfs cells ship the same half-life or the two architectures are compared under two
    # different losses.
    #
    # `null` builds no weight at all and is bitwise the horizon-uniform objective. The two-sided
    # cells never carry this key.
    horizon_weight_halflife_steps: 5.0


    # --- Attention -------------------------------------------------------------
    max_lag: 90            # L = 91 (~6 minutes of UP history at 4 s/step)
    num_heads: 4
    d_head: 32
    use_entmax: true       # exact zeros in the lag distribution, not merely small weights
    attention_grad_checkpoint: false

    # --- What the lag attention reads: the source key/value memory ---------------
    # `conv_stem` builds the attention's keys AND values from the source input adapter followed by
    # the causal convolution stem alone -- the same (3, 5, 11) x (1, 2, 4) + (8, 16) schedule the
    # source encoder's convolution branch uses -- instead of from the deep source history state.
    # The deep encoder is then NOT BUILT AT ALL: nothing else in the model consumes it.
    #
    # WHY. A deep causal state at lag 0 already contains a processed image of the states at every
    # larger lag, so by the data-processing inequality the near lags dominate the searched window
    # whatever the attention would prefer -- and a lag readout taken over such keys and values
    # cannot express a delay it is looking straight at. Measured on the planted-delay fixture, where
    # the informative lags are known and are [15, 44] and nowhere else, both architectures put their
    # support-corrected argmax at lag 0 with the deep state as memory. A bounded stem makes a key at
    # lag l a summary of a neighbourhood of l, which is what an attention over lags needs it to be.
    #
    # BOTH K AND V MOVE, and that is not a detail. Localising the keys alone would leave the lag-0
    # value informationally dominant and the degeneracy standing under a better-looking attention
    # map -- the same failure with a nicer picture.
    #
    # WHAT IT COSTS AND WHAT IT CANNOT FIX. The arm is SMALLER than the default, by the whole LSTM
    # branch and the fusion. What no model-side change reaches is the resolution floor beneath it:
    # the stem's own receptive field, and under that the transform's group delay -- a stored
    # coefficient is a causal integral over its channel's own window. That is the alignment
    # reference's territory, not this key's.
    #
    # READ THE REACH BEFORE READING A LAG PROFILE OFF THIS ARM. The stem inherits this encoder's
    # own convolution schedule, `encoder_extra_dilations` and `encoder_extra_kernel` included, so
    # at the shipped (3, 5, 11, 15, 15) x (1, 2, 4, 8, 16) its receptive field is 387 steps --
    # LONGER than the 91-step lag window and longer than the 300-step sequence. Dropping the LSTM
    # therefore removes unbounded recurrence and leaves a convolution memory that is still not
    # local, so on THIS architecture the arm does not yet separate a lag-0 key from a whole-prefix
    # one. The conv-Transformer cell's stem is 21 steps and is local; this one is not, and the
    # measured lag profile is to be read with that in front of it.
    #
    # `encoder` is the deep source state and is bitwise the model that shipped before this key
    # existed; `adapter` is the sharpest arm, the projected stream itself at one step of reach, and
    # ships as a named sweep arm rather than as the default.
    lag_kv_source: conv_stem
    # 'alibi_decay' seeds a learnable per-head short-lag prior on the attention scores.
    lag_bias_init: alibi_decay

    # ...and this SCALES that prior's slope, which at 0.0 makes the seed FLAT. The parameter is
    # still built and still learnable -- it is a (num_heads, L) tensor either way -- so this is not
    # "no bias": `lag_bias_init: normal` is the setting that registers no parameter at all, and it
    # is a different arm entirely.
    #
    # WHY FLAT SHIPS. At scale 1.0 the seed is -slope_h * ell, a monotone penalty in the lag, so a
    # freshly built model already prefers lag 0 by construction and the reported argmax cannot
    # distinguish "the data says lag 0" from "the initialisation says lag 0". Every profile this
    # family has measured on ground truth peaks at 0, and a decaying seed is one of the several
    # causes that predicts that on its own. Flat removes the initialisation from the list, at no
    # cost in expressiveness: the same parameter, reached by the same gradient, starting from a
    # position that asserts nothing about which lag matters.
    #
    # 1.0 remains the named comparison arm, and the pair is what separates the two explanations on
    # a fixture whose informative lag is known.
    alibi_slope_scale: 0.0
    # Whether the attention query reads the prior log-variance alongside its mean. false = query
    # from mu^p alone. Both inputs are target-only, so source purity holds either way.
    query_uses_logvar: false

    # --- Clock-symmetric conditioning ------------------------------------------
    # Give the PRIOR head the same input-timing information the posterior already receives, so the
    # availability clock cancels out of the KL instead of being attributed to the source.
    #
    # WHAT THE PRIOR IS GIVEN, and it is not the obvious thing. The intuitive clock is the
    # availability staircase the source adapter masks and announces with -- which channels have
    # arrived by step t. That is PROVABLY INERT here: the constructor refuses any anchor floor below
    # max_c(W'_c + d_c), which is exactly the last step at which the staircase changes, so every
    # SCORED anchor sees the same all-ones vector and a constant through a LayerNorm and a linear
    # map is an offset the head's biases already span. Measured: 18 distinct rows over t in [0, 300)
    # and exactly ONE over the scored [134, 270), with the resulting projection learning to a weight
    # RMS fifty times below every other matrix in the head and kld_source_null unmoved.
    #
    # What survives past the floor is the source ENCODER'S MEMORY of the warm-up transient -- h_u at
    # t >= F still carries the pattern of channels arriving one by one, because the encoder is
    # convolutional-recurrent. So the prior is conditioned on the encode of a ZEROED source stream:
    # the same tensor the source-null control feeds the posterior. It varies at every scored anchor
    # (136 of 136), and it carries ZERO information about the source's VALUES -- the stream it
    # encodes is exactly zero, identical for every recording and under every intervention.
    #
    # WHY IT IS ON. kld_source_null -- the KL that survives zeroing the source -- measured 3.72 of
    # 4.56 nats on the conv-LSTM cell and 11.48 of 12.48 on the conv-Transformer cell over the
    # planted fixture, i.e. four fifths to nine tenths of the attributed coupling. With both branches
    # given the same deterministic input the divergence between them is learnable to zero, and
    # kld_source_null becomes the check that the cancellation worked rather than the estimate of the
    # contamination.
    #
    # WHAT IT COSTS. One LayerNorm and one bias-free d_model x d_model projection on the prior head's
    # own input, plus one extra source encode per forward -- at BATCH 1, since a zero stream encodes
    # identically in every batch element, then broadcast. The encode is DETACHED and forced out of
    # train mode: detached so no gradient couples the prior to the source pathway, and out of train
    # mode so dropout cannot make the clock a fresh random draw every step (it must be a function of
    # t, or the prior's input distribution differs between the mode the objective runs in and the
    # mode every readout is measured in). The projection is zero-initialised and re-zeroed after the
    # generic init pass, so the model is bitwise the unconditioned one at step 0 and the exact
    # zero-KL start survives.
    #
    # `false` builds no projection at all and is bitwise the model that shipped before this key
    # existed. The two-sided cells never carry this key: their inputs are honest at every step, so
    # nothing arrives late, and their constructors refuse it by name.
    prior_availability_input: true

    # --- Shared horizon decoder core -------------------------------------------
    # Four dilated refine blocks, so the dilations are (1, 2, 4, 8) and the receptive field over the
    # horizon axis is 31 tokens against this cell's 10 horizon tokens.
    #
    # The family's recorded criterion is RF >= H + 1, i.e. 11 here, and RF = 1 + (k-1)(2^d - 1) = 31
    # clears it by twenty tokens. Depth 4 is NO LONGER the smallest depth that satisfies it: depth 3
    # has a receptive field of 15 and clears it by four (depth 2, at 7, does not), so the shorter
    # horizon would admit a shallower decoder. Kept at 4 for parity: it is what both comparison models ship, so the decoder core stays a
    # shared object across both edges. `sweep_horizon_depth_3.yaml` still ships the arm, now as a
    # parameter-economy question alone, and its header records that the question moves with H.
    #
    # Nothing in the shipped code ties this depth to the horizon, so the resolved receptive field is
    # written to the startup log beside H, S, A_max and the block width.
    horizon_depth: 4
    horizon_kernel: 3
    horizon_film: true
    # Bidirectional self-attention over the H horizon tokens, run inside the shared decoder core
    # after the dilated refine stack. 0 builds no module.
    horizon_attention_blocks: 2

    # --- Target persistence residual in the decoder's mean ----------------------
    # mu[t, tau, c] = w[tau, c] * y[t, c] + f_theta(z_t)[tau, c], with y[t, c] the TARGET's own
    # stored value at the anchor step and w a learnable (H, C) weight seeded to decay in tau
    # (half-life 5 steps, so w[0] = 1 and w[9] ~ 0.287 before training moves it).
    #
    # WHY. Without it the mean head has to synthesise the LEVEL of a strongly autocorrelated
    # coefficient out of z before it can say anything about its motion, and it pays for that out of
    # the same block score the horizon weighting above re-balances. The level is already in the
    # target's own past, which both branches condition on; making the decoder re-derive it is work
    # that buys no forecast.
    #
    # IT OPENS NO SOURCE BYPASS, and that is the property the whole coupling readout rests on.
    # y[t] is gathered from the TARGET stream through the gate's keep-index alone -- never through
    # its delay, which is the guard on an INPUT channel's reach -- and the SAME tensor is handed to
    # both invocations of the shared decoder, so it cancels exactly out of base-minus-full and
    # `pred_gap` stays a pure source readout. The permutation control's re-decode carries it too, or
    # the shuffle gap would move for a reason that is not the source. It touches the MEAN head only;
    # the log-variance path is the one it was without the residual.
    #
    # AT THE ANCHOR STEP, not at the last valid step before it. The evaluation's persistence
    # baseline uses the last OBSERVED step because it holds the decimated validity weight; no
    # validity signal enters the training forward, and the at-anchor definition is sound there
    # without one -- an anchor is target-warm by the floor refusal above, and an anchor invalid at
    # its own step is fully masked in the loss, so the residual scores nothing on it.
    #
    # `false` builds no parameter at all and is bitwise the model that shipped before this key
    # existed. The RAW-target causal cells never carry this key: a raw block's last axis counts
    # samples of one signal, so there is no per-channel level to carry forward, and their
    # constructors do not list it.
    persistence_residual: true

    # --- Initialisation policies (zero-parameter; the init-off arm varies all three) -------
    # Applied after the generic init; each is a no-op at the constructor default.
    #
    # Break the near-degeneracy of the horizon tokens at init, so per-block FiLM has token-specific
    # structure to modulate. 0.8, and it is here by MEASUREMENT rather than by inheritance: the
    # quantity the value is chosen against is the post-initialisation CORRELATION between two horizon
    # tokens, which is a function of the embedding's scale against the broadcast projected latent's
    # and does NOT depend on how many tokens there are. Measured on this model at both horizons:
    # mean off-diagonal correlation 0.999247 at std 0.02, 0.763746 at 0.4, 0.445915 at 0.8 and
    # 0.163197 at 1.6 for H = 15, against 0.999242 / 0.763937 / 0.447476 / 0.168075 for H = 30. The
    # halved token count moved the third decimal place, so the sibling's value is the re-derived one.
    horizon_embed_std: 0.8
    # Calibrate BOTH distribution heads onto their trivial starting points at init: the shared
    # decoder output heads onto mu=0/sigma=1, and the prior head's log-variance onto exactly 0. The
    # second half is what keeps the init KL at exactly zero under posterior_logvar_mode: independent,
    # and the whole coupling readout rests on that.
    head_init_calibration: true
    # LayerNorm gain on the attended source summary in the posterior fusion: sqrt(d_model/d_head)
    # = sqrt(128/32) = 2, so the 32-wide source summary is not out-columned by the 128-wide state.
    a_head_gain: 2.0

    # Append dilated conv blocks to both encoders for a longer receptive field.
    encoder_extra_dilations: [8, 16]
    # Kernel width of every appended block. 15 is the widest conv in the stack and dominates the
    # encoder parameter count.
    encoder_extra_kernel: 15
    # Group count for every encoder conv pre-norm. null = each block's min(8, d_model). The null is
    # dropped by _build_model_kwargs' None-filter and never reaches the constructor.
    conv_norm_groups: null

  core_model_checkpoint: null


dataset_config:
  # REPOINT THESE at the built CAUSAL shards. The paths are deliberately non-existent rather than
  # pointing at two-sided data, so a run fails on a missing file instead of on a `transform`
  # refusal someone might "fix" by dropping the budget.
  #
  # A two-sided shard here is refused by name before any run directory exists, and that refusal is
  # the load-bearing one: the two variants share every field name and every dtype, and only the
  # root `transform` attribute and the channel counts tell them apart. A run against two-sided data
  # with this config's c_y would fail the width check -- but a rebuilt two-sided dataset at 102
  # channels would not, and it would train to completion on coefficients containing their own
  # future while every number below reported a causal model.
  vae_train_datasets:
    - /data1/fetal-heart-tracing/HDF5_Datasets/REPOINT_ME_causal_int/pre_training_dataset/train_dataset_cs.hdf5
    - /data1/fetal-heart-tracing/HDF5_Datasets/REPOINT_ME_causal_int/pre_training_dataset/train_dataset_no_cs.hdf5
  vae_test_datasets:
    - /data1/fetal-heart-tracing/HDF5_Datasets/REPOINT_ME_causal_int/pre_training_dataset/test_dataset_cs.hdf5
    - /data1/fetal-heart-tracing/HDF5_Datasets/REPOINT_ME_causal_int/pre_training_dataset/test_dataset_no_cs.hdf5

  # Note the key is `stat_path` while the loader parameter is `stats_path`. A typo'd `stats_path:`
  # here yields None and silently disables normalization, so the entry point guards it explicitly.
  # It must be generated from the SAME causal shards: the statistics exclude the warm-up region, and
  # a two-sided stats file would both mis-normalise the target and destroy the source-null control's
  # premise that zero is the channel mean over the region the model reads.
  stat_path: /data1/fetal-heart-tracing/HDF5_Datasets/REPOINT_ME_causal_int/stats.hdf5

  dataloader_config:
    # 8 per rank: the prod box has 128 cores against 7 ranks (56 persistent workers), so the
    # extra workers still leave headroom; revisit against the profiler's dataloader-next timing.
    num_workers: 8
    prefetch_factor: 4
    # 'fhr_st' and 'fhr_ph' here are REQUIRED: they are this model's target, and it must arrive
    # z-scored or the Gaussian NLL is meaningless with the loader raising nothing on its own. The
    # entry point guards both, field by field, from LagAttnCfsTrainer.TARGET_FIELDS.
    normalize_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'up_st', 'up_ph']
    dataset_kwargs:
      pin_memory: false
      # The model consumes the four feature blocks and weight; fhr and up feed the diagnostic plots.
      #
      # 'guid' AND 'epoch' are LOAD-BEARING here rather than incidental, which is the one difference
      # from the two-sided cells' list. The anchor tiling's per-segment phase is a stable hash of the
      # recording identifier, the segment's own start time (`epoch` is domain_start in seconds), the
      # training epoch and the seed -- and `load_fields` is honoured literally with no forced
      # additions. Drop either and every segment is decoded at one tile grid forever, with A_max a
      # geometry constant either way so no shape, no count and no metric differs. The driver's
      # pre-flight refuses a config omitting them.
      #
      # The cross-channel FHRxUP phase-harmonic block is absent twice over: it would destroy the
      # target-only / source-conditioned separation, and the causal variant does not store it.
      load_fields:
        [
          'fhr',
          'up',
          'fhr_st',
          'fhr_ph',
          'up_ph',
          'up_st',
          'weight',
          'guid',
          'epoch',
        ]
      allowed_guids: null
      cs_label: null
      bg_label: null
      epoch_min: -48000
      epoch_max: null
      label: null
      # 0: the FIFO cache stores fully processed samples, and under the DistributedSampler's
      # per-epoch reshuffle a worker almost never re-sees a cached index.
      cache_size: 0
      # Must match the stats file's trim_minutes or normalization is wrong; a mismatch only warns.
      #
      # It does one MORE thing here than in the two-sided cells: the stored warm-up vectors are
      # rebased by exactly this trim, so it decides where every channel's validity boundary lands.
      # A uniformly wrong rebase moves the anchor floor and the boundary TOGETHER, so every
      # warm-fraction readout still reports 1.0 -- which is why the resolver cross-checks this value
      # against `sequence_length` and refuses a mismatch naming both config paths.
      trim_minutes: 1.0


# Advanced configs ========================================================

advanced_config:
  trainer:
    precision: "32-true"
    # 4000 SINCE 2026-09-05, SCALED RATHER THAN RE-MEASURED. The clip is a statistic of the summed
    # block's gradient, and the block moved from the measured 30 x 98 = 2940 coefficients to
    # 10 x 76 = 760 (the horizon 30 -> 10 and the integer operator's 76 survivors). Scaling the
    # measured quantiles below by 760 / 2940 = 0.259 gives q99 ~ 3670 and max ~ 4260, and the same
    # rounding rule -- the smallest round thousand above q99 that is still below the maximum --
    # lands on 4000. Not measured: the anchor count per step also rose (~31 tiles against ~4.6),
    # which makes the per-step gradient LESS noisy than a pure block scaling predicts, so 4000 is
    # if anything loose, which is the safe direction for a guard that must not bind on a healthy
    # run. It still differs from the conv-Transformer cell's 3500, scaled from that cell's own
    # measurement by the same rule. Re-derive from the headline run's own `train/grad_norm` column
    # once it exists. The paragraphs below are the H = 30 measurement this value was scaled from,
    # kept as the record.
    #
    # MEASURED at this loss scale, and it MOVED: 6000 against the two-sided sibling's 5000.
    #
    # The run: 600 optimizer steps at this file's model geometry over the committed causal fixture
    # (teb_vae/lag_attn/tests/fixtures/tiny_shard_causal.hdf5, 4 windows, one CUDA device,
    # likelihood: gaussian_nll, beta ramping to 1.0, AdamW at this file's lr), with the clip itself
    # set far above anything reachable so nothing was rescaling the steps the norms were drawn from.
    # Recorded pre-clip gradient norms with the whole shard in one batch -- the closest reachable
    # analogue of a large-batch step: min 1712, q50 9927, q90 12027, q95 12774, q99 14181,
    # max 16482.
    #
    # 15000 is the smallest round value above q99, which is the family's own rule. It sits just
    # below the observed maximum, so on a healthy run of this objective the clip essentially does
    # not bind -- correct for a blow-up guard. Rounded to 1000 rather than to 500 because the next
    # thousand is still under the maximum, which is the condition the sibling's 6500 could not meet
    # at its own scale.
    #
    # RE-MEASURED AT H = 30, and it moved from 6000: q99 went 5742 -> 14181, a factor of 2.47 for a
    # block that doubled. Two effects compound. The block itself is now 2940 coefficients rather
    # than 1470, which scales the summed loss and therefore its gradient; and the anchor count fell
    # from ~10.1 tiles per step to ~4.53, so that larger block is averaged over fewer than half as
    # many anchors and the per-step gradient is noisier again. Against the two-sided comparison
    # model's ~240 dense anchors the second effect is the dominant one, which is why this key
    # diverges from that model at either horizon.
    #
    # What the sample is and is not: 4 in-sample windows over 600 steps is a thinner tail than a
    # production run's, and the same measurement at batch 1 -- four distinct batches, so the
    # batch-to-batch component is present at its largest -- reads q99 45,225 and max 88,991. That
    # regime is 32x smaller than the shipped batch of 128 and is recorded rather than used. Re-derive
    # from the headline run's own `train/grad_norm` column, which samples one optimizer step per
    # epoch.
    gradient_clip_val: 4000.0

    gradient_clip_algorithm: "norm"
    sync_batchnorm: false     # there is no BatchNorm anywhere in this model
    deterministic: false
    benchmark: true
    # REQUIRED false, permanently: the nn.LSTM encoders, the checkpointed attention region and
    # the data-dependent boolean mask indexing behind kld_active_frac each break TorchInductor
    # independently.
    compile: false
    # Cadence of the per-STEP logger flush: each flush is a synchronous MLflow log_batch HTTP call
    # from rank 0 carrying every on_step metric. Matches the gradient-norm hook's sampling stride.
    log_every_n_steps: 25
    # REQUIRED 0: MetricsLoggingCallback has no sanity guard, so a sanity pass would shift every
    # epoch number against MLflow and the checkpoint filenames.
    num_sanity_val_steps: 0
    # Keep true: the data module builds plain loaders on purpose and relies on Lightning to
    # inject the DistributedSampler and call set_epoch each epoch.
    use_distributed_sampler: true
    profiler: simple

  logging:
    console_level: INFO
    file_level: INFO
    json_log: true
    console_diagnose: false
    rotation: "100 MB"
    retention: "14 days"

  # Loss-spike circuit breaker: NON-FINITE GUARD plus a sign-agnostic ADDITIVE spike test.
  # The RELATIVE test stays off.
  #
  # The relative test is `watched > multiplier * max(EMA, ema_floor)`, which assumes a loss bounded
  # below by zero. main_loss here is a learned-variance Gaussian NLL summed over 760 coefficients
  # and averaged over ~31 anchors, so it goes negative early -- the instrumented run below, at the
  # 2940-coefficient block, reached -7556 within 600 steps. Once the EMA is negative the relative test degenerates to "skip every
  # positive batch". So ema_floor sits far above any reachable loss, which switches the relative
  # test off, and additive_margin carries the finite-blow-up detection: skip when
  # watched > EMA + margin, against the RAW EMA, so it works in the negative-loss regime.
  #
  # The margin is in nats of the summed block and does not transfer across block sizes OR across
  # anchor counts, and this cell changes both.
  spike_breaker:
    enabled: true
    multiplier: 5.0
    ema_decay: 0.02        # EMA smoothing (smaller = longer memory); reported, not acted on
    warmup_batches: 100    # priming window before gating activates
    comparison_metric: main_loss
    # >> any reachable loss: relative detection off. The per-coefficient Gaussian NLL is bounded
    # below by 0.5*(log 2pi + logvar_clamp_lo) ~ -1.58 at the shipped floor of -5, so the two
    # reconstruction terms cannot reach beyond ~2 * 760 * 1.58 ~ 2.4e+3 in magnitude at the
    # shipped 10 x 76 block, and the KL and the prior anchor are both nonnegative. The instrumented
    # run at the 2940-coefficient block (bound ~9.3e+3) observed main_loss inside [-7556, +8487],
    # within a factor of 1.1 of its bound, which confirms the bound's form empirically. Five orders
    # of magnitude of headroom either way, so the two-sided sibling's value is still the re-derived one.
    #
    # The exponent sign is not decoration -- YAML parses `1.0e9` as a string, which validate_config
    # rejects as not a float.
    ema_floor: 1.0e+9
    # Sign-agnostic finite-spike detection: skip when watched > EMA + margin (nats). 0 disables.
    #
    # 2.2e+3 SINCE 2026-09-05, SCALED RATHER THAN RE-MEASURED, and the scaling is what keeps the
    # test LIVE. The margin is in nats of the summed block, and the block moved from the measured
    # 30 x 98 = 2940 coefficients to 10 x 76 = 760. Two constraints fix it, exactly as they did
    # at H = 30: it must stay UNDER the ~2.4e+3 magnitude the objective can now reach (see
    # `ema_floor` above), or no finite loss could exceed EMA + margin and the additive test would
    # be decoration -- which is what the previous 9.0e+3 had silently become at the promoted
    # 2280-coefficient block, whose bound is ~7.2e+3 -- and it must clear the worst excursion the
    # fixture produced. Scaling both measured excursions below by 760 / 2940 gives ~1320 for this
    # cell and ~1020 for the conv-Transformer cell; 2.2e+3 is 1.7x the larger of the two, the same
    # factor the H = 30 value carried, and sits under the bound. HELD EQUAL to the conv-Transformer
    # cell's, as before and for the reason stated at the end of this block. The sign against the
    # two-sided sibling's 5.0e+3 reversed again with the block (760 against 2340), exactly as the
    # paragraph below says it must. Re-derive from a production run's own `main_loss` column if the
    # breaker starts skipping healthy batches. The paragraphs below are the H = 30 measurement this
    # value was scaled from, kept as the record.
    #
    # RE-MEASURED AT H = 30, and it moved from 3.0e+3 -- and the move REVERSED SIGN against the
    # two-sided sibling. At the one-minute horizon this block was 1470 coefficients against that
    # model's 2340 and the margin shrank to 0.63x its value; at H = 30 the block is 2940 against
    # 2340, so it grows to 2.0x instead. The margin follows the BLOCK, and the direction of this
    # comparison is a readout of which side has the larger one.
    #
    # The statistic is the breaker's own -- `main_loss - EMA` at this file's `ema_decay`, which is
    # exactly what the test compares -- rather than the epoch-to-epoch movement, because at ~4.6
    # decoded anchors per step the two are not close. Over the same 600-step instrumented run: with
    # the whole shard in one batch the excursion above the EMA never reached zero at all (q99 -279,
    # max -266), because the loss falls monotonically on four in-sample windows; at batch 1, where
    # the batch-to-batch component is present at its largest, q50 -602, q90 641, q95 1024,
    # q99 2383, max 5090 after the breaker's own 100-batch priming window.
    #
    # 9.0e+3 is 1.77x the worst excursion measured in the noisiest regime the fixture can produce,
    # and it is set by the OTHER constraint rather than by that ratio. The family's rule of thumb is
    # ~2x, which would give 1.0e+4 -- but the margin must also stay under the ~9.3e+3 magnitude the
    # objective can reach, or no finite loss could ever exceed EMA + margin and the additive test
    # would be decoration. The two requirements now nearly meet: 9.0e+3 is the round value that
    # satisfies both, clearing the excursion by 77% while staying inside the reachable range.
    #
    # THAT SQUEEZE IS NEW AT THIS HORIZON and is worth stating, because at H = 15 the two bounds
    # were far apart (a margin of 3.0e+3 was ~1.9x the excursion and 0.65x the reachable magnitude).
    # The batch-1 excursion grew 3.6x (1404 -> 5090) while the block only doubled, so the window
    # between "fires on healthy batches" and "can never fire" narrowed. If a production run reports
    # breaker skips on batches its own metrics say are healthy, this is the number to re-derive --
    # from that run's `main_loss` column, not from the fixture.
    #
    # HELD EQUAL TO THE CONV-TRANSFORMER CELL'S, deliberately, and the excursion it clears is the
    # LARGER of the two measured (this cell's 5090 against that cell's 3928). The encoder edge
    # changes neither the block nor the anchor count, so a margin that differed across it would gate
    # two architectures the two cfs cells exist to compare against two different bars.
    additive_margin: 2.2e+3

    # Escape hatch: after this many CONSECUTIVE skips, force-accept the next finite-loss batch
    # and hard-re-seed the EMA to it. 0 disables the hatch.
    max_consecutive_skips: 25

  tracking:
    mlflow:
      enabled: true
      tracking_uri: "http://localhost:5000"
      # IDENTITY, all three of these and the variant tag below: inheriting any of them mixes this
      # model's runs into the comparison model's experiment, which is unrecoverable afterwards
      # because the two are then indistinguishable by every field anything indexes on.
      experiment_name: seqvae-teb-lag-attn-cfs
      # THE ARM IS IN THE NAME, both here and in the variant tag below, and that is a second
      # guard rather than a label. A run whose config drifted between machines trains one arm
      # while its records name another, and no metric says so -- which is exactly how a
      # headline evaluation came to be read as the aligned arm having trained unaligned. The
      # alignment arm is the axis that failure ran along, so it is the axis the name carries: the
      # inputs are unaligned (every channel read at its own availability time), the phase blocks
      # are the integer operator's, and the forecast target is scored on the stored clock over
      # H = 10 steps at stride 5. Every sweep arm below renames both keys after its own delta.
      run_name: lag_attn_cfs_intphase_unaligned_stored
      artifact_location: null
      # Logs and registers the final eager model at fit end, via the run-logging callback the
      # trainer builder attaches automatically.
      log_model: true
      # Lightning's own per-checkpoint weight artifacts. Off: the ModelCheckpoint directory is
      # the single copy.
      log_checkpoints: false
      log_config_artifact: true
      tags:
        project: teb_vae
        stage: dev
        variant: lag_attn_cfs_intphase_unaligned_stored

  callbacks:
    # ON, and the patience is the number rather than the flag. A 5000-epoch budget against a run
    # whose composite optimum landed at epoch 336 of 709 spends most of its wall clock past the
    # point where the criterion stopped improving, and every epoch after it is a fresh chance for
    # the source pathway to drift while nothing is being learned. 50 VALIDATION epochs is wide
    # enough that the beta ramp's plateau and the milestone LR drops both pass inside it -- both
    # are stretches where `val/total_loss` legitimately stalls -- and narrow enough to end a run
    # that has stopped moving. `min_delta` is inherited: at a total loss of order 10^3 a 1e-4
    # threshold is effectively "any improvement at all", which is what patience is for.
    early_stopping:
      enabled: true
      monitor: "val/total_loss"
      patience: 50
      min_delta: 0.0001

    model_checkpoint:
      monitor: "val/total_loss"
      save_top_k: 3
      mode: "min"
      # A SECOND criterion, and it exists because the two optima are not the same epoch: on the
      # diagnosed H = 15 run the composite `val/total_loss` bottomed at epoch 336 and
      # `val/nll_full_block` -- the conditioned forecast alone, the quantity every forecast readout
      # is built on -- at epoch 278. Keeping only the first means the weights that forecast best are
      # not on disk and nothing recovers them once the epoch has passed, while the run's own metrics
      # record that they existed.
      #
      # One key rather than a second block: `save_top_k` and `mode` above serve both criteria, and a
      # duplicated surface would be two places for them to disagree. Absent by default, so the
      # two-sided cells build exactly the one callback they always have. The files are distinguished
      # by a stem derived from this monitor.
      secondary_monitor: "val/nll_full_block"

    # The per-epoch validation diagnostic figure. The trainer imports the plotter only when this is
    # on, so it costs nothing when off.
    #
    # THE BLOCK NAME IS THE RAW-SIGNAL MODEL'S ON PURPOSE. The callback assembly is inherited whole,
    # and it reads this literal; renaming the block to match this package would leave the figure
    # permanently off, with `enabled: true` still reading correct to anyone looking at the config
    # and nothing in the log saying why.
    #
    # There is deliberately NO plot_frequency here: the cadence is `general_config.plot_frequency`,
    # the same key that drives loss_plot_epoch.html, so the curves and the figure that explains them
    # always exist for the same epochs.
    lag_attn_rws_plotting:
      enabled: true
      num_examples: 2
      file_format: "pdf"

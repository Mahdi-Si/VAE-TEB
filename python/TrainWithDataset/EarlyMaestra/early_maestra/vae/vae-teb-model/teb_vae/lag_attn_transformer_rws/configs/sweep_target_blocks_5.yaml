# Depth arm: target_attention_blocks = 5 (shipped 4).
#
# The other side of the target-depth question. A deeper target prior should lower the base
# reconstruction D_0, which is the headline number the whole comparison against the
# dilated-conv-plus-LSTM encoder turns on -- and it will also lower the source-conditioned KL if
# the extra depth lets the prior predict what the source was carrying. That is a *better* model,
# not a worse one, which is why the selection rule is predictive gain rather than KL magnitude.
#
# The target keeps the full causal prefix in every arm; only the block count moves.
#
# +164,352 parameters, one attention block: 4*128^2 + 3*128*256 + 4*128.
#
# d_model stays 128 in every arm of this sweep, for the reasons in the shallower arm's header.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_transformer_rws.trainer \
#       --config teb_vae/lag_attn_transformer_rws/configs/sweep_target_blocks_5.yaml
base: default.yaml

model_config:
  VAE_model:
    target_attention_blocks: 5

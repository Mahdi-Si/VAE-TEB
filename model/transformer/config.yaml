# =============================================================================
# Causal Multimodal Forecasting Transformer — Training Configuration
# =============================================================================
# See model/transformer/model.md for the source-of-truth architecture.
# Run: python -m model.transformer.training.trainer --config model/transformer/config.yaml

general_config:
  tag: causal_transformer_pretraining
  cuda_devices: [0]
  lr: 1.0e-4
  weight_decay: 1.0e-4
  lr_milestone: []
  epochs: 300
  batch_size:
    train: 48
    test: 48
  accumulate_grad_batches: 3
  checkpoint_frequency: 10
  plot_frequency: 5
  folders_config:
    out_dir_base: ./output/transformer_pretraining


model_config:
  transformer:
    d_model: 192
    d_f: 43
    d_u: 43
    d_z_transfer: 16
    n_heads: 4
    dropout: 0.1

    stem_num_blocks: 3
    stem_kernels: [3, 5, 5]
    stem_dilations: [1, 2, 4]
    stem_expansion: 2

    fhr_encoder_layers: 4
    up_encoder_layers: 4
    fused_encoder_layers: 4
    fusion_layers: 1
    ff_expansion: 4

    seq_len: 300
    ctx_len: 30
    guard_gap: 4
    horizons: [8, 15, 30]
    horizon_weights: [1.0, 1.5, 2.0]
    num_anchors: 4
    anchor_uniform_ratio: 0.5

    lambda_fus: 1.0
    lambda_delta: 0.5
    lambda_self: 0.25
    lambda_te: 0.25
    huber_delta: 1.0

    gradient_checkpointing: false
    checkpoint_path: null


training_schedule:
  stage1_epochs: 60
  stage2_epochs: 60
  stage3_epochs: 180
  beta_max: 1.0e-4
  warmup_steps: 5000


dataset_config:
  train_datasets: []
  val_datasets: []
  stat_path: null

  dataloader_config:
    num_workers: 4
    prefetch_factor: 2
    normalize_fields:
      - fhr_st
      - up_st
    dataset_kwargs:
      load_fields:
        - fhr_st
        - up_st
        - fhr
        - up
      trim_minutes: 1.0
      cache_size: 5000
      pin_memory: false


advanced_config:
  trainer:
    precision: "16-mixed"
    gradient_clip_val: 1.0
    gradient_clip_algorithm: "norm"
    sync_batchnorm: true
    deterministic: false
    benchmark: true

  tracking:
    mlflow:
      enabled: true
      tracking_uri: "http://localhost:5000"
      experiment_name: causal_transformer_pretraining
      run_name: null
      tags:
        project: VAE-TEB
        model: causal_transformer
        stage: pretraining
      log_model: false
      log_config_artifact: true

  callbacks:
    early_stopping:
      enabled: true
      monitor: "val/L_fus"
      patience: 50
      mode: "min"
    model_checkpoint:
      monitor: "val/L_fus"
      save_top_k: 3
      mode: "min"

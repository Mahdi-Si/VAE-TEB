# Architecture A/B arm: horizon_depth = 4 (was 3).
#
# One more dilated refine block in the shared horizon core: dilations (1, 2, 4, 8) instead of
# (1, 2, 4), so the horizon receptive field doubles. The decoder is only ~7% of the model, so this
# is cheap: +82,560 parameters over the new baseline (3,371,725 -> 3,454,285), which includes the
# fourth per-block zero-init FiLM generator (the extra block reads the latent like the others).
# Speculative rather than evidence-backed, hence a sweep arm and not a default. Everything else is
# inherited from default.yaml.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_rws.trainer --config teb_vae/lag_attn_rws/configs/sweep_horizon_depth_4.yaml
base: default.yaml

model_config:
  VAE_model:
    horizon_depth: 4

# The unanchored control for the local prior-anchor validation.
#
# Two deltas against smoke_hie.yaml, and they are one decision: start without the prior-scale
# protections. `beta_prior: 0.0` removes the scale anchor from the objective, and
# `head_init_calibration: false` reverts the prior head to the uncalibrated start -- three nats
# below the anchor's optimum. Anchoring the objective while starting the head at the optimum
# would measure the two together and attribute the result to whichever is named first.
#
# The key governs the DECODER output-head calibration as well (see sweep_init_off.yaml), so this
# arm also starts its decoder off the trivial unit-variance predictor. No setting of this one key
# gives a decoder-calibrated, prior-uncalibrated start. `false` is right on the prior half, which
# is the half under test, and differs on the decoder half, so answer the base-forecast question
# against a calibrated beta_prior: 0.0 control instead.
#
# It inherits default.yaml through smoke_hie.yaml, so it carries base_decode: mean,
# posterior_logvar_mode: independent and causal_reach_budget_s: 120. The anchor comparison
# against smoke_hie.yaml is clean, because both arms inherit all three equally. Two
# consequences: `head_init_calibration: false` also costs the exact-zero-KL start, because
# 'independent' recovers it only through that key; and 'mean' and 'independent' exist to prevent
# the prior collapse, so a run that does not collapse is the fix working rather than the control
# failing. To start from the configuration without those fixes, pin `base_decode: sample`,
# `posterior_logvar_mode: residual` and `causal_reach_budget_s: null` in the block below.
#
#   python -m teb_vae.lag_attn_rws.trainer --config teb_vae/lag_attn_rws/configs/smoke_hie_control.yaml
base: smoke_hie.yaml

general_config:
  tag: lag_attn_rws_hie_smoke_control
  folders_config: {out_dir_base: output/lag_attn_rws_hie_smoke_control}

model_config:
  VAE_model:
    beta_prior: 0.0
    head_init_calibration: false

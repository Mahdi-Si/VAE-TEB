# Calibration arm: latent width d_z = 64.
#
# Restates the shipped value on purpose: the arm stays pinned at 64 even if default.yaml is later
# revised, so the comparison that chose the width stays runnable. While default.yaml still carries
# this width the arm resolves to an empty delta and the baseline run stands in for it.
#
# The pin moved here from sweep_dz_48.yaml when the capacity revision raised the shipped latent
# from 48 to 64; 48 is now a genuine arm, and it is the one that asks whether the raise was needed.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_rws.trainer --config teb_vae/lag_attn_rws/configs/sweep_dz_64.yaml
base: default.yaml

model_config:
  VAE_model:
    d_z: 64    # divisible by num_heads (4), required by the head-structured posterior

general_config:
  tag: latent_test
  cuda_devices: [7]
  train_classifier: False
  lr: 0.000001
  lr_milestone: [100, 200]
  weight_decay: 0.3
  checkpoint_frequency: 1
  plot_frequency: 1
  epochs: 1000000
  accumulate_grad_batches: 1
  batch_size:
    train: 1600
    test: 1600

model_config:
  VAE_model:
    Y_module_only: False
    raw_input_size: 4800
    input_size: 300
    channel_num: 2
    input_dim: 76
    RNN_hidden_dim: 128
    latent_size: 16
    num_RNN_layers: 5
    kld_beta: 0.006
    freeze_seqvae: False
    zero_source: True

  seqvae_checkpoint: /data/deid/isilon/MS_model/seq_vae_teb_results/pre_training/2025-09-01--[13-43]--seqvae_teb_experiment_latent_16_B1e-3_from_checkpoint__fixed/model_checkpoints/base-model-best-epoch=357.ckpt  # Optional legacy SeqVaeTeb checkpoint (no latent forecaster)
  base_model_checkpoint: /data/deid/isilon/MS_model/seq_vae_teb_results/pre_training/2025-09-01--[13-43]--seqvae_teb_experiment_latent_16_B1e-3_from_checkpoint__fixed/model_checkpoints/base-model-best-epoch=357.ckpt  # Optional legacy SeqVaeTeb checkpoint (no latent forecaster)
  classification_checkpoint: null

inv_scattering_model:
  do_inv_st: False
  inv_st_checkpoint: null
  train_inv_st: False

folders_config:
  out_dir_base: /data/deid/isilon/MS_model/seq_vae_teb_results/pre_training

dataset_config:
    vae_train_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/pre_training_dataset/test_dataset_no_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/complete_segments/pre_training_dataset/acidosis_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/pre_training_dataset/train_dataset_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/pre_training_dataset/train_dataset_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/pre_training_dataset/train_dataset_no_cs.hdf5
    vae_test_datasets:
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/pre_training_dataset/test_dataset_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/pre_training_dataset/test_dataset_no_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/k_fold_cross_validation_dataset/fold_1/train/acidosis_cs.hdf5
#      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/k_fold_cross_validation_dataset/fold_1/train/hie_cs.hdfs5
      - /data1/fetal-heart-tracing/HDF5_Datasets/complete_segments/pre_training_dataset/acidosis_cs.hdf5
    stat_path: /data/deid/isilon/MS_model/Q4_stats/stats.hdf5
    dataloader_config:
      num_workers: 64
      normalize_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph']
      # These are for CombinedHDF5Dataset
      dataset_kwargs:
        load_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph', 'epoch', 'guid', 'target', 'cs_label', 'bg_label']
        allowed_guids: null
        cs_label: null
        bg_label: null
        epoch_min: null
        epoch_max: null
        label: null
        cache_size: 5000
        trim_minutes: 2.0  # how much to trim from start and end of the signal

seqvae_testing:
  test_data_dir:
  test_data_selected_dir:
  HIE_test_data_dir:
  test_checkpoint_path: /data/deid/isilon/MS_model/seq_vae_teb_results/pre_training/2025-09-01--[13-43]--seqvae_teb_experiment_latent_16_B1e-3_from_checkpoint__fixed/model_checkpoints/base-model-best-epoch=357.ckpt  # Optional legacy SeqVaeTeb checkpoint (no latent forecaster)
latent_analysis:
  device: null
  which: mu_post
  keep_te: true
  keep_uncertainty: true
  latent_dim: 16
  class_names: []
  file_labels: {}
  keys:
    y_st: fhr_st
    y_ph: fhr_ph
    x_ph: fhr_up_ph
    signal_id: guid
    epoch_idx: epoch
    label: target
    t0: null
    source_file: source_file
  sampling:
    target_guids: null
    exclude_guids: null
    max_batches: null
    max_sequences: null
    max_epochs_per_signal: null
    stride: 1
  storage:
    save_parquet: true
    save_csv: false
    compression: snappy
  reducers:
    pca:
      enabled: true
      n_components: 3
      standardize: false
      incremental: false
      batch_size: 8192
    umap:
      enabled: false
      n_components: 2
      n_neighbors: 30
      min_dist: 0.1
      metric: euclidean
      random_state: 0
    tsne:
      enabled: false
      n_components: 2
      perplexity: 40
      n_iter: 1500
      learning_rate: auto
      sample_size: 20000
      random_state: 0
  plotting:
    enabled: true
    signals: null
    max_signals: 12
    max_epochs_per_signal: 4
    epoch_examples: 16
    prefer_embeddings: [pca, umap]
    color_by: te
    vector_field:
      enabled: true
      grid_size: 30
      neighbors: 20
      embedding: pca
    guid_trajectory:
      enabled: true
      embedding: pca
      color_by: t_abs_s
      show_epoch_boundaries: true
      time_series:
        enabled: true
        include_dims: [pc1, pc2]
        include_speed: true
        include_te: true
    kmeans_states:
      enabled: true
      k: 6
      sample_size: 100000
    hmm_states:
      enabled: false
      n_states: 6
      covariance_type: diag
      sample_size: 60000
    uncertainty_path: true
    dynamics_curves: true
    recurrence: true
  metrics:
    enabled: true
    max_samples: 50000
    compute_pairwise: true
  prototypes:
    enabled: false
    max_epochs_per_class: 30
    n_clusters: null
  change_point:
    enabled: false
    feature: speed

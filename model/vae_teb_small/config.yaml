# Advanced configs ========================================================
# precision: set to "16-mixed" for faster training on modern GPUs with enough VRAM; fall back to "32-true" if you see numerical issues or your GPU lacks Tensor Cores.
# gradient_clip_val and gradient_clip_algorithm: clip when you’re stacking long sequences or large batch sizes and gradients spike; start with 0.5 + "norm" and relax only if training stays stable without it.
# sync_batchnorm: enable (true) only when you train across multiple GPUs so BatchNorm stats stay consistent; leave false for single-GPU runs to avoid the extra synchronization cost.
# deterministic / benchmark: set deterministic=true when you need reproducibility (at the cost of speed); keep benchmark=true when input sizes are consistent to let cuDNN autotune, but disable it for highly variable sequence lengths.
# memory.enable_memory_monitoring / memory_threshold_gb / memory_log_frequency: turn these on when debugging OOMs; set the threshold just under your GPU’s usable memory (e.g., 60 GB on A100-80) and log frequently enough (every ~500 steps) to catch leaks without overwhelming stdout.

advanced_config:
  trainer:
    precision: "32-true"
    gradient_clip_val: 0.5
    gradient_clip_algorithm: "norm"
    sync_batchnorm: true
    deterministic: false
    benchmark: true

  memory:
    enable_memory_monitoring: false    # Set to true if OOM errors occur
    memory_threshold_gb: 60.0
    memory_log_frequency: 500

  tracking:
    mlflow:
      enabled: true
      tracking_uri: "http://localhost:5000"
      experiment_name: seqvae-teb
      run_name: null
      artifact_location: null
      log_model: true
      log_config_artifact: true
      tags:
        project: teb_vae
        stage: dev

  callbacks:
    early_stopping:
      enabled: false
      monitor: "val/total_loss"
      patience: 30
      min_delta: 0.0001

    model_checkpoint:
      monitor: "val/total_loss"
      save_top_k: 3
      mode: "min"

    loss_plotting:
      max_history_size: 1000

    reconstruction_plotting:
      enabled: false
      plot_frequency: 10
      num_examples: 3

    comprehensive_plotting:
      enabled: true
      plot_frequency: 10


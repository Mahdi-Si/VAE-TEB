tag: seqvae_teb_classifier
out_dir_base: /data/deid/isilon/MS_model/seq_vae_teb_results/classification
folds_root: /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_Q4/k_fold_cross_validation_dataset

classifier_config:
  num_classes: 2               # Binary classification: HEALTHY vs ACIDOSIS+HIE
  filters: 32
  depth: 6
  dropout: 0.2
  use_attention: False
  freeze_vae: true
  pretrained_vae_ckpt: /path/to/vae_best.ckpt  # Lightning or pure state dict
  vae_loss_weight: 0.0        # >0.0 to include aux VAE loss
  class_weights: null         # e.g., [1.0, 2.0] for binary imbalance
  compile_vae: false

training_config:
  lr: 1.0e-3
  lr_milestones: [50, 100]
  epochs: 3
  precision: 16-mixed
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  accumulate_grad_batches: 1
  class_names: [HEALTHY, UNHEALTHY]  # Binary: HEALTHY vs ACIDOSIS+HIE
  # Compilation options
  compile_classifier: false
  compile_mode: max-autotune-no-cudagraphs
  resume_ckpt: null

data_config:
  stats_path: /data/deid/isilon/MS_model/Q4_stats/stats.hdf5
  normalize_fields: [fhr, up, fhr_st, fhr_ph, fhr_up_ph]
  num_workers: 4
  batch_size:
    train: 64
    val: 128
    test: 128
  dataset_kwargs:
    load_fields: [fhr, up, fhr_st, fhr_ph, fhr_up_ph, target, weight, guid]
    cache_size: 2000
    trim_minutes: 2.0

# Callbacks
early_stopping:
  enabled: true
  patience: 40
  min_delta: 0.0

checkpoint:
  monitor: val/cls_loss
  mode: min
  save_top_k: 1

parallel:
  folds: null              # e.g., [1,2,3] or [fold_1, fold_3]
  max_parallel: 2          # Max concurrent folds
  devices_pool:  [0, 1, 2, 3, 4, 5, 6, 7]  # Available GPUs for scheduling
  gpus_per_run: 1          # GPUs per fold run; set >1 for DDP per fold
  fold_devices_map: {}     # Optional explicit mapping: {fold_1: [0], fold_2: [1,2]}

# ============================================================================
#  Transformer Classification Pipeline — Configuration
# ============================================================================
#
#  Single source of truth for the time-aware GRU classifier that operates
#  on segment-level embeddings from a pretrained CausalMultimodalTransformer.
#
#  See classification_model.md for the full architecture specification.
# ============================================================================

general_config:
  tag: "transformer_cls_v1"
  cuda_devices: [0, 1, 2, 3, 4]
  max_parallel_folds: 5
  plot_frequency: 10
  lr: 0.001
  lr_milestone: [100]
  epochs: 500
  accumulate_grad_batches: 1
  batch_size:
    train: 8
    test: 8
  folders_config:
    out_dir_base: ./classification_results


# ============================================================================
#  Model Configuration
# ============================================================================
model_config:

  # --- Pretrained transformer -----------------------------------------------
  transformer_checkpoint: /path/to/transformer.ckpt
  transformer_chunk_size: 16        # Segments per transformer forward chunk

  # --- Transformer freeze/unfreeze strategy ---------------------------------
  #
  # Three modes:
  #   "frozen":    transformer fully frozen for all epochs (default, fastest)
  #   "trainable": transformer unfrozen from epoch 0 (full fine-tuning)
  #   "phased":    frozen for first `unfreeze_after_epoch` epochs, then unfrozen
  #
  # When unfrozen, the transformer uses a separate (lower) learning rate
  # (`transformer_lr`) while the classifier head uses `general_config.lr`.
  freeze_strategy:
    mode: "frozen"
    unfreeze_after_epoch: 50
    transformer_lr: 1.0e-5

  # --- Segment embedding (416-dim) ------------------------------------------
  #
  # Composition: [s_F(192) | s_FU(192) | mean_TE(16) | std_TE(16)]
  #   - s_F, s_FU: pooled from full 300-step H_F, H_FU (anchor-independent)
  #   - mean_TE, std_TE: TE posterior statistics across dense anchor grid
  #
  # anchor_step: TE anchor grid spacing.
  #   5  = ~47 anchors (dense, recommended — better TE statistics)
  #   15 = ~16 anchors (sparse, matches model inference default)
  #
  # pooling: how to pool H_F and H_FU over the 300-step sequence
  #   "mean"      = mean pooling (deterministic, recommended for precompute)
  #   "attention"  = trainable AttentionPool (on-the-fly only, not precompute)
  segment_embedding:
    d_embedding: 416
    anchor_step: 5
    pooling: "mean"

  # --- Time feature encoding ------------------------------------------------
  #
  # Raw 6-dim feature: [tau, log(1+tau), delta_tau, log(1+delta_tau), delta, m]
  #   tau       = time from labour onset (minutes)
  #   delta_tau = inter-segment gap (minutes)
  #   delta     = gap deviation from nominal (minutes)
  #   m         = gap missingness indicator (1 if gap > threshold)
  #
  # Passed through MLP(6 -> embed_dim -> embed_dim) to produce time embedding.
  time_features:
    raw_dim: 6
    embed_dim: 32
    nominal_gap_minutes: 20.0
    gap_threshold_minutes: 22.0

  # --- Time-aware GRU classifier core ---------------------------------------
  classifier:
    input_proj_dim: 256             # Projection from 864 -> 256
    gru_hidden_dim: 256             # GRU hidden state dimension
    dropout: 0.1                    # Dropout in input projection

  # --- Loss and class imbalance ---------------------------------------------
  #
  # loss.type:
  #   "bce" = BCEWithLogitsLoss (Linear -> 1 logit -> sigmoid)
  #   "ce"  = CrossEntropyLoss  (Linear -> 2 logits -> softmax)
  #
  # class_balance:
  #   enabled: true/false — toggle weighting entirely
  #   method:
  #     "auto"   = auto-compute from training label distribution
  #     "manual" = use manual_pos_weight (bce) or manual_class_weights (ce)
  #
  # label_smoothing: 0.0 = disabled. Mild values (e.g. 0.05) can help.
  loss:
    type: "bce"
    class_balance:
      enabled: true
      method: "auto"
      manual_pos_weight: 1.0
      manual_class_weights:
        - 1.0
        - 1.0
    label_smoothing: 0.0

  # --- Precomputed embeddings -----------------------------------------------
  #
  # When true, skip the transformer forward pass and load cached 416-dim
  # embeddings from HDF5 files produced by precompute_embeddings.py.
  # Requires running precompute_embeddings.py first.
  precompute_embeddings: false
  precomputed_dir: null             # Directory containing precomputed HDF5s

  # --- Evaluation pipeline --------------------------------------------------
  #
  # Post-training evaluation settings.  Used by
  # evaluate_transformer_classifier.py and by the k-fold trainer when
  # run_after_training is true.
  evaluation:
    target_fpr: 0.2                 # Target FPR for threshold optimisation
    exclude_last_minutes: 30.0      # Exclude bins within N minutes of birth
    decision_time_hours: 1.0        # Decision time (hours before delivery)
    max_gap_multiplier: null        # Max gap for epoch filling (null = fill all)
    run_after_training: true        # Run evaluation after each fold's training


# ============================================================================
#  Dataset Configuration
# ============================================================================
dataset_config:
  kfold_base_path: /path/to/k_fold_dataset
  test_mode: null                   # null | "holdout" | "augmented"
  num_folds: 10
  fold_ids: null                    # null = all folds, or [1, 2, 3] subset
  stat_path: /path/to/stats.hdf5

  dataloader_config:
    num_workers: 4
    prefetch_factor: 4
    normalize_fields:
      - fhr_st
      - up_st
    segment_duration: 1200.0        # Grid slot duration (seconds)
    guid_cache_size: 128
    pin_memory: false
    dataset_kwargs:
      load_fields:
        - fhr_st
        - up_st
        - target
        - weight
        - epoch
        - cs_label
        - bg_label
        - guid
        - time_from_labor_onset
      epoch_min: -23000
      trim_minutes: 1.0

  bucket_sampler:
    enabled: true
    bucket_ranges:
      - [1, 5]
      - [6, 12]
      - [13, 20]
      - [21, 40]
    shuffle: true


# ============================================================================
#  Advanced Configuration
# ============================================================================
advanced_config:
  trainer:
    precision: "32-true"
    gradient_clip_val: 0.5
    gradient_clip_algorithm: "norm"
    deterministic: false
    benchmark: true

  callbacks:
    early_stopping:
      enabled: true
      patience: 30
      monitor: "val/loss"
    model_checkpoint:
      save_top_k: 3
      monitor: "val/loss"

  tracking:
    mlflow:
      enabled: true
      tracking_uri: "http://localhost:5000"
      experiment_name: "transformer-classifier-kfold"
      run_name: null
      artifact_location: null
      log_model: false
      log_config_artifact: true
      tags:
        project: "teb_transformer_classifier"
        stage: "dev"

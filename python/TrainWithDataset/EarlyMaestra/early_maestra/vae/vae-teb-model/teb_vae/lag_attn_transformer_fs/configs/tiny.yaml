# Local smoke variant: one epoch, one device, the committed 4-sample shard.
#
# Everything not named here is inherited from default.yaml -- including the settings that are
# correctness requirements rather than preferences (compile: false, precision, the spike breaker's
# ema_floor, num_sanity_val_steps: 0), which is the point: a variant that re-stated them could
# drift from them.
#
# The geometry stays real. sequence_length, the channel counts, the conv stem, the source window,
# causal_reach_budget_s and trim_minutes all match the shipped config, because the committed shard
# carries the real field shapes -- and the decoder's width IS the resolved budget's
# surviving-channel count, so a smoke run at a shrunken budget would exercise a decoder the
# production run does not have. Only the model's widths and depths shrink so a CPU forward is fast.
#
# TWO INDEPENDENT CONSTRAINTS govern the shrink, and they are easy to conflate because in the
# shipped config both head counts happen to be 4:
#
#   num_heads * d_head == d_model, for the LAG-attention heads (4 * 8 == 32), which the constructor
#   validates, and d_z % num_heads == 0, which the head-structured posterior requires;
#
#   d_model / encoder_num_heads must be EVEN (32 / 4 == 8), because rotary position encoding
#   rotates coordinate pairs. `encoder_num_heads` is documented as unrelated to `num_heads` and
#   nothing may couple them, so a variant that shrank d_head while treating the two as one
#   constraint raises at construction.
#
# Three deliberate deltas, none a simplification:
#
#   likelihood: mse is the configuration that starves the decoder log-variance heads, so the smoke
#   path and the DDP-strategy fallback it implies get exercised where they are cheap to observe.
#
#   lr_warmup_steps: 4 is short enough that the step ramp COMPLETES inside a smoke fit (two
#   optimizer steps per epoch against the four-sample shard), which is what makes the step-granular
#   scheduler path exercised by a real run rather than only by a unit test.
#
#   The two attention block counts drop to 2 apiece. The source encoder's receptive-field bound
#   stays strictly inside the sequence at that depth (21 + 2*(16-1) = 51 steps of 300), so the
#   bounded-source / full-prefix-target asymmetry that IS the architecture is still exercised.
#
#   python -m teb_vae.lag_attn_transformer_fs.trainer \
#       --config teb_vae/lag_attn_transformer_fs/configs/tiny.yaml
base: default.yaml

general_config:
  tag: lag_attn_trf_fs_tiny
  cuda_devices: [0]
  epochs: 1
  # Pinned to 1: the base config plots every 5th epoch for multi-day runs, but a tiny smoke has 1-3
  # epochs and its train-smoke tests count one figure set per epoch.
  plot_frequency: 1
  lr_warmup_steps: 4
  batch_size: {train: 2, test: 2}
  folders_config: {out_dir_base: output/teb_vae_trf_fs_tiny}

model_config:
  VAE_model:
    d_model: 32          # = num_heads * d_head, and = encoder_num_heads * 8 (even head width)
    d_z: 8               # divisible by num_heads, required by the head-structured posterior
    d_head: 8
    max_lag: 8
    encoder_d_ff: 64
    target_attention_blocks: 2
    source_attention_blocks: 2
    dropout: 0.0
    likelihood: mse

dataset_config:
  # Repo-root-relative: entry points run from the repo root. The fixtures are the family's -- every
  # model in the grid reads the same shards through the same loader, which is the point of the
  # comparison.
  vae_train_datasets: [teb_vae/lag_attn/tests/fixtures/tiny_shard.hdf5]
  vae_test_datasets: [teb_vae/lag_attn/tests/fixtures/tiny_shard.hdf5]
  stat_path: teb_vae/lag_attn/tests/fixtures/tiny_stats.hdf5
  dataloader_config:
    num_workers: 0       # no worker spawn for 4 samples

advanced_config:
  tracking:
    mlflow:
      enabled: false     # a smoke run is not a result

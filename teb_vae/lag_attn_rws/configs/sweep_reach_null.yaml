# Calibration arm: causal_reach_budget_s = null -- all channels, no delay.
#
# The unguarded endpoint of the reach sweep (the clean architecture comparison, whose KL is NOT a
# transfer entropy). Everything else is inherited from default.yaml, which ships a 120 s budget,
# so this arm differs from the shipped configuration in exactly one resolved key.
#
# Arms of this sweep build different input-adapter widths, so no two arms share a checkpoint.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_rws.trainer --config teb_vae/lag_attn_rws/configs/sweep_reach_null.yaml
base: default.yaml

model_config:
  VAE_model:
    causal_reach_budget_s: null

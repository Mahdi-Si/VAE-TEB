general_config:
  tag: conv_and_conv
  cuda_devices: [0]
  train_classifier: False
  lr: 0.01
  lr_milestone: [12000]
  weight_decay: 0.3
  checkpoint_frequency: 1
  plot_frequency: 1
  epochs: 50
  accumulate_grad_batches: 1
  batch_size:
    train: 2
    test: 2

model_config:
  VAE_model:
    Y_module_only: False
    raw_input_size: 4800
    input_size: 300
    channel_num: 2
    input_dim: 76
    RNN_hidden_dim: 100
    latent_size: 32  # Updated to match current implementation
    num_RNN_layers: 5
    kld_beta: 1.0  # Standard TEB beta value
    freeze_seqvae: False
    zero_source: True
    
    # Beta scheduling configuration for annealing
    beta_schedule: linear  # Options: 'constant', 'linear', 'cyclic'
    beta_start: 0.0        # Starting beta value for annealing
    beta_end: 6.0          # Final beta value (recommended for β-TCVAE)
    beta_anneal_epochs: 50 # Number of epochs for linear annealing
    beta_cycle_len: 1000   # Cycle length for cyclic annealing
    beta_const_val: 1.0    # Constant beta value when schedule is 'constant'
    
    # β-TCVAE specific configuration
    use_tcvae: true        # Enable β-TCVAE decomposed loss (set to false for standard TEB)
    alpha: 1.0             # Index-Code MI weight (information bottleneck)
    gamma: 1.0             # Dimension-wise KL weight (complexity penalty)
    dataset_size: 10000    # Initial estimate (will be updated from actual data)

  seqvae_checkpoint: null
  base_model_checkpoint: null
  classification_checkpoint: null

inv_scattering_model:
  do_inv_st: False
  inv_st_checkpoint: null
  train_inv_st: False

folders_config:
  out_dir_base: output

dataset_config:
    vae_train_datasets:
      - C:\Users\mahdi\Desktop\McGill\data\acidosis_no_cs.hdf5
    vae_test_datasets:
      - C:\Users\mahdi\Desktop\McGill\data\acidosis_no_cs.hdf5
    stat_path: C:\Users\mahdi\Desktop\McGill\data\stats.hdf5
    dataloader_config:
      num_workers: 0
      normalize_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph']
      # These are for CombinedHDF5Dataset
      dataset_kwargs:
        load_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph', 'epoch', 'guid']
        allowed_guids: null
        cs_label: null
        bg_label: null
        epoch_min: null
        epoch_max: null
        label: null
        cache_size: 2000
        trim_minutes: 2.0  # how much to trim from start and end of the signal

seqvae_testing:
  test_data_dir:
  test_data_selected_dir:
  HIE_test_data_dir:
  test_checkpoint_path: null
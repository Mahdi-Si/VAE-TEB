# Policy arm: withhold the forecast until ten minutes of recording have been observed.
#
# The shipped floor of 134 is a CAUSAL-VALIDITY boundary and nothing else: its job is to make
# t + 1 >= W'_c hold for every scored channel and t >= W'_c + d_c hold for every shifted input
# channel, and 134 is where both land. 134 steps is 536 s, i.e. 8.93 minutes; nothing physiological
# distinguishes it from step 150, both are inside the same segment, and the model's own 30-step
# warm-up has long passed at either.
#
# This arm exists because "ten minutes" may be meant as a SCIENTIFIC POLICY -- that a forecast should
# not be issued until ten minutes of recording have been observed, independent of filter validity --
# and that is a decision about what the study claims rather than about the transform. The cost is
# stated rather than argued: a floor of 150 keeps the IDENTICAL channel set (neither the budget nor
# the alignment moved), withholds 16 anchors, and at the shipped H = 10 / S = 5 tiling costs four
# tiles at phase 0 (28 against 32). It buys nothing on the validity axis; it buys the policy.
#
# The withheld 16 anchors are the invariant and the tile count is not: the same span costs
# ceil(16 / S) tiles, so it re-prices with every tiling change (one tile at the old S = 13 or the
# horizon-partitioning S = 30, two at S = 10, four at the shipped S = 5, which the legacy tiling
# also used). tests/test_sweep_configs.py
# pins the current figure so a tiling change fails there rather than quietly re-pricing the arm.
#
# The budget and the alignment reference both stay put. The floor is a lower bound rather than an
# equality, so a higher one is always admissible -- and lowering the budget alongside it would drop
# channels for a reason that has nothing to do with the policy.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_cfs.trainer --config teb_vae/lag_attn_cfs/configs/sweep_floor_150.yaml
base: default.yaml

model_config:
  VAE_model:
    warmup_period: 150

# Source-locality arm: source_attention_window = 64 (shipped 16).
#
# Predicted source-state reach R_U = min(21 + 3*(64-1), 300) = 210 steps = 840 s, well past the
# lag search range of 90 steps = 360 s. The source encoder now reads over two and a half times the
# furthest searched lag, so any lag structure the attention reports is a statement about which
# *state* is most useful rather than about which source neighbourhood the coupling came from.
# This arm is the diffuse end of the trade the sweep prices.
#
# Zero parameter change: the window is a mask, not a width.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_transformer_rws.trainer \
#       --config teb_vae/lag_attn_transformer_rws/configs/sweep_window_64.yaml
base: default.yaml

model_config:
  VAE_model:
    source_attention_window: 64

# Ablation arm: the initialisation-policy bundle off.
#
# The only arm that varies more than one key on purpose: it reverts the whole zero-parameter init
# bundle at once (horizon-embedding std back to the core's 0.02 seed, decoder output-head AND
# prior-head unit-scale calibration off, posterior source gain back to 1.0), so the baseline's
# init policies are isolated and measured on production data as a group rather than one at a
# time. The three keys move together because they are one design decision -- start the model near
# the trivial predictor with symmetry-broken horizon tokens and a balanced fusion -- not three
# independent knobs. Note head_init_calibration: false also restores the uncalibrated prior
# start, the configuration in which the prior-variance collapse was measured. Everything else is
# inherited from default.yaml.
#
# One inherited interaction, which is now the largest single effect in this arm: default.yaml
# ships posterior_logvar_mode: independent, whose q == p at init is recovered ONLY through
# head_init_calibration. Turning that key off therefore also turns off the exact-zero-KL start --
# measured on the tiny model at 54 nats/step mean, 142 max, against exactly 0 in the default. That
# is a legitimate part of what the init bundle buys, so it stays in the arm, but it means this
# arm's kld_raw and every per-lag KL attribution read off it START from a large unearned
# divergence and are not comparable in absolute terms with the default's. Read them as
# trajectories against this arm's own step 0, not against the default's. To measure the rest of
# the bundle without that term, add `posterior_logvar_mode: residual` below, which starts at
# exactly zero with or without the calibration.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_rws.trainer --config teb_vae/lag_attn_rws/configs/sweep_init_off.yaml
base: default.yaml

model_config:
  VAE_model:
    horizon_embed_std: 0.02
    head_init_calibration: false
    a_head_gain: 1.0

# Architecture A/B arm: horizon_depth = 5 (shipped 4).
#
# One more dilated refine block in the shared horizon core: dilations (1, 2, 4, 8, 16) instead of
# (1, 2, 4, 8). The shipped depth already gives the core a receptive field of 31 over 30 horizon
# tokens -- every token can see the whole block through the convolutions alone -- so this arm is
# not buying reach any more; it is buying depth at a reach that is already complete, and the extra
# block's dilation of 16 is wider than the horizon it runs over. +328,960 parameters, which
# includes the fifth per-block zero-init FiLM generator (the extra block reads the latent like the
# others). Speculative rather than evidence-backed, hence a sweep arm and not a default.
#
# Re-pointed from the depth-4 arm when 4 became the shipped value: an A/B arm that restates the
# default answers nothing, and the question here has always been "one block deeper than shipped".
# Everything else is inherited from default.yaml.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_rws.trainer --config teb_vae/lag_attn_rws/configs/sweep_horizon_depth_5.yaml
base: default.yaml

model_config:
  VAE_model:
    horizon_depth: 5

# Pytest config scoped to the raw-signal VAE-TEB v4 (`model_raw`) package.
#
# `--import-mode=importlib` is required here (unlike the v3 `tests/` dir, which runs in the
# default prepend mode). `model_raw` is a real package (`__init__.py`) nested under the inner
# `model` regular package, so prepend mode computes the rooted module name `model.model_raw.*`
# for anything collected under it -- which collides with the repo-root `model` package that the
# conftest pins into `sys.modules`. importlib mode imports each test/conftest by file path
# without that sys.path-derived naming, sidestepping the collision. The conftest still inserts
# the repo root on `sys.path`, so the absolute `model.vae_teb_prediction.*` imports resolve.
[pytest]
addopts = --import-mode=importlib
markers =
    slow: marks tests as slow (deselect with '-m "not slow"'); the Sprint-8 train-then-assert
        known-answer harnesses (up_effect, causal_te_validation, synthetic_lag) and the
        overfit-one-batch integration carry this marker.

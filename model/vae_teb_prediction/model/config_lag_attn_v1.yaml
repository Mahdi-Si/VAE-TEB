# Lag-Attentive Residual VAE-TEB v1 training configuration.
#
# Prerequisites (see plan Phase 0):
#   * Every HDF5 file listed below must contain the `up_st` field
#     (n_up_st_channels=43). Older pre_training_dataset files may not — the
#     dataset loader falls back gracefully, but the UP scattering stream is
#     then unavailable and the source adapter should be built with
#     `use_up_st: false` to match the 58-channel fallback.
#   * The stats file at `stat_path` must contain per-channel statistics for
#     `up_st`. If it does not, rerun `hdf5_dataset/calculate_dataset_stats.py`
#     before training.
#
# Warm-start: the new architecture's latent width (d_z=24), internal width
# (d_model=128) and source input channels (101) are all different from the
# current SeqVae checkpoint, so `core_model_checkpoint` must stay null. v1
# trains from scratch.

general_config:
  tag: lag_attn_v1_baseline

  cuda_devices: [0, 1, 2, 3, 4, 5, 6]
  lr: 0.001
  lr_milestone: [1000]
  checkpoint_frequency: 1
  plot_frequency: 1
  epochs: 5000
  accumulate_grad_batches: 1
  batch_size:
    train: 128
    test: 128

  folders_config:
    out_dir_base: /data/deid/isilon/MS_model/seq_vae_teb_results/lag_attn_v1

model_config:
  VAE_model:
    # KL / beta schedule
    beta_schedule: constant
    beta_start: 0.0
    beta_end: 1.0
    beta_anneal_epochs: 50
    beta_cycle_len: 1000
    beta_const_val: 0.01
    kld_beta: 0.01

    # Feature-loss weighting (spec section 8.7)
    lambda_full: 1.0
    lambda_base: 0.5

    # Backbone widths
    d_model: 128
    d_z: 24
    horizon: 30            # H_d = 30 decimated steps = 2 min forecast
    warmup_period: 30      # first 2 minutes ignored in both feature & KL losses
    sequence_length: 300
    c_y: 87                # 43 (fhr_st) + 44 (fhr_ph)
    c_u: 101               # 43 (up_st) + 58 (up_ph) -- pre-fallback value
    use_up_st: true
    lstm_layers: 2
    dropout: 0.1
    decoder_hidden: 128
    logvar_clamp: [-8.0, 8.0]

    # Attention
    max_lag: 90            # L = 91 (~6 minutes of UP history at 4 s/step)
    num_heads: 4
    d_head: 32
    use_entmax: false      # fall back to softmax; entmax is optional
    attention_grad_checkpoint: true  # start on; ~900 MB memory bank at B=64

  core_model_checkpoint: null

  classifier:
    vae_checkpoint: /path/to/your/trained/vae/checkpoint.ckpt
    type: lstm
    latent_dim: 24
    num_classes: 2
    freeze_vae: true
    use_posterior: true
    sample_latent: false

    hidden_dim: 128
    num_layers: 2
    bidirectional: false
    attn_dim: 64
    dropout: 0.1
    num_filters: 64
    kernel_sizes: [3, 5, 7]
    d_model: 128
    n_heads: 4
    dim_feedforward: 256
    pooling: mean

    evaluation:
      target_fpr: 0.05
      compute_both_thresholds: true
      generate_plots: true
      decision_time_hours: 1.0
      exclude_last_minutes: 30
      max_gap_multiplier: null


dataset_config:
    vae_train_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/pre_training_dataset/train_dataset_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/pre_training_dataset/train_dataset_no_cs.hdf5
    vae_test_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/pre_training_dataset/test_dataset_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/pre_training_dataset/test_dataset_no_cs.hdf5

    stat_path: /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/stats.hdf5

    kfold_base_path: /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/k_fold_cross_validation_dataset
    num_folds: 10
    classifier_train_datasets: []
    classifier_val_datasets: []
    classifier_test_datasets: []

    dataloader_config:
      num_workers: 4
      prefetch_factor: 4
      # `up_st` added to both lists (was absent in the v1/legacy config).
      normalize_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph', 'up_st']
      dataset_kwargs:
        load_fields:
          [
            'fhr',
            'up',
            'fhr_st',
            'fhr_ph',
            'fhr_up_ph',
            'up_st',
            'target',
            'weight',
            'epoch',
            'cs_label',
            'bg_label',
            'guid',
          ]
        allowed_guids: null
        cs_label: null
        bg_label: null
        epoch_min: null
        epoch_max: -23000
        label: null
        cache_size: 10000
        trim_minutes: 2.0


# Advanced configs ========================================================

advanced_config:
  trainer:
    precision: "32-true"
    gradient_clip_val: 0.5
    gradient_clip_algorithm: "norm"
    sync_batchnorm: false
    deterministic: false
    benchmark: true

  memory:
    enable_memory_monitoring: false
    memory_threshold_gb: 60.0
    memory_log_frequency: 500

  tracking:
    mlflow:
      enabled: true
      tracking_uri: "http://localhost:5000"
      experiment_name: seqvae-teb-lag-attn-v1
      run_name: lag_attn_v1_baseline
      artifact_location: null
      log_model: true
      log_config_artifact: true
      tags:
        project: teb_vae
        stage: dev
        variant: lag_attn_v1

  callbacks:
    early_stopping:
      enabled: false
      monitor: "val/total_loss"
      patience: 30
      min_delta: 0.0001

    model_checkpoint:
      monitor: "val/total_loss"
      save_top_k: 3
      mode: "min"

    loss_plotting:
      max_history_size: 1000

    reconstruction_plotting:
      enabled: false
      plot_frequency: 10
      num_examples: 3

    comprehensive_plotting:
      enabled: false    # no raw prediction in v1
      plot_frequency: 10

    # Lag-attentive v1 diagnostic plotting callback. Runs on
    # on_validation_epoch_end at the given frequency and emits a
    # publication-quality multi-row figure per validation sample covering
    # raw signals, stacked feature maps, latent / posterior / prior,
    # per-dim KLD, lag attention, TE attribution, forecast, MAE and
    # residual usage.
    lag_attn_plotting:
      enabled: true
      plot_frequency: 5                 # plot every 5 validation epochs
      num_examples: 2                   # 2 samples per trigger
      file_format: "pdf"
      forecast_channels: [0, 43, 80]    # st[0], ph[0], ph[37]
      forecast_anchor_frac: 0.6         # anchor at 60% of the sequence

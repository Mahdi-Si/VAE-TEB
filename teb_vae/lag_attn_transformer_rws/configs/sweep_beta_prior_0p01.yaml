# Prior-anchor arm: beta_prior = 1.0e-2, one order BELOW the shipped 0.1.
#
# The lower neighbour of the shipped weight. It says whether the anchor's threshold sits between
# 1.0e-2 and 0.1 on this encoder: if the prior holds off its floor at 1.0e-2, the shipped value is
# over-anchored. Read it on logvar_prior_floor_frac and mean_logvar_prior first.
#
# 0 parameters: the anchor is an objective term, not a module.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_transformer_rws.trainer \
#       --config teb_vae/lag_attn_transformer_rws/configs/sweep_beta_prior_0p01.yaml
base: default.yaml

model_config:
  VAE_model:
    beta_prior: 1.0e-2

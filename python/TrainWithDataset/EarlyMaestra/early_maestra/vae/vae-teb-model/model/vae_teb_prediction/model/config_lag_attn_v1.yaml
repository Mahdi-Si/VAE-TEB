# Lag-Attentive Residual VAE-TEB v1 training configuration.
#
# Prerequisites:
#   * HDF5 datasets must be produced by
#     `hdf5_dataset/new_pipeline/create_new_pipeline.py`, which writes
#     `up_st` (43 channels, log-normalised) and `up_ph` (58 channels,
#     asinh-normalised) as first-class datasets alongside `fhr_st`,
#     `fhr_ph`, and `fhr_up_ph` (now cross-channel phase only, 79
#     channels — NOT concatenated with UP self-phase any more).
#   * The stats file at `stat_path` must be regenerated after any dataset
#     rebuild by running `hdf5_dataset/calculate_dataset_stats.py`. It
#     must contain per-channel statistics for every field listed in
#     `normalize_fields` below — in particular `up_st` and `up_ph` which
#     are independent fields with their own asinh/log stats.
#
# Ablation toggle: `use_up_st: true` → source stream = concat(up_st, up_ph)
# with c_u=101. `use_up_st: false` → source stream = up_ph alone with
# c_u=58. The model constructor raises if (c_u, use_up_st) are
# inconsistent.
#
# Warm-start: the lag-attn v1 architecture's latent width (d_z=24),
# internal width (d_model=128) and source input channel count are all
# different from any previous SeqVae checkpoint, so `core_model_checkpoint`
# must stay null. v1 trains from scratch.

general_config:
  tag: lag_attn_v1_baseline

  cuda_devices: [0, 1, 2, 3, 4, 5, 6]
  lr: 0.001
  lr_milestone: [1000]
  checkpoint_frequency: 1
  plot_frequency: 1
  epochs: 5000
  accumulate_grad_batches: 1
  batch_size:
    train: 128
    test: 128

  folders_config:
    out_dir_base: /data/deid/isilon/MS_model/new_vae_teb_cross_attention/lag_attn_v1

model_config:
  VAE_model:
    # KL / beta schedule (A1/A2 — calibrated ELBO).
    # ``beta_schedule`` is resolved per-epoch by
    # ``SeqVaeLagAttnPl._resolve_beta``. kind: linear_warmup ramps β from
    # ``start`` to ``end`` over the first ``warmup_epochs`` epochs, then holds
    # at ``end`` — the residual decoder learns to use z under weak pressure
    # before the bottleneck tightens for a calibrated TE reading. kind:
    # constant uses ``value`` (or the ``kld_beta`` fallback below). Because the
    # NLL reconstruction (below) is in nats, β≈0.1 is now a real bottleneck,
    # not the old "barely a bottleneck" 0.001.
    beta_schedule:
      kind: linear_warmup
      start: 1.0e-4
      end: 0.1
      warmup_epochs: 50
    kld_beta: 0.001        # fallback when beta_schedule.kind == constant
    free_bits: 0.1         # nats per latent dim per step; 0.0 disables

    # Reconstruction likelihood (A1). 'gaussian_nll' puts feat / base losses in
    # nats so they are directly comparable to kld_loss (β=1 is the true ELBO).
    # 'mse' is the legacy squared-feature objective. ``sigma_obs`` is the fixed
    # observation-noise scalar; switch to 'learned' to consume the decoder
    # logvar heads (heteroscedastic NLL) — that also lets train_model drop the
    # DDP find_unused_parameters flag (see D10 in train_model).
    likelihood: gaussian_nll
    sigma_obs: 1.0

    # A3 — baseline/residual gradient separation. Form the full prediction as
    # sg(mu_base) + delta_mu_src for L_feat so the feature gradient trains only
    # the residual / posterior / source path, keeping K_t from absorbing
    # FHR-self-explainable variance.
    detach_baseline_in_full: true

    # Feature-loss weighting (spec section 8.7)
    lambda_full: 1.0
    lambda_base: 0.5

    # Backbone widths
    d_model: 128
    d_z: 24
    horizon: 30            # H_d = 30 decimated steps = 2 min forecast
    warmup_period: 30      # first 2 minutes ignored in both feature & KL losses
    sequence_length: 300
    c_y: 87                # 43 (fhr_st) + 44 (fhr_ph)
    c_u: 101               # 43 (up_st) + 58 (up_ph); must equal 58 if use_up_st=false
    use_up_st: true
    lstm_layers: 2
    dropout: 0.1
    decoder_hidden: 128
    logvar_clamp: [-5.0, 3.0]
    # Latent stabilisers (see vae_teb_lag_attn_v1.py PriorHead / PosteriorHead).
    # mu_scale bounds |mu_prior|; delta_mu_scale bounds |mu_post - mu_prior|.
    # Running stats are populated BatchNorm-style from mu_post during training.
    mu_scale: 5.0
    delta_mu_scale: 3.0
    latent_stats_momentum: 0.01

    # Attention
    max_lag: 90            # L = 91 (~6 minutes of UP history at 4 s/step)
    num_heads: 4
    d_head: 32
    # B5 — entmax15 gives exactly-zero weights for irrelevant lags (sharper
    # "which lag matters"). Requires the `entmax` package; falls back to
    # softmax automatically if it is not importable. Keep `false` for the
    # softmax ablation arm.
    use_entmax: true
    # B6 — keys/values are now projected once from H^u with banded strided
    # views (no (B,T,L,d_model) bank), so the ~900 MB bank is gone and
    # gradient checkpointing is no longer required. Set `true` only if you hit
    # memory pressure at very large batch sizes.
    attention_grad_checkpoint: false
    # B4 — lag-embedding smoothness penalty (mean squared adjacent-lag diff of
    # the Shaw bias) for a smoother, physiologically plausible te_lag_map.
    lag_smoothness_lambda: 1.0e-3
    # B4 — lag-bias init: 'normal' (no extra param) or 'alibi_decay' (learnable
    # monotonic lag penalty so the model earns long-lag usage).
    lag_bias_init: normal

    # C7 — head-structured latent. Partition z into num_heads groups, each
    # conditioned only on its attention head's summary a^(m), so the per-head
    # KL K_t^(m) is a genuine additive decomposition (sum_m K_t^(m) = K_t) and
    # te_lag_map becomes sum_m K_t^(m) * alpha^(m). Requires d_z % num_heads
    # == 0 (24 / 4 = 6). Breaks checkpoint alignment with flat-latent runs.
    head_structured_latent: true

    # D8/D9 — shared horizon decoder core. ``depth`` dilated horizon-conv
    # blocks (dilations 1,2,4,...) + FiLM conditioning on the decoder state,
    # shared between the baseline and residual decoders so the residual is a
    # correction in the baseline's representation space. ``attn`` (horizon
    # self-attention) is not implemented in this revision.
    horizon_refine:
      depth: 3
      kernel: 3
      film: true
      attn: false

    # E11 — append dilated conv blocks (kernel 15) to both encoders for a
    # longer exponential receptive field over the 20-min window; the 2-layer
    # uni-LSTM is kept. ``temporal_backbone`` is reserved for a future SSM
    # option and currently must be 'lstm'.
    encoder:
      extra_dilations: [8, 16]
      temporal_backbone: lstm

    # Loss-spike circuit breaker. Guards against the "KL / base loss
    # explodes then decays" pattern observed during early training by
    # skipping any batch whose ``total_loss`` exceeds ``multiplier × EMA``.
    # On a skip, Lightning receives ``None`` from ``training_step``, so
    # backward() and optimizer.step() are both bypassed — Adam's moment
    # estimates never absorb the outlier gradient. The EMA is primed during
    # the first ``warmup_batches`` (never gated) and updated ONLY on
    # accepted batches thereafter, so a spike cannot raise the threshold.
    # See ``SeqVaeLagAttnPl.training_step`` in trainer_lag_attn_v1.py.
    loss_spike_skip:
      enabled: true
      multiplier: 5.0        # trip when loss > 5× running EMA
      ema_momentum: 0.02     # EMA smoothing (smaller = longer memory)
      warmup_batches: 100    # priming window before gating activates
      warn_on_skip: true     # emit a loguru warning on every skip

  core_model_checkpoint: null

  classifier:
    vae_checkpoint: /path/to/your/trained/vae/checkpoint.ckpt
    type: lstm
    latent_dim: 24
    num_classes: 2
    freeze_vae: true
    use_posterior: true
    sample_latent: false
    # IMPORTANT: after loading the frozen VAE, call
    #   model.fit_latent_stats(train_dataloader)
    # once to replace the approximate per-rank EMA stats with exact,
    # DDP-consistent training-set mean/variance of ``mu_post``. Then feed
    # ``model.normalize_latent(mu_post)`` into the classifier head so the
    # classifier sees well-conditioned, zero-mean / unit-std latents and
    # is not dominated by any single drifted dim.

    hidden_dim: 128
    num_layers: 2
    bidirectional: false
    attn_dim: 64
    dropout: 0.1
    num_filters: 64
    kernel_sizes: [3, 5, 7]
    d_model: 128
    n_heads: 4
    dim_feedforward: 256
    pooling: mean

    evaluation:
      target_fpr: 0.05
      compute_both_thresholds: true
      generate_plots: true
      decision_time_hours: 1.0
      exclude_last_minutes: 30
      max_gap_multiplier: null


dataset_config:
    vae_train_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/train_dataset_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/train_dataset_no_cs.hdf5
    vae_test_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/test_dataset_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/test_dataset_no_cs.hdf5 # List of HDF5 file paths for validation


    stat_path: /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/stats.hdf5                    # Path to normalization stats.hdf5

    kfold_base_path: /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/k_fold_cross_validation_dataset
    num_folds: 10
    classifier_train_datasets: []
    classifier_val_datasets: []
    classifier_test_datasets: []

    dataloader_config:
      num_workers: 4
      prefetch_factor: 4
      # Normalization is keyed by the physical HDF5 field name. Every field
      # listed here must have a matching entry in the stats HDF5.
      # `fhr_up_ph` (cross-channel phase) is intentionally omitted: v1 does
      # not consume it, so we skip the load+normalise tax for that field.
      normalize_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'up_st', 'up_ph']
      dataset_kwargs:
        # Disable in-worker ``tensor.pin_memory()`` inside
        # ``HDF5Dataset._create_tensor``. Pinning inside DataLoader worker
        # processes calls ``cudaHostAlloc``, which forces each worker to
        # create its own CUDA context on ``cuda:0`` (~400-600 MB of VRAM per
        # worker for kernels, cuDNN/cuBLAS handles, and allocator
        # bookkeeping). With 7 DDP ranks × ``num_workers=4`` = 28 worker
        # processes all pinning against ``cuda:0``, rank 0's GPU OOMs the
        # moment Lightning spawns a fresh set of validation workers at the
        # epoch-0 train→val transition. The DataLoader's own
        # ``pin_memory=True`` flag (passed from ``create_optimized_dataloader``
        # in the trainer) still pins the collated batch in the *main* process,
        # which is the PyTorch-recommended pattern and has no worker-side
        # context cost. Flip to ``true`` only if profiling shows the
        # main-process pin is a bottleneck, and only with ``num_workers=0``.
        pin_memory: false
        # `up_ph` is now a first-class HDF5 field with its own per-channel
        # asinh stats (no virtual slicing from `fhr_up_ph`). `fhr_up_ph` is
        # not loaded for v1.
        load_fields:
          [
            'fhr',
            'up',
            'fhr_st',
            'fhr_ph',
            'up_ph',
            'up_st',
            'target',
            'weight',
            'epoch',
            'cs_label',
            'bg_label',
            'guid',
          ]
        allowed_guids: null
        cs_label: null
        bg_label: null
        epoch_min: null
        epoch_max: -48000
        label: null
        cache_size: 10000
        trim_minutes: 1.0


# Advanced configs ========================================================

advanced_config:
  trainer:
    precision: "32-true"
    # Global gradient-norm clipping. With LSTM + lag cross-attention + KL,
    # occasional gradient spikes are expected. 0.5 is more conservative
    # than the 1.0 default many tutorials use; loosen to 1.0 only if you
    # see training stalling from overly aggressive clipping.
    gradient_clip_val: 0.5
    gradient_clip_algorithm: "norm"
    sync_batchnorm: false
    deterministic: false
    benchmark: true

  memory:
    enable_memory_monitoring: false
    memory_threshold_gb: 60.0
    memory_log_frequency: 500

  tracking:
    mlflow:
      enabled: true
      tracking_uri: "http://localhost:5000"
      experiment_name: seqvae-teb-lag-attn-v1
      run_name: lag_attn_v1_baseline
      artifact_location: null
      log_model: true
      log_config_artifact: true
      tags:
        project: teb_vae
        stage: dev
        variant: lag_attn_v1

  callbacks:
    early_stopping:
      enabled: false
      monitor: "val/total_loss"
      patience: 300
      min_delta: 0.0001

    model_checkpoint:
      monitor: "val/total_loss"
      save_top_k: 3
      mode: "min"

    loss_plotting:
      max_history_size: 10000

    reconstruction_plotting:
      enabled: true
      plot_frequency: 10
      num_examples: 3

    comprehensive_plotting:
      enabled: false    # no raw prediction in v1
      plot_frequency: 1

    # Lag-attentive v1 diagnostic plotting callback. Runs on
    # on_validation_epoch_end at the given frequency and emits a
    # publication-quality multi-row figure per validation sample covering
    # raw signals, stacked feature maps, latent / posterior / prior,
    # per-dim KLD, lag attention, TE attribution, forecast, MAE and
    # residual usage.
    lag_attn_plotting:
      enabled: true
      plot_frequency: 1                 # plot every 5 validation epochs
      num_examples: 2                   # 2 samples per trigger
      file_format: "pdf"
      forecast_channels: [0, 43, 80]    # st[0], ph[0], ph[37]
      forecast_anchor_frac: 0.6         # anchor at 60% of the sequence

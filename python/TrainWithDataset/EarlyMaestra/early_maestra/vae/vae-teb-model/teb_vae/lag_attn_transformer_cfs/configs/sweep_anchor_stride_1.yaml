# Tiling ablation: train on every valid anchor rather than on a tile.
#
# At stride 1 the anchor set is the dense range [F, T_valid), which is what every other cell of the
# grid decodes and what validation already decodes here -- so this arm is the control that says what
# the tiling itself costs or buys, with nothing else moved.
#
# What the tiling changes, and therefore what this arm measures. Consecutive forecast windows at
# stride 1 overlap (H-1)/H, so each target coefficient is scored by up to H anchors: the loss weights
# every target sample H times and correlates the gradients within one batch element. At stride H the
# windows partition the timeline, no coefficient is scored twice in a step, and every anchor is still
# reached over epochs because the per-segment phase rotates. The arm also restores 137 decoded
# anchors per step against the tiling's ~4.57, so the per-step loss variance falls by roughly an
# order and a half of magnitude -- which is why `gradient_clip_val` and `additive_margin` are
# inherited rather than re-derived here: both were measured at the noisier setting and are therefore
# loose, not tight, on this arm.
#
# The memory cost is the reason this is an arm rather than the default: the four forecast tensors and
# the target go from (B, 5, 30, 98) to (B, 137, 30, 98), which at batch 128 is roughly 206 MB rather
# than 7.5 MB EACH. At the one-minute horizon the same arm cost 114 MB against 8 MB, so doubling H
# nearly doubled the arm's price while leaving the tiled default's almost unchanged.
#
# It is the ONE arm this package ships, and the reason is the grid rather than an omission: the floor,
# horizon and depth arms answer questions about the target domain, which the conv-LSTM causal cell
# already asks, and the encoder arms answer questions about the encoder, which
# `lag_attn_transformer_rws` already asks. The tiling arm is the only one whose answer could differ
# between the two encoders, because what it moves is the per-step gradient noise.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_transformer_cfs.trainer \
#       --config teb_vae/lag_attn_transformer_cfs/configs/sweep_anchor_stride_1.yaml
base: default.yaml

model_config:
  VAE_model:
    # 1 is the INERT value -- the dense range -- so this arm decouples the stride from the horizon
    # deliberately, which is the one place in this package where they are allowed to differ.
    anchor_stride: 1

# Source ablation: the two encoder states (target 128-d, source 128-d) instead of the latents. The
# source state carries the UP pathway before the posterior head.
base: regularised.yaml

classifier:
  run: {name: trf_cfs_adverse_seq_reg_src_states}
  source:
    vae:
      keys:
        - {name: target_state}
        - {name: source_state}
        - {name: kld_per_t, transform: log1p, role: attention}

# Forecast-clock arm: the STORED clock -- today's target, restored exactly.
#
# Every kept channel is scored at its own stored index (s_c = 0), which is bitwise the model that
# shipped before `causal_target_forecast_clock` existed. TWO KEYS RATHER THAN ONE, and the second
# is the geometry that travelled with the first: the shipped 'physical' default lowers the anchor
# ceiling to 185 and moves the stride to 10 to keep its tile count; on the stored clock the
# ceiling is T_valid = 270 again and stride 30 restores the horizon-partitioning tiling every
# historical run trained at. An arm that moved only the clock would compare two tilings as well
# as two clocks.
#
# WHAT IT MEASURES. The stored clock's question is per-channel: the slowest kept channel draws
# 2.6% of its scored value from the horizon window (`causal_novelty_frac`), so its "forecast" is
# near-copyable and the novelty-tertile split is what makes that legible. Against the physical
# arm this is the pre-registered comparison: does forcing every channel onto one future instant
# buy an informative latent, at the price of 85 trailing anchors?
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_transformer_cfs.trainer --config teb_vae/lag_attn_transformer_cfs/configs/sweep_target_clock_stored.yaml
base: default.yaml

model_config:
  VAE_model:
    causal_target_forecast_clock: stored
    anchor_stride: 30

advanced_config:
  tracking:
    mlflow:
      # IDENTITY: the arm in the name, on both keys, so a run's own records say which arm trained
      # even if the config it was launched from cannot be recovered.
      run_name: lag_attn_trf_cfs_clock_stored
      tags:
        variant: lag_attn_trf_cfs_clock_stored

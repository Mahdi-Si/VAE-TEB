# The ablation baseline. Against default.yaml, this delta adds within-segment temporal structure, shrinks the trunk,
# adds noise and ensembles 3 seeds. It also fixes the labels, training window and context, so that every `base: regularised.yaml` ablation differs from it in one
# thing. Do not also pass `optimizer.lr` or `max_epochs` overrides: they would replace the values here. The paths
# (data.kfold_root, source.vae.checkpoint, source.hdf5.stats_path, run.out_root) still come from --set / RUN_ARGS.
base: default.yaml

classifier:
  run:
    name: trf_cfs_adverse_seq_reg
    seeds: [42, 43, 44]             # seed ensemble: the `ens` unit averages the 3 seeds per fold

  data:
    train_epoch_min_s: -21600.0     # train on the last 6 h; val and test keep the full window (L6)

  labels:
    # Training target per position. Alternatives, with the keys they read:
    #   propagate      every position takes the GUID label, weight 1 (k_warm drops the first k positions)
    #   horizon        positive-GUID positions count only within horizon_h of delivery
    #   horizon_decay  positive-GUID weight 2^(-max(0, Δ - horizon_h) / decay_halflife_h), Δ = hours to delivery
    #   final_only     only the last position of each GUID is scored (offline GUID classification)
    #   mil            no per-position target: τ·log mean exp(s_n/τ) over the positions gets the GUID label
    # Here: horizon_decay, H 1 h, half-life 0.5 h (a positive segment at 3 h weighs 0.06); the
    # lab_*.yaml configs vary these.
    strategy: horizon_decay
    horizon_h: 1.0
    decay_halflife_h: 0.5

  context:
    delta_t: {enabled: false}       # the transformer's relative-time bias carries Δt

  model:
    step: {temporal: causal_conv, dropout: 0.2}   # depthwise-separable causal conv, k 5, dilations 1/2/4
    token: {d: 64, dropout: 0.2}
    sequence: {layers: 1, heads: 4, d_ff: 128, dropout: 0.2}
    head: {hidden: 32, dropout: 0.3}

  train:
    segment_dropout: 0.3
    optimizer: {lr: 3.0e-4, weight_decay: 5.0e-2}
    max_epochs: 60                  # the cosine schedule spans max_epochs, so it now decays within the run

  eval:
    stage_offsets: true             # the `<kind>_stage` secondary view: per-stage offsets, val-selected

advanced_config:
  callbacks:
    early_stopping: {patience: 20}  # monitor val/guid_auroc (max), as default.yaml

# Development validation config: the production model over the committed HIE sample shard.
#
# NOT a sweep arm and not a result config -- it is the dev-box run that de-risks a production
# calibration before multi-day time is spent on it. It shares the shipped model geometry with
# default.yaml on purpose: the pathology this config exists to reproduce (the conditional prior's
# log-variance falling onto its clamp floor) is a property of the objective at the real widths,
# and a shrunken model would not reproduce it. Only the run's *scale* is local -- one device, one
# shard, hundreds of epochs instead of thousands.
#
# What it is NOT: a generalisation measurement. `output/hie_cs.hdf5` is 339 windows from 14
# recordings, and it is used for BOTH splits, because `dataset_kwargs` is shared between the two
# loaders (train/data_module.py) and so cannot carry a per-split GUID filter. The validation
# columns are therefore in-sample. That is adequate for what is being read here -- prior floor
# fraction, prior log-variance, the base forecast's scale and the amplification ratio are
# optimisation diagnostics, not held-out claims -- and it is why no verdict from this run is
# quoted as a coupling result.
#
# Prerequisite: output/hie_cs_stats.hdf5, generated FROM THIS SHARD by
# hdf5_dataset/calculate_dataset_stats.py at trim_minutes=1.0. Inheriting the four-sample fixture
# statistics passes every existing guard (the channel counts match) and silently trains on
# mis-normalised data, so the path below is not interchangeable with tiny.yaml's.
#
#   python -m teb_vae.lag_attn_rws.trainer --config teb_vae/lag_attn_rws/configs/smoke_hie.yaml
base: default.yaml

general_config:
  tag: lag_attn_rws_hie_smoke
  cuda_devices: [0]
  # Counted in optimizer STEPS, not epochs. 339 windows at batch 32 is 11 steps per epoch against
  # the production run's 450 -- an epoch here is ~40x smaller -- and the prior collapse this
  # config exists to reproduce is driven by steps taken, not by epochs elapsed. 200 epochs is
  # ~2,200 steps, matching the 2,000-step window the gradient-norm re-derivation procedure asks
  # for. A first pass at 60 epochs (~660 steps) left BOTH arms still moving and could not be read.
  epochs: 200
  # The two figure cadences (loss_plot_epoch.html and the per-epoch diagnostic) share this key.
  # Every epoch would spend more wall-clock plotting than training at this shard size.
  plot_frequency: 10
  batch_size: {train: 32, test: 32}
  folders_config: {out_dir_base: output/lag_attn_rws_hie_smoke}

model_config:
  VAE_model:
    # The shipped ramp is 50 epochs inside a 5,000-epoch run -- 1% of it. Held at 50 here it
    # would be a quarter of the run, and the coupling columns would be read off a model that had
    # barely been asked to pay for its rate. Scaled to the local budget so beta sits at its
    # endpoint for the last 90% of the run, as it effectively does in production.
    beta_schedule:
      kind: linear_warmup
      start: 0.0
      end: 1.0
      warmup_epochs: 20

dataset_config:
  # Repo-root-relative: entry points run from the repo root. Both splits are the same shard; see
  # the header for why, and for what that does and does not license.
  vae_train_datasets: [output/hie_cs.hdf5]
  vae_test_datasets: [output/hie_cs.hdf5]
  stat_path: output/hie_cs_stats.hdf5
  dataloader_config:
    num_workers: 2       # 339 samples; worker spawn dominates beyond this on Windows
    prefetch_factor: 2

advanced_config:
  tracking:
    mlflow:
      enabled: false     # no tracking server on the dev box; the run directory is the record

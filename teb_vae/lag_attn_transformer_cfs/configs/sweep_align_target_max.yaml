# Alignment arm: ONE clock for both streams, which is what this family shipped before the source
# gained a reference of its own.
#
# The default puts the target on 402.1604 s and the source on 288.2672 s, so the two streams read
# on different clocks separated by a known -113.8932 s. This arm sets the source key to null, which
# restores the single-reference resolution byte for byte -- every source channel at or below
# 402.1604 s kept (47 of 51, all fifteen `up_ph`), no inter-stream offset on the lag axis.
#
# WHAT IT MEASURES. The dual reference buys a readable lag window and pays for it in source
# channels: at 288.2672 s the envelope block goes 15 -> 9 and the whole source stream 47 -> 39. This
# arm is what prices that trade on a trained run rather than on the geometry alone. The
# pre-registered reading is unchanged from the alignment work: an alignment arm should NOT improve
# `pred_gap`, and SHOULD improve lag-profile concentration if a real lag exists -- read on the
# per-head profiles and the shape vocabulary rather than on the pooled argmax, which the lag
# window's near censoring edge pins at 0 on every arm this family has measured.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_transformer_cfs.trainer --config teb_vae/lag_attn_transformer_cfs/configs/sweep_align_target_max.yaml
base: default.yaml

model_config:
  VAE_model:
    causal_align_reference_source: null

advanced_config:
  tracking:
    mlflow:
      # IDENTITY: the arm in the name, on both keys, so a run's own records say which arm trained
      # even if the config it was launched from cannot be recovered.
      run_name: lag_attn_trf_cfs_align_target_max
      tags:
        variant: lag_attn_trf_cfs_align_target_max

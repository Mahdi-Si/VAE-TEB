# Raw-signal VAE-TEB v4 (`SeqVaeRawV4`) SMOKE config -- single-GPU memory/OOM tuning (S5-T01).
#
# Identical model + geometry to config_raw_v4.yaml, shrunk for a fast single-GPU run on a real HDF5
# fold: one device, a small batch, and a handful of epochs, so the run confirms metrics are logged,
# a checkpoint is written, and the peak memory is recorded. The measured `batch_size` /
# front-end `channels` / `accumulate_grad_batches` are copied back into config_raw_v4.yaml.
#
# S5-T03 (bf16): flip `advanced_config.trainer.precision` to "bf16-mixed" and rerun this config.
# NOTE: the dataset paths below are prod (`/data1/...`), so this config runs on the prod box, not
# the local Windows/RTX-4080 box. MLflow is disabled to keep the smoke self-contained.

general_config:
  tag: raw_v4_smoke

  cuda_devices: [0]        # single GPU (memory/OOM sizing)
  lr: 0.001
  lr_milestone: [1000]
  checkpoint_frequency: 1
  plot_frequency: 1
  epochs: 2               # a handful of steps/epochs is enough to size memory
  accumulate_grad_batches: 1
  batch_size:
    train: 4              # start small; grow until OOM, then back off
    test: 4

  folders_config:
    out_dir_base: /data/deid/isilon/MS_model/new_vae_teb_cross_attention/raw_v4_smoke

model_config:
  VAE_model:
    beta_schedule:
      kind: linear_warmup
      start: 1.0e-4
      end: 0.1
      warmup_epochs: 50
    kld_beta: 0.001
    free_bits: 0.1

    likelihood: gaussian_nll
    sigma_obs: learned
    detach_baseline_in_full: true
    lambda_full: 1.0
    lambda_base: 0.5

    d_model: 128
    d_z: 24
    horizon: 30
    warmup_period: 30
    sequence_length: 300
    c_y: 87
    c_u: 101
    use_up_st: true
    lstm_layers: 2
    dropout: 0.1
    decoder_hidden: 128
    logvar_clamp: [-5.0, 3.0]
    mu_scale: 5.0
    delta_mu_scale: 3.0
    latent_stats_momentum: 0.01

    causal_norm: true
    logvar_bound: smooth
    posterior_logvar: residual
    delta_logvar_scale: 2.0
    kld_support: anchor
    lambda_perm: 0.0
    perm_every_n_batches: 4

    max_lag: 90
    num_heads: 4
    d_head: 32
    use_entmax: true
    attention_grad_checkpoint: false
    lag_smoothness_lambda: 1.0e-3
    lag_bias_init: alibi_decay
    head_structured_latent: true
    freeze_unused_attn_proj: true

    horizon_refine:
      depth: 3
      kernel: 3
      film: true
      attn: false

    encoder:
      extra_dilations: [8, 16]
      temporal_backbone: lstm

    loss_spike_skip:
      enabled: true
      multiplier: 5.0
      ema_momentum: 0.02
      warmup_batches: 100
      warn_on_skip: true
      max_consecutive_skips: 25

    raw_len: 5280
    decimation: 16
    frontend:
      stages: [2, 2, 2, 2]
      channels: [32, 64, 96, 128]
      d_raw: 128
      antialias: true
      antialias_kernel: binomial5
      gated: true
      norm_kind: causal_group_norm
      norm_num_groups: 8
      first_kernels_fhr: [7, 31, 65]
      first_kernels_up: [15, 65, 129]
      decoder_head: learned_basis
      basis_size: 8
      dropout: 0.05

    lambda_lp: 0.5
    lambda_smooth: 0.1
    lowpass_scales: [4, 16, 32, 60]

  warm_start_from: null
  core_model_checkpoint: null

dataset_config:
    vae_train_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/train_dataset_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/train_dataset_no_cs.hdf5
    vae_test_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/test_dataset_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/test_dataset_no_cs.hdf5

    stat_path: /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/stats.hdf5

    kfold_base_path: /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/k_fold_cross_validation_dataset
    num_folds: 10
    classifier_train_datasets: []
    classifier_val_datasets: []
    classifier_test_datasets: []

    dataloader_config:
      num_workers: 2
      prefetch_factor: 2
      normalize_fields: ['fhr', 'up']
      dataset_kwargs:
        pin_memory: false
        load_fields:
          [
            'fhr',
            'up',
            'weight',
            'target',
            'epoch',
            'cs_label',
            'bg_label',
            'guid',
          ]
        allowed_guids: null
        cs_label: null
        bg_label: null
        epoch_min: null
        epoch_max: -48000
        label: null
        cache_size: 2000
        trim_minutes: null   # MUST stay null for raw_len=5280/330

advanced_config:
  trainer:
    precision: "32-true"      # S5-T03: flip to "bf16-mixed" to smoke bf16
    gradient_clip_val: 0.5
    gradient_clip_algorithm: "norm"
    sync_batchnorm: false
    deterministic: false
    benchmark: true

  memory:
    enable_memory_monitoring: true
    memory_threshold_gb: 40.0
    memory_log_frequency: 50

  tracking:
    mlflow:
      enabled: false

  callbacks:
    model_checkpoint:
      monitor: "val/total_loss"
      save_top_k: 1
      mode: "min"

    loss_plotting:
      max_history_size: 1000

    raw_plotting:
      enabled: true
      plot_frequency: 1
      num_examples: 2
      file_format: "pdf"
      forecast_anchor_frac: 0.6

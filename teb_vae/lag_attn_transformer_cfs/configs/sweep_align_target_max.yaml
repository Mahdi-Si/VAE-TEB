# Input-alignment arm: every input channel delayed onto the slowest kept target channel's clock
# (target_max = 402.16 s), on BOTH streams -- the single-reference scheme. Against the promoted
# default, which reads every channel at its own availability time, this is the arm that asks what
# imposing one approximate input clock costs or buys: it withholds up to 340 s of the fastest
# channels' trajectories from the encoder and drops the source channels above the reference.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_transformer_cfs.trainer --config teb_vae/lag_attn_transformer_cfs/configs/sweep_align_target_max.yaml
base: default.yaml

model_config:
  VAE_model:
    causal_align_reference: target_max

advanced_config:
  tracking:
    mlflow:
      # IDENTITY: the arm in the name, on both keys, so a run's own records say which arm trained
      # even if the config it was launched from cannot be recovered.
      run_name: lag_attn_trf_cfs_align_target_max
      tags:
        variant: lag_attn_trf_cfs_align_target_max

# Co-training (SPEC §10.6, §13.3): the classifier and the VAE objective together, the posterior's delta heads
# trainable, L2-SP to the pretrained weights, best.ckpt selected on val/guid_logloss_gated (the preservation gate).
# The fragile end of the ladder: read it against the frozen unit it trains beside (summary.md §4).
base: default.yaml

classifier:
  run: {name: trf_cfs_adverse_seq_cotrain}
  train:
    regime: cotrain
    unfreeze: [posterior_head.delta_mu_head]

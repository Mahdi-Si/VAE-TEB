# Causal-input arm: causal_reach_budget_s = 120, keeping 78 of 109 target and 29 of 58 source
# channels at a worst-case delay of 30 steps.
#
# The arm this architecture exists to make runnable. The stored features are two-sided wavelet
# transforms; a finite budget prunes every channel whose forward reach exceeds it and reads each
# survivor delayed by ceil(reach / 4) steps, so the first max_delay steps of every surviving
# channel are exact zeros. In the encoder this replaces, that zero-filled prefix entering repeated
# normalisation layers drives the global gradient norm to about 1e26 at *every* finite budget --
# a switch rather than a gradient, so raising the warm-up does not help and the clip coefficient
# leaves the run optimising nothing but weight decay.
#
# Here the input adapter carries the availability projection W_m and the start embedding e_start,
# which turn "this position is empty" into a representation rather than a numerical accident. Both
# parameters exist only under a finite budget, and both exist under this one. Measured on the
# committed smoke shard the guarded gradient norm stays inside the same order of magnitude as the
# unguarded run's.
#
# 120 s is the deepest admissible budget at the shipped warm-up: its worst delay is exactly 30
# steps, and the resolver refuses a maximum delay that outruns warmup_period. A shorter budget
# would resolve too; a longer one needs its own raised warm-up and is not part of this roadmap.
#
# Arms at different budgets build different input-adapter widths, so no two of them share a
# checkpoint, and neither shares one with the unguarded baseline.
#
#   TEB_RUN_STAMP="$(date '+%Y-%m-%d--[%H-%M]')" torchrun --nproc_per_node=7 \
#       -m teb_vae.lag_attn_transformer_rws.trainer \
#       --config teb_vae/lag_attn_transformer_rws/configs/sweep_reach_120.yaml
base: default.yaml

model_config:
  VAE_model:
    causal_reach_budget_s: 120

# Explicit-Lag Sparse Variational Transfer Bottleneck (ELS-VTEB-v2) config.
#
# Drop-in successor to config_lag_attn_v1.yaml for the SAME trainer
# (trainer_lag_attn_v1.py). Activate v2 by toggling the SeqVaeLagAttn alias in
# every consumer (a single commented import line) from SeqVaeLagAttnV1 to
# SeqVaeLagAttnV2, then point the trainer at this config.
#
# Key differences from v1 (see vae-teb-lag-attn-v2-spec-and-sprints.md):
#   * The KL is the exact v2 decomposition K^R + free-bits-floored K^Z,
#     normalized per valid (b,t) and summed over heads (arch spec section 19).
#     This is ~d_z (=24)x LARGER than v1's per-dim-mean KL, so beta is RETUNED:
#     beta_max ~= 5e-2 here vs ~0.1 in v1. Content-KL free bits are governed by
#     ``kappa_z`` (nats/dim); the legacy ``free_bits`` kwarg is deprecated and
#     set to 0.0.
#   * Curriculum: ``curriculum.stages`` drives (enable_source/residual/kl,
#     active_lags, beta) per epoch via SeqVaeLagAttnV2._resolve_stage, applied by
#     SeqVaeLagAttnPl._apply_curriculum. Because it drives beta through
#     ``kld_beta``, NO ``beta_schedule`` block is set (they would conflict).
#   * The v1 ``encoder`` nested group (conv+LSTM extra_dilations) is DEAD in v2
#     (the target encoder is a fixed gated-TCN) and is omitted. ``horizon_refine``
#     is retained: v2 reuses the v1 shared horizon decoder core.
#
# Prerequisites (identical to v1): HDF5 datasets with up_st/up_ph as first-class
# fields, and a regenerated stats file. use_up_st toggles the source stream
# (concat(up_st, up_ph), c_u=101) vs up_ph alone (c_u=58).

general_config:
  tag: lag_attn_v2_baseline

  cuda_devices: [0, 1, 2, 3, 4, 5, 6]
  lr: 0.001
  lr_milestone: [1000]
  checkpoint_frequency: 1
  plot_frequency: 1
  epochs: 5000
  accumulate_grad_batches: 1
  batch_size:
    train: 128
    test: 128

  folders_config:
    out_dir_base: /data/deid/isilon/MS_model/new_vae_teb_cross_attention/lag_attn_v2

model_config:
  VAE_model:
    # --- KL / beta -------------------------------------------------------
    # ``curriculum.stages`` (below) drives beta per-epoch; ``kld_beta`` is the
    # pre-hook / curriculum-disabled fallback. NO ``beta_schedule`` here (it
    # would override the curriculum's beta inside _resolve_beta). beta_max is on
    # the v2 (spec-form) KL scale.
    kld_beta: 5.0e-2
    # Legacy per-element KL floor: DEPRECATED in v2 (ignored with a warning).
    # The content-KL free-bits floor is ``kappa_z`` (nats per latent dim).
    free_bits: 0.0
    kappa_z: 0.05           # content-KL free bits (nats/dim); floors K^Z only

    # Reconstruction likelihood. gaussian_nll puts feat/base losses in nats,
    # directly comparable to the decomposed KL. 'learned' sigma also lets the
    # trainer drop DDP find_unused_parameters (see _select_ddp_strategy).
    likelihood: gaussian_nll
    sigma_obs: 1.0

    # A3 - baseline/residual gradient separation for L_feat.
    detach_baseline_in_full: true

    # Feature-loss weighting.
    lambda_full: 1.0
    lambda_base: 0.5

    # --- Backbone widths -------------------------------------------------
    d_model: 128
    d_z: 24                 # 4 heads x 6 dims
    horizon: 30             # H_d = 30 decimated steps = 2 min forecast
    warmup_period: 30       # first 2 minutes ignored in feature & KL losses
    sequence_length: 300
    c_y: 87                 # 43 (fhr_st) + 44 (fhr_ph)
    c_u: 101                # 43 (up_st) + 58 (up_ph); must equal 58 if use_up_st=false
    use_up_st: true
    dropout: 0.1
    decoder_hidden: 128
    logvar_clamp: [-5.0, 3.0]
    mu_scale: 5.0
    delta_mu_scale: 3.0
    latent_stats_momentum: 0.01
    context_dim: 5          # non-outcome temporal context (deferred; zero-valued)

    # --- v2 target encoder (gated causal TCN; replaces v1 conv+LSTM) -----
    target_encoder_blocks: 6
    target_kernel: 5
    target_dilations: [1, 2, 4, 8, 16, 32]   # receptive field 1 + 4*sum = 253 steps

    # --- v2 source lag-atom encoder (bounded receptive field) -----------
    source_scales: [3, 9, 21]                # <= 21 decimated steps (~84 s)
    d_u: 96                                    # source adapter width

    # --- Lag attention / posterior --------------------------------------
    max_lag: 90             # L = 91 (~6 minutes of UP history at 4 s/step)
    num_heads: 4
    d_head: 32              # remapped to the lag-attention value dim d_v in v2
    d_k: 16                 # lag-attention key/query dim
    d_e: 32                 # shared lag-embedding dim
    # entmax15 gives exactly-zero weights for irrelevant lags (self-contained,
    # no package dependency). Set false for the softmax ablation arm.
    use_entmax: true
    active_lags: 8          # top-Ka active lags (main training)
    active_lags_warmup: 16  # active lags during warm-up (set by the curriculum)
    # Smooth Gaussian-basis lag-bias defaults (centers span [0, 90]); widths
    # derived from local inter-center spacing when unset.
    lag_smoothness_lambda: 1.0e-3   # weight of the lag-bias smoothness penalty

    # --- v2 lag regularizers (model-owned weights) ----------------------
    lambda_tv: 1.0e-4       # temporal lag-stability |alpha_t - alpha_{t-1}|_1
    lambda_ent: 0.0         # lag-entropy penalty (entmax already sparsifies)

    # --- Physical-time lag reporting (Sprint 7 diagnostics) -------------
    step_seconds: 4.0
    delta_up_seconds: 20.0  # dataset applies a fixed 20 s UP delay

    # --- Optional flag-gated features (Sprint 7; default off) -----------
    use_crossphase_bias: false
    c_cross: 79
    use_outcome_head: false
    outcome_classes: 3

    # --- Shared horizon decoder core (reused v1 block) ------------------
    # ``depth`` dilated horizon-conv blocks + FiLM, shared between the baseline
    # and residual decoders so the residual is a correction in the baseline's
    # representation space.
    horizon_refine:
      depth: 3
      kernel: 3
      film: true

    # --- Curriculum schedule (arch spec section 23) ---------------------
    # Consumed per-epoch by SeqVaeLagAttnPl._apply_curriculum (production) and
    # SyntheticSeqVaeLagAttnV2Pl._apply_curriculum (synthetic). Stage 1 pretrains
    # the target-only baseline; Stage 2 attaches the source residual with a weak
    # constant beta and Ka=16; Stage 3 anneals Ka to 8 and warms beta to
    # beta_max over 50 epochs. Epoch boundaries are production-scale placeholders.
    curriculum:
      enabled: true
      stages:
        - start_epoch: 0
          active_lags: 16
          enable_source: false
          enable_residual: false
          enable_kl: false
          beta: 0.0
        - start_epoch: 5
          active_lags: 16
          enable_source: true
          enable_residual: true
          enable_kl: true
          beta: {kind: constant, value: 1.0e-4}
        - start_epoch: 15
          active_lags: 8
          enable_source: true
          enable_residual: true
          enable_kl: true
          beta:
            kind: linear_warmup
            start: 1.0e-4
            end: 5.0e-2
            warmup_epochs: 50
            warmup_start_epoch: 15

    # Loss-spike circuit breaker (see SeqVaeLagAttnPl.training_step).
    loss_spike_skip:
      enabled: true
      multiplier: 5.0
      ema_momentum: 0.02
      warmup_batches: 100
      warn_on_skip: true
      # After this many CONSECUTIVE skips, force-accept one (finite-loss) batch and
      # hard-re-seed the EMA -- prevents a collapsed EMA from freezing training. 0 off.
      max_consecutive_skips: 25

  core_model_checkpoint: null

  classifier:
    vae_checkpoint: /path/to/your/trained/vae/checkpoint.ckpt
    type: lstm
    latent_dim: 24
    num_classes: 2
    freeze_vae: true
    use_posterior: true
    sample_latent: false
    hidden_dim: 128
    num_layers: 2
    bidirectional: false
    attn_dim: 64
    dropout: 0.1
    num_filters: 64
    kernel_sizes: [3, 5, 7]
    d_model: 128
    n_heads: 4
    dim_feedforward: 256
    pooling: mean

    evaluation:
      target_fpr: 0.05
      compute_both_thresholds: true
      generate_plots: true
      decision_time_hours: 1.0
      exclude_last_minutes: 30
      max_gap_multiplier: null


dataset_config:
    vae_train_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/train_dataset_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/train_dataset_no_cs.hdf5
    vae_test_datasets:
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/test_dataset_cs.hdf5
      - /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/pre_training_dataset/test_dataset_no_cs.hdf5


    stat_path: /data1/fetal-heart-tracing/HDF5_Datasets/12H_22min_tlo_stratified_20sec_updelay/stats.hdf5

    kfold_base_path: /data1/fetal-heart-tracing/HDF5_Datasets/last_12_hours_20_sec_delay/k_fold_cross_validation_dataset
    num_folds: 10
    classifier_train_datasets: []
    classifier_val_datasets: []
    classifier_test_datasets: []

    dataloader_config:
      num_workers: 4
      prefetch_factor: 4
      normalize_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'up_st', 'up_ph']
      dataset_kwargs:
        pin_memory: false
        load_fields:
          [
            'fhr',
            'up',
            'fhr_st',
            'fhr_ph',
            'up_ph',
            'up_st',
            'target',
            'weight',
            'epoch',
            'cs_label',
            'bg_label',
            'guid',
          ]
        allowed_guids: null
        cs_label: null
        bg_label: null
        epoch_min: null
        epoch_max: -48000
        label: null
        cache_size: 10000
        trim_minutes: 1.0


# Advanced configs ========================================================

advanced_config:
  trainer:
    precision: "32-true"
    gradient_clip_val: 0.5
    gradient_clip_algorithm: "norm"
    sync_batchnorm: false
    deterministic: false
    benchmark: true

  memory:
    enable_memory_monitoring: false
    memory_threshold_gb: 60.0
    memory_log_frequency: 500

  tracking:
    mlflow:
      enabled: true
      tracking_uri: "http://localhost:5000"
      experiment_name: seqvae-teb-lag-attn-v2
      run_name: lag_attn_v2_baseline
      artifact_location: null
      log_model: true
      log_config_artifact: true
      tags:
        project: teb_vae
        stage: dev
        variant: lag_attn_v2

  callbacks:
    early_stopping:
      enabled: false
      monitor: "val/total_loss"
      patience: 300
      min_delta: 0.0001

    model_checkpoint:
      monitor: "val/total_loss"
      save_top_k: 3
      mode: "min"

    loss_plotting:
      max_history_size: 10000

    reconstruction_plotting:
      enabled: true
      plot_frequency: 10
      num_examples: 3

    comprehensive_plotting:
      enabled: false
      plot_frequency: 1

    lag_attn_plotting:
      enabled: true
      plot_frequency: 1
      num_examples: 2
      file_format: "pdf"
      forecast_channels: [0, 43, 80]
      forecast_anchor_frac: 0.6

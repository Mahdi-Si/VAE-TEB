# config_synth_v3.yaml -- synthetic_v2 raw -> scattering -> block-TE on SeqVaeLagAttnV3.
#
# Purpose: re-run the ENTIRE synthetic_v2 experiment against SeqVaeLagAttnV3 (causal
# prior + zero-KL init + discriminating null control) on the SAME cache the v1 run used,
# so the K_bar-versus-TE calibration is measured on a model whose prior is actually causal.
# See SYNTHETIC_V3_SPEC_AND_SPRINTS.md.
#
# Additive and opt-in: config_synth_v2.yaml and the committed pl_module_v2 alias are
# untouched, so the v1 path is the default and this file is entered only by pointing the
# driver at it (`run_pipeline_v2.py --config config_synth_v3.yaml`). Every v3-specific key
# (experiment.data_tag, model.class, model.v3, arms, loss.beta_schedule,
# train.pilot_beta_schedule) is inert when absent.
#
# The `benchmarks:`, `dataset:`, `optim:`, `plotting:` blocks are copied VERBATIM from
# config_synth_v2.yaml: the three arms consume the same immutable .npz bytes, so any gamma
# difference is attributable to the model, not to a data change. Do not edit them here.

experiment:
  tag: G1_raw_v3               # results/<tag>/<arm>/... (per-arm, per this run)
  # The cache leaf keys on data_tag (falling back to tag); the results dir keys on tag. This
  # is what lets the three arms under tag: G1_raw_v3 read ONE immutable cache (S0-T01).
  #
  # HEADLINE / PROD RUN (current): `G1_raw_v2_notch` -- the full 12k-sample cache the v1
  # run used -- so the v1-vs-v3 gamma comparison is on identical .npz bytes.
  # DEV BOX: switch to `G1_raw_localpilot`, the reduced pilot cache built by S0-T00. The
  # two coexist because their data_tags differ.
  data_tag: G1_raw_v2_notch
  benchmark: G1_raw            # selects the active block under `benchmarks:`
  seed: 0

runtime:
  device: auto                 # auto -> cuda if available, else cpu
  cuda_device: 0               # GPU index for single-GPU runs
  gpus: [0]                    # GPU slot list for task-parallel multi-GPU work

paths:
  data_dir: ./data             # .npz split caches -> synthetic_v2/data/G1_raw/<data_tag>/
  results_dir: ./results       # checkpoints / figures / reports -> synthetic_v2/results/<tag>/<arm>/

# --- deterministic seeds (S0-T01): DGP, inverter Monte-Carlo, and shuffle -------
# Shared with the v1 run (all three arms share one seed set and one cache order, which is
# what makes a gamma difference attributable to the model). Must match the meta.json of the
# G1_raw_v2_notch cache.
seeds:
  base_seed: 0                 # umbrella seed
  dgp: 0                       # latent-pair + raw-rendering RNG
  inverter_mc: 0               # B_y_for_mean_te_block_state_space Monte-Carlo seed
  shuffle: 0                   # single shared row-aligned pool permutation

# --- the v2 benchmark (§16). Single pathway: NO m_grid. Copied VERBATIM from v2. -------
benchmarks:
  G1_raw:
    data:                      # coupled latent pair on the DECIMATED grid (§6)
      sequence_length: 300     # decimated, after trim
      horizon: 30
      K_history: 80
      oscillators: [[0.80, 0.10]]   # (r, omega) -> contraction rhythm ~0.004 Hz ; SINGLE pathway
      target_ar: 0.40
      sigma2_y: 1.0
      sigma2_eta: 0.01

    raw:                       # v2-only raw rendering (§5-§7). f_pulse is TRUE Hz.
      fs: 4.0
      n_raw: 5280              # 22 min ; transform input length
      render_mode: am_carrier  # {am_carrier (default), pulse_train, direct}
      f_pulse: 0.06            # Hz : contraction/deceleration pulse-shape carrier.
      fhrv_notch_enabled: true # Excise a one-Q-step neighbourhood around f_pulse from the FHRV bands.
      am_offset_ratio: 4.0     # a0 = ratio * a1 * max|c| (positivity margin); same for b0
      pulse_train:
        rate_hz: 0.06
        duty: 0.5
      direct:
        one_sided: true
      mu_fhr_bpm: [110, 160]
      mu_up: [5, 25]
      baseline_wander_std: { fhr: 3.0, up: 2.0 }
      decel_depth_bpm: [10, 40]
      contraction_mmHg: [40, 70]
      fhrv_band_power: { LF: 11.25, MF: 6.25, HF: 2.5 }
      accel: { amp_bpm: [10, 25], rate_per_min: 0.3 }
      noise_std: { fhr: 0.5, up: 0.5 }

    scattering:                # v2-only transform + normalisation (§11-§12)
      J: 11
      Q: 4
      T: 16
      max_order: 1
      batch_size: 32
      phase_min_freq: { fhr: 0.006, up: 0.002 }
      norm_stats_source: synthetic_pool
      real_fold_stats_path: null

    mix:                       # cell grid (§9.3) -- NO m_grid (single pathway)
      target_te_grid: [0.0, 0.5, 1.0, 2.0, 3.0]   # nats, incl. 0.0 null anchor
      lag_grid: [8, 12, 20]                        # decimated steps ; fixed per-cell lag.
      lag_mode: fixed
      n_per_cell_train: 800
      n_per_cell_val: 400
      n_per_cell_test: 800
      inverter:
        n_samples: 12000
        lo: 1.0e-4
        hi: 60.0
        tol: 0.005
        max_iter: 40

    eval:
      realizability:
        fatal: false
        frac_threshold: 0.7
        frac_upper: 1.3
        ridge: 1.0e-2
        n_anchors: 3
        n_seeds: 2
        pilot:
          target_te_grid: [0.0, 1.0, 2.0, 3.0]
          lag_grid: [4, 8]
          n_per_cell: 384
        recovery:
          f_pulse_grid: [0.02, 0.04, 0.06]
          am_offset_ratio_grid: [1.5, 2.5, 4.0]
          omega_grid: [0.06, 0.10]
          n_per_cell: 384
          target_te: 3.0
          D: 8
          lag1_autocorr_floor: 0.9
      null_controls: [shuffle, reverse]
      lag_mass_threshold: 0.8
      lag_tolerance_steps: 1
      # S3-T04 / G-D: gate that K_bar -> 0 on the TE_inj = 0 null cells. v3's zero-KL
      # initialisation means the calibration intercept no longer absorbs a random floor, so
      # this is a claim v1 structurally could not make.
      kbar_null_threshold: 0.05
      kld_analysis:
        density_variant: kbar

      # --- S5 (G-E): predictive calibration of the learned observation variance -------
      # Bridges the shipped testing/ kernels; folds its scalar summary into metrics.json
      # under `calibration_predictive` (NOT `calibration`, which is the gamma-vs-TE fit).
      # `te_coverage_*` gate the synthetic-only stratification: on the TE_inj = 0 cells the
      # model is a pure baseline forecaster, so its intervals should hold at nominal.
      calibration:
        levels: [0.5, 0.8, 0.9, 0.95]
        n_bins: 20
        max_samples: 2000
        te_coverage_level: 0.9
        te_coverage_tol: 0.10

      # --- S6 (G-F): interventional lag attribution ----------------------------------
      # Opt-in (default_on=false): masking each band costs one extra forward per batch, so
      # this is never folded into `eval`. Bands are INCLUSIVE lag-index ranges over
      # [0, max_lag]; they are the production physiologic partition, reported alongside the
      # per-cell true band L* = {max(0, D-H), ..., D-1}.
      #
      # margin_delta_L is in RELATIVE units (delta_L / feat_loss) and ships at 0.0, i.e. a
      # strict inequality. S8-T04 retunes it against a trained checkpoint; on the 400-step
      # pilot the source pathway has not switched on, so every delta_L sits at ~0 and the
      # gate is a training-progress signal, not a verdict (see Section 11).
      lag_intervention:
        bands:
          "0-5": [0, 5]
          "6-15": [6, 15]
          "16-30": [16, 30]
          "31-60": [31, 60]
          "61-90": [61, 90]
        max_samples: 512
        margin_delta_L: 0.0
        noop_atol: 1.0e-6

      # --- S7 (G-G): neural CMI, calibrated in absolute nats ---------------------------
      # Opt-in (default_on=false): fits one critic per (cell x config).
      #
      # THREE configurations, not two. `bias` isolates the conditioning only if U and Y+ are held
      # fixed -- but with U, Y+ in scattering space the resulting nats compare to TE_scat, which
      # S1-T05 established is ordinal-per-lag and inflated 2.4-5.9x. So the absolute-nats claim
      # gets its own model-free config:
      #   latent        : U = ground-truth source latent c window, Y+ = target latent d future,
      #                   c_t = d history.  Jointly Gaussian => the residualisation is EXACT, so
      #                   this is a real CMI in nats, comparable to TE_inj.  Reads no checkpoint.
      #   feature_gt    : U = u_stream window, Y+ = build_future_target, c_t = d history.
      #   feature_model : same U, Y+; c_t = the model's target_state[t].
      # bias = CMI(feature_model) - CMI(feature_gt) changes only c_t.
      #
      # The estimator residualises U and Y+ on c_t and bounds the residual MI with ONE InfoNCE
      # critic (the CCMI difference of two bounds was measured saturating; see S7-T02). The
      # estimate is therefore the CMI itself and is ceilinged at log(contrastive_batch):
      # log(32) = 3.4657 nats, which brackets the TE_inj = 3.0 cell. No absolute claim is made for
      # a cell whose TE_inj exceeds ceiling_claim_frac * ceiling = 2.77 nats.
      #
      # Capacity resolved in S7-T03 (Section 11). Bigger critics OVERFIT: the held-out InfoNCE of
      # an unstopped critic collapsed to -22 nats on a null cell. Early stopping on a validation
      # slice of the fit samples is what makes the null cells read ~0; n_iters is a budget, not a
      # tuning knob.
      cmi:
        configs: [latent, feature_gt, feature_model]
        latent_lookback: 24     # >= max(D) = 20; longer accrues a log-det bias (Section 11)
        u_lookback: 24
        c_lookback: 24
        # Model-free channel reduction, the same slice measure_te_scat makes. At `all` the source
        # anchor is 24x101 = 2424-dim and the target 30x87 = 2610-dim against a few thousand
        # CORRELATED anchors per cell: the critic memorises and the held-out bound falls to -5 nats
        # or worse -- a valid but vacuous lower bound. At `coupled` the anchors are 24- and 30-dim.
        u_channels: coupled     # all | coupled (meta.coupled_channel.up_st)
        y_channels: coupled     # all | coupled (meta.coupled_channel.fhr_st)
        anchor_stride: 3
        max_anchors_per_cell: 12000
        max_samples: 512
        critic_width: 64        # 128x2 overfits: min ratio to truth 0.64 vs 0.73 at 64x1
        critic_depth: 1
        embed_dim: 16
        contrastive_batch: 32   # ceiling = log(32) = 3.4657 nats
        n_iters: 6000           # budget; early stopping ends the fit at 50-3000 steps
        eval_every: 50
        patience: 15
        val_frac: 0.25
        fit_frac: 0.5
        lr: 1.0e-3
        n_boot: 2000
        ceiling_claim_frac: 0.8

# --- model constructor kwargs -------------------------------------------------
# Flat block: the v1-compatible kwargs SeqVaeLagAttnV3 inherits (c_y=87 / c_u=101). The
# v3-specific machinery lives in the `v3:` overlay below.
model:
  class: SeqVaeLagAttnV3       # resolved by pl_module_v2._resolve_model_class; absent -> v1 alias
  sequence_length: 300
  d_model: 128
  d_z: 24
  horizon: 30
  warmup_period: 30
  c_y: 87                      # 43 + 44
  c_u: 101                     # 43 + 58; must equal 58 if use_up_st=false
  use_up_st: true
  max_lag: 90
  num_heads: 4
  d_head: 32
  lstm_layers: 2
  dropout: 0.1
  decoder_hidden: 128
  logvar_clamp: [-5.0, 3.0]
  mu_scale: 5.0
  delta_mu_scale: 3.0
  latent_stats_momentum: 0.01
  attention_grad_checkpoint: false
  head_structured_latent: true   # held true across arms; makes freeze_unused_attn_proj necessary
  horizon_depth: 3
  horizon_kernel: 3
  horizon_film: true
  encoder_extra_dilations: [8, 16]

  # --- v3 overlay (applied ONLY under a v3 class; gated on `posterior_logvar`) ---
  # build_model strips this block and merges it over the flat keys above when the resolved
  # class accepts `posterior_logvar` (i.e. SeqVaeLagAttnV3). The overlay is applied LAST, so
  # it wins over any flat key -- which is exactly why the per-arm deltas below live INSIDE
  # `arms.<name>.model.v3` (not at the flat `model` level): an arm delta at the flat level
  # would be clobbered by this overlay and all three arms would build identically.
  v3:
    causal_norm: true              # G0: the causal-normalisation fix (the headline claim)
    posterior_logvar: residual     # G1: residual posterior log-variance
    logvar_bound: smooth           # G2: smooth (soft) log-variance bounds
    delta_logvar_scale: 2.0
    kld_support: anchor            # G3: anchor-aligned KL support
    lag_bias_init: alibi_decay     # G5: ALiBi lag decay
    use_entmax: true               # sparse lag attention
    freeze_unused_attn_proj: true  # frees `find_unused_parameters=False` under head_structured_latent
    lambda_perm: 0.0               # v3 Finding F2: permutation control is a READOUT only, never a loss
    perm_every_n_batches: 4

# --- v3 curriculum: DISABLED. The objective is held fixed across arms so the ablation
# ladder is unconfounded; the zero-KL bottleneck is opened by loss.beta_schedule, not by a
# curriculum. `_apply_curriculum` is a no-op for v3 (no set_curriculum_stage) regardless.
curriculum:
  enabled: false

# --- loss: the FIXED objective, held identical across all three arms --------------------
loss:
  kld_beta: 0.001              # fallback constant when beta_schedule is absent (unused here)
  lambda_full: 1.0
  lambda_base: 0.5
  likelihood: gaussian_nll     # nat-scale K_bar calibration + learned-variance calibration (G-E)
  sigma_obs: learned           # decoder emits logvar_full -> per-horizon NLL / CRPS / coverage
  free_bits: 0.0               # DELIBERATE: with free_bits=0 the training KL == the raw KL
                               # (kld_train == kld_raw), so kld_nats is an honest TE surrogate
                               # and the null-cell gate (kbar -> 0) is meaningful.
  detach_baseline_in_full: true    # A3 baseline/residual gradient separation (forward unchanged)
  # beta schedule for the HEADLINE run: linear warmup so the zero-KL bottleneck can GROW K to
  # earn prediction gain (v3 starts at K == 0 exactly; a fixed beta from step 0 risks a run
  # where the source path never switches on). The pilot uses train.pilot_beta_schedule (a
  # 20-epoch warmup exceeds the pilot budget entirely).
  #
  # `end: 1e-4` CHOSEN ON THE S2-T05 SWEEP EVIDENCE (2026-07-09), not left at the 1e-3
  # placeholder. That sweep (see the `train:` block) measured, at end=1e-3, kld_raw = 0.0030
  # with only 4% of latent dims active -- a near-collapsed posterior, which would make K_bar
  # useless as a TE surrogate and silently null the headline result. At end=1e-4 the
  # bottleneck stays open (kld_raw = 0.091, 71% active) and pred_gap is still positive.
  #
  # Caveat: the sweep ran on the REDUCED local cache for 200 steps, not the 100-epoch /
  # 12k-sample headline run, so the long-run dynamics may differ. Watch `kld_active_frac`
  # (signal #4 of the S8-T03 runbook) on the first headline run; if it collapses below ~30%,
  # lower `end` again. Note the LR milestone at epoch 10 (x0.1) lands mid-ramp, so the
  # bottleneck opens while the LR is already reduced.
  beta_schedule:
    kind: linear_warmup
    start: 1.0e-5
    end: 1.0e-4
    warmup_epochs: 20

# --- the three-arm ablation ladder (S0-T04a resolve_arm deep-merges arms.<name>) --------
# Each arm carries ONLY its per-arm deltas, INSIDE model.v3 so they override the base v3
# overlay (see the v3-overlay comment above). parity -> v3_noncausal isolates G1/G2/G3/G5;
# v3_noncausal -> v3_prod isolates G0 (causal_norm), the headline claim. The loss block is
# NOT touched by any arm, so the objective is byte-identical across the three.
arms:
  parity:
    model:
      v3:
        causal_norm: false
        posterior_logvar: independent
        logvar_bound: clamp
        kld_support: full
        lag_bias_init: normal
        use_entmax: false
  v3_noncausal:
    model:
      v3:
        causal_norm: false
  v3_prod:
    model:
      v3:
        causal_norm: true

# --- DataLoader knobs (copied VERBATIM from v2) ------------------------------------
dataset:
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  mmap: auto

# --- multi-GPU DDP training ---------------------------------------------------
# strategy: auto defers to _select_ddp_strategy (S2-T04), which resolves to plain 'ddp' for
# the v3 arms (gaussian_nll + sigma_obs learned + head_structured_latent + frozen attn proj)
# rather than paying for ddp_find_unused_parameters_true every step. An explicit value here
# would win over the resolved one. The resolved strategy and device count are printed at
# startup as `[train_v2] devices=... | n_gpus=... | DDP strategy: ...`.
#
# `devices` is the device count for a HEADLINE (non---pilot) train stage; a --pilot run takes
# train.devices instead, and an explicit --devices beats both.
ddp:
  devices: 8
  strategy: auto
  precision: 32-true
  sync_batchnorm: true
  lr_scaling: false
  warmup_epochs: 5
  num_sanity_val_steps: 0
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  early_stopping:
    enabled: false
    monitor: val/total_loss
    mode: min
    patience: 15
    min_delta: 0.0

# --- optimiser / training loop (copied VERBATIM from v2) ---------------------------
optim:
  lr: 0.001
  weight_decay: 0.0
  epochs: 100
  batch_size: 32
  grad_clip_norm: 0.5
  lr_milestones: [10, 50]
  lr_gamma: 0.1

# --- training-curve plotting (copied VERBATIM from v2) -----------------------------
plotting:
  enabled: true
  plot_every: 10
  html: true

# --- training driver knobs ----------------------------------------------------
# The headline run uses loss.beta_schedule (20-epoch warmup); a --pilot run of a few epochs
# would keep beta pinned near start=1e-5 the whole time, so the pilot uses its OWN short
# warmup (pilot_beta_schedule) -- otherwise the S2-T05 bottleneck-health gate (kld_raw >
# eps_open, pred_gap > eps_gap) could never fire inside the pilot budget.
# S2-T05 TUNING (measured on the reduced local pilot cache, arm v3_prod, 2-epoch beta warm-up).
#
# (a) END-BETA SWEEP at 10 epochs x 20 batches = 200 steps:
#
#     end_beta | kld_raw | active latent dims
#     ---------|---------|-------------------
#       1e-4   | 0.0911  | 71%   <- chosen: bottleneck stays open
#       3e-4   | 0.0118  | 39%
#       1e-3   | 0.0030  |  4%   <- near-collapse (see loss.beta_schedule)
#
#     beta must stay LOW or the posterior collapses; at end=1e-2 the latent fully collapsed
#     (kld_active_frac -> 0.000 by epoch 3).
#
# (b) PILOT BUDGET, chosen so the bottleneck-health gate can actually fire. pred_gap needs
#     enough steps for the residual source head to earn prediction gain (3 seeds, end=1e-4):
#
#     steps | median kld_raw | median pred_gap | min pred_gap
#     ------|----------------|-----------------|-------------
#        12 |      0.0271    |   -9.8e-3       |  (negative)   <- the ORIGINAL pilot: gate cannot fire
#       200 |      0.0312    |   -1.3e-4       |  -7.4e-4      <- seed-noise around zero
#       400 |      0.0376    |   +4.9e-3       |  +3.6e-3      <- chosen: all 3 seeds positive
#
#     => pilot_epochs=20 x pilot_limit_train_batches=20 = 400 steps.
#        Thresholds (test_train_v3_pilot.py): EPS_OPEN=1e-3 (20x the worst seed's kld_raw),
#        EPS_GAP=1e-4 (36x the worst seed's pred_gap). Both far above float noise.
train:
  pilot_epochs: 20
  pilot_limit_train_batches: 20
  pilot_limit_val_batches: 4
  pilot_batch_size: 16
  devices: 1                   # --pilot device count only; headline uses ddp.devices
  pilot_beta_schedule:
    kind: linear_warmup
    start: 1.0e-5
    end: 1.0e-4
    warmup_epochs: 2

# --- optional beta-selection stage (default OFF) ------------------------------
beta_select:
  enabled: false
  beta_grid: [1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3]
  epochs: 5

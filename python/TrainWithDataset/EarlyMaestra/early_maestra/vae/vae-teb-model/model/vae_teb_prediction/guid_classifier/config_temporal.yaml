general_config:
  tag: "temporal_classifier_run_1"              # Run name for logging and output dirs
  cuda_devices: [0, 1, 2, 3, 4]                # GPU IDs available for k-fold parallel training
  max_parallel_folds: 5                         # Max folds training simultaneously
  plot_frequency: 10                            # Log plots every N epochs
  lr: 0.001                                     # 1e-3 for randomly initialized heads
  lr_milestone: [100]                           # Epochs at which LR is decayed (MultiStepLR)
  epochs: 1000                                  # Max training epochs per fold
  accumulate_grad_batches: 1                    # Gradient accumulation steps (effective batch = this * batch_size)
  batch_size:
    train: 8                                    # GUIDs per batch (not segments)
    test: 8                                     # GUIDs per batch for val/test inference
  folders_config:
    out_dir_base: /path/to/temporal_results     # Root output dir for all folds and results

model_config:
  vae_checkpoint: /path/to/vae.ckpt            # Pre-trained frozen VAE checkpoint path
  freeze_vae: true                              # Freeze all VAE weights during training
  use_posterior: true                           # Use posterior mean (true) or prior mean (false) from VAE
  vae_chunk_size: 32                            # Segments per VAE forward chunk (controls GPU memory)

  segment_encoder:
    type: "lstm"                                # "mean_pool" (d_seg=16) | "lstm" | "cnn"
    d_seg: 64                                   # Segment representation dimension (ignored for mean_pool)
    lstm_hidden: 64                             # LSTM hidden size, should match d_seg
    cnn_kernel: 7                               # Causal conv kernel size (only used when type: "cnn")

  temporal_lstm:
    hidden_dim: 128                             # Temporal LSTM hidden size (context across segments)
    num_layers: 2                               # Stacked LSTM layers
    dropout: 0.1                                # Dropout between LSTM layers

  gap_encoding: "concat"                        # How to encode inter-segment gaps: "concat" | "time_decay" | "both"

  temporal_features:
    delta_t:
      enabled: true                             # Include inter-segment time gap features (hours + log-scaled)
    segment_index:
      enabled: true                             # Learned absolute position embedding from grid slot index
      embed_dim: 16                             # Position embedding dimension
      max_index: 40                             # Max grid slot index (~36 slots + safety margin)
    time_from_labor_onset:
      enabled: true                             # Include time since labor onset (NaN-safe)
      nan_strategy: "flag"                      # NaN handling: zero value + binary availability flag

  classifier_head:
    num_classes: 2                              # Binary: 0=healthy, 1=unhealthy (acidosis/HIE)
    dropout: 0.1                                # Dropout in MLP head
    mlp_multiplier: 2.0                         # Hidden layer size = hidden_dim * multiplier

  precompute_latents: false                     # true = skip VAE forward, load cached mu_post from disk

  evaluation:
    target_fpr: 0.2                             # Target false positive rate for threshold selection
    decision_time_hours: 1.0                    # Time window for committed metrics (hours before delivery)
    exclude_last_minutes: 30                    # Exclude segments within N min of delivery from metrics
    max_gap_multiplier: null                    # Max allowed gap between segments (null = no limit)
    generate_plots: true                        # Generate three-metric-type analysis plots
    allow_backward_compat_checkpoint_loading: false  # true = allow partial temporal checkpoint loading during evaluation

dataset_config:
  kfold_base_path: /path/to/k_fold_dataset      # Root dir containing fold_1/ ... fold_10/ HDF5 splits
  num_folds: 10                                  # Total number of cross-validation folds
  fold_ids: null                                 # Which folds to run (null = all, e.g. [1,2,3] for subset)
  stat_path: /path/to/stats.hdf5                 # Normalization statistics file (mean/std per field)

  dataloader_config:
    num_workers: 4                               # DataLoader worker processes
    prefetch_factor: 4                           # Batches prefetched per worker
    normalize_fields: ['fhr', 'up', 'fhr_st', 'fhr_ph', 'fhr_up_ph']  # Fields to z-score normalize
    segment_duration: 1200.0                     # Grid slot duration in seconds (20 min)
    guid_cache_size: 128                         # Max GUIDs held in memory (LRU eviction)
    dataset_kwargs:
      load_fields:                               # HDF5 fields to load per segment
        - fhr_st                                 # Scattering transform of FHR
        - fhr_ph                                 # Phase coefficients of FHR
        - fhr_up_ph                              # Cross-phase + UP self-phase coefficients
        - target                                 # Per-timestep class labels (300,)
        - weight                                 # Per-timestep validity mask (300,)
        - epoch                                  # Segment timestamp in seconds relative to delivery
        - cs_label                               # C-section label (bool)
        - bg_label                               # Blood gas label (bool)
        - guid                                   # Recording identifier
        - time_from_labor_onset                  # Seconds since labor onset (NaN if unavailable)
      epoch_min: -23000                          # Earliest epoch to include (seconds before delivery)
      trim_minutes: 1.0                          # Trim N minutes from segment edges (quality filter)

  bucket_sampler:
    enabled: true                                # Group GUIDs by segment count for efficient padding
    bucket_ranges: [[1, 5], [6, 12], [13, 20], [21, 40]]  # Segment count ranges per bucket
    shuffle: true                                # Shuffle within buckets and across batch order each epoch

advanced_config:
  trainer:
    precision: '32-true'                         # Training precision (32-true, 16-mixed, bf16-mixed)
    gradient_clip_val: 0.5                       # Max gradient norm for clipping
    gradient_clip_algorithm: 'norm'              # Clipping algorithm: 'norm' or 'value'
    deterministic: false                         # Deterministic ops (slower but reproducible)
    benchmark: true                              # cuDNN benchmark mode (faster for fixed input sizes)
  callbacks:
    early_stopping:
      enabled: true                              # Stop training when val/loss plateaus
      patience: 30                               # Epochs without improvement before stopping
      monitor: 'val/loss'                        # Metric to monitor for early stopping
    model_checkpoint:
      save_top_k: 3                              # Keep top-K checkpoints by monitored metric
      monitor: 'val/loss'                        # Metric to monitor for checkpoint saving
